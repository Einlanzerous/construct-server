# Traefik dynamic configuration — Zero Gravity Industries hybrid edge (SERV-20)
#
# Explicit allowlist. Only the routers below are served. On the public entrypoint,
# anything that is not Argosy or the Lyceum direct path (SERV-60) is refused by
# `public-catchall`. The tunneled routers exist ONLY on the internal entrypoint, so
# the open WAN port physically cannot reach them — that is the "no tunnel bypass via
# the open port" guarantee.

http:
  middlewares:
    # Strip spoofable identity headers on ingress. Applied to BOTH entrypoints via
    # entryPoints.*.http.middlewares in traefik.yml. An empty value deletes the
    # header, so a client cannot inject a forged identity that an app might trust.
    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-Authentik-Username: ""
          X-Authentik-Groups: ""
          X-Authentik-Email: ""
          X-Authentik-Name: ""
          X-Authentik-Uid: ""
          X-Authentik-Jwt: ""
          X-Authentik-Meta-Jwks: ""
          X-Authentik-Meta-Outpost: ""
          X-Authentik-Meta-Provider: ""
          X-Authentik-Meta-App: ""
          X-Authentik-Meta-Version: ""
          Remote-User: ""
          Remote-Groups: ""
          Remote-Email: ""
          Remote-Name: ""
          X-Forwarded-User: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Email: ""
          X-Forwarded-Preferred-Username: ""

    # Public edge only: Cloudflare Access is NOT in front of the direct Argosy path,
    # so a client must not be able to inject Cf-Access-* trust headers. On the
    # internal entrypoint these arrive from cloudflared and are cryptographically
    # validated by cf-access-jwt below (SERV-106) — so they are NOT stripped there.
    strip-cf-access:
      headers:
        customRequestHeaders:
          Cf-Access-Jwt-Assertion: ""
          Cf-Access-Authenticated-User-Email: ""

    # Deny-all for the public catch-all. Traefik has no native 444; an ipAllowList
    # with an unmatchable source range returns 403 before any backend is reached.
    # A true connection-drop (444) can be layered on later at the relay or via a
    # plugin — the security property (unknown hosts get nothing) already holds.
    deny-all:
      ipAllowList:
        sourceRange:
          - "255.255.255.255/32"

    # Login brute-force throttle for the WAN-exposed Argosy auth endpoints (SERV-27).
    # Applied ONLY via the argosy-auth router below (scoped to /api/v1/auth/*), so it
    # never touches media/HLS-segment requests. Per client IP — the public edge trusts
    # no X-Forwarded-* (traefik.yml forwardedHeaders.trustedIPs: []), so this is the
    # real remote IP arriving via the router's DNAT. Token bucket: 5 req/s sustained,
    # bursts up to 15.
    argosy-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

    # Login brute-force throttle for Lyceum's WAN-exposed auth endpoints (SERV-60).
    # Applied ONLY via the lyceum-public-auth router below (scoped to /auth/*), so it
    # covers pairing-code / invite redemption (POST /auth/session) without touching
    # book/reader traffic. Sits at the edge on top of Lyceum's in-app pairingLimiter.
    # Per client IP (same rationale as argosy-login-ratelimit — the public edge trusts
    # no X-Forwarded-*). Token bucket: 5 req/s sustained, bursts up to 15.
    lyceum-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

    # Origin-side validation of Cf-Access-Jwt-Assertion (SERV-106). Every router on
    # the `internal` entrypoint carries this, and scripts/check-edge-auth.sh fails if
    # one does not — a tunneled router that forgets it is unauthenticated, and that is
    # the whole class of bug this closes.
    #
    # Cloudflare Access is enforced at Cloudflare's EDGE. Without this the origin
    # re-checked nothing, so a request that reached :9080 at all was served whatever
    # Host it claimed. cf-access-guard verifies the JWT against the team's published
    # signing keys and the AUD registered for that host; anything else gets a 403 here
    # and never reaches a backend. See services/cf-access-guard/.
    cf-access-jwt:
      forwardAuth:
        address: "http://cf-access-guard:4020/verify"
        # FALSE is the default; it is spelled out because it is load-bearing. The guard
        # picks which AUD to require from X-Forwarded-Host. With this true, Traefik
        # would pass the CLIENT's X-Forwarded-Host through, letting a caller name one
        # host for the audience check while the router serves a different backend. False
        # makes Traefik set that header itself, from the same Host the router matched.
        trustForwardHeader: false
        # Forward only the assertion. Traefik still adds the X-Forwarded-* set it
        # computes itself (the filter runs before those are written), so the guard keeps
        # the host it needs — but the real request's session cookies and Authorization
        # headers never reach it. It has no use for them and should not hold them.
        authRequestHeaders:
          - "Cf-Access-Jwt-Assertion"

    # CrowdSec bouncer (SERV-27): rejects IPs with an active CrowdSec decision
    # before anything else runs. `live` mode = one LAPI round-trip per new client
    # IP (then cached). The LAPI key is minted with `cscli bouncers add` and
    # injected via the container env (file provider go-templating). LAN, tailnet
    # and loopback are exempt so a misfiring scenario can never lock us out of
    # our own edge.
    crowdsec-bouncer:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKey: '{{ env "CROWDSEC_BOUNCER_KEY" }}'
          clientTrustedIps:
            - "10.0.0.0/24"      # home LAN
            - "100.64.0.0/10"    # tailnet
            - "172.16.0.0/12"    # docker networks
            - "127.0.0.1/32"

  routers:
    # ---------------- PUBLIC entrypoint: Argosy ONLY ----------------
    argosy:
      entryPoints:
        - public
      rule: "Host(`argosy.zerogravity.industries`)"
      service: argosy
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same Argosy backend, but the auth endpoints get the login rate-limit. Higher
    # priority than `argosy` so /api/v1/auth/* matches here; everything else (incl.
    # media/HLS segments) falls through to `argosy` unthrottled.
    argosy-auth:
      entryPoints:
        - public
      rule: "Host(`argosy.zerogravity.industries`) && PathPrefix(`/api/v1/auth/`)"
      priority: 1000
      service: argosy
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - argosy-login-ratelimit
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # ---------------- PUBLIC entrypoint: Lyceum direct path (SERV-60) ----------------
    # Puts Lyceum on the open 443 edge alongside Argosy so the Flutter app (LYCM-101)
    # can reach it with a bearer token — no Tailscale, no Cloudflare Access. Points at
    # the SAME `lyceum` backend as the tunneled `lyceum` router; the only difference is
    # this host isn't SSO-gated, so a client falls back to invite/pairing (correct).
    # strip-cf-access ensures a spoofed Cf-Access-* on this path authenticates nobody.
    lyceum-public:
      entryPoints:
        - public
      rule: "Host(`lyceum-direct.zerogravity.industries`)"
      service: lyceum
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same Lyceum backend, but /auth/* gets the login rate-limit. Higher priority than
    # lyceum-public so pairing-code / invite redemption is throttled at the edge;
    # everything else (books, reader, covers) falls through to lyceum-public unthrottled.
    lyceum-public-auth:
      entryPoints:
        - public
      rule: "Host(`lyceum-direct.zerogravity.industries`) && PathPrefix(`/auth/`)"
      priority: 1000
      service: lyceum
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - lyceum-login-ratelimit
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Lowest-priority deny-all. Any Host/SNI on :public that is not Argosy or the
    # Lyceum direct host is refused (403). Defense-in-depth: the tunneled routers
    # below do not exist on this entrypoint at all, so there is nothing to bypass to.
    public-catchall:
      entryPoints:
        - public
      rule: "HostRegexp(`.+`)"
      priority: 1
      service: blackhole
      middlewares:
        - deny-all
      tls: {}

    # ------------- INTERNAL entrypoint: tunneled apps -------------
    # Reachable only via cloudflared, which is the only other member of
    # construct_edge_net (SERV-107). EVERY router here carries `cf-access-jwt`, which
    # is what makes reaching the entrypoint insufficient on its own (SERV-106) —
    # check-edge-auth.sh fails if a new one is added without it.
    switchyard:
      entryPoints:
        - internal
      rule: "Host(`switchyard.zerogravity.industries`)"
      service: switchyard
      middlewares:
        - cf-access-jwt
      # No TLS: internal is plain HTTP (Cloudflare terminates TLS at the edge and
      # the tunnel encrypts the wire).

    # Lyceum (LYCM-803): tunneled + Cloudflare Access, mirroring switchyard. HTTP
    # on the internal entrypoint — no tls block. Cf-Access-Jwt-Assertion is
    # preserved here (only stripped on the public entrypoint), checked by
    # cf-access-jwt before the request is proxied, and checked AGAIN by Lyceum's
    # own backend for SSO sign-in. The two are not redundant: this one decides
    # whether the request is served at all, Lyceum's decides who it is served as.
    lyceum:
      entryPoints:
        - internal
      rule: "Host(`lyceum.zerogravity.industries`)"
      service: lyceum
      middlewares:
        - cf-access-jwt

    # Estate wiki (SERV-101): generated static site, tunneled + Cloudflare Access.
    # `internal` only, like switchyard and lyceum — the wiki assembles the whole
    # stack's topology, host exposure and environment-variable names onto one
    # searchable site, which is exactly the reconnaissance summary that must never
    # be reachable from the public entrypoint. It holds no secret values, but a map
    # of the estate is not something to serve to the WAN either.
    # It is also the only tunneled app with no authentication of its own — nginx
    # serving static files will hand the estate map to whoever asks — so for the
    # wiki, cf-access-jwt is not defense in depth, it is the entire gate.
    wiki:
      entryPoints:
        - internal
      rule: "Host(`wiki.zerogravity.industries`)"
      service: wiki
      middlewares:
        - cf-access-jwt

  services:
    argosy:
      loadBalancer:
        servers:
          - url: "http://argosy:8096"

    switchyard:
      loadBalancer:
        # switchyard-frontend serves the SPA and passes /v1 + /healthz to the
        # backend (see docker-compose.yml). Route the tunneled host at the frontend.
        servers:
          - url: "http://switchyard-frontend:4002"

    lyceum:
      loadBalancer:
        # One Go binary serves the JSON API and the embedded reader SPA same-origin
        # on :4005 — no separate frontend, so route the tunneled host straight at it.
        servers:
          - url: "http://lyceum:4005"

    wiki:
      loadBalancer:
        # nginx serving the generated bundle from a read-only bind mount. No host
        # port exists, so this router is the only route to it.
        servers:
          - url: "http://wiki:80"

    # Never actually reached — deny-all returns 403 first. Present only because a
    # Traefik router requires a service reference.
    blackhole:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
