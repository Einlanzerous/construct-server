# Traefik dynamic configuration — Zero Gravity Industries hybrid edge (SERV-20)
#
# Explicit allowlist. Only the routers below are served. On the public entrypoint,
# anything that is not Argosy, the Lyceum direct path (SERV-60) or the Chronicle
# direct path (CHRN-16) is refused by `public-catchall`. The tunneled routers exist ONLY on the internal entrypoint, so
# the open WAN port physically cannot reach them — that is the "no tunnel bypass via
# the open port" guarantee.

http:
  middlewares:
    # Strip spoofable identity headers on ingress. Applied to BOTH entrypoints via
    # entryPoints.*.http.middlewares in traefik.yml. An empty value deletes the
    # header, so a client cannot inject a forged identity that an app might trust.
    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-Authentik-Username: ""
          X-Authentik-Groups: ""
          X-Authentik-Email: ""
          X-Authentik-Name: ""
          X-Authentik-Uid: ""
          X-Authentik-Jwt: ""
          X-Authentik-Meta-Jwks: ""
          X-Authentik-Meta-Outpost: ""
          X-Authentik-Meta-Provider: ""
          X-Authentik-Meta-App: ""
          X-Authentik-Meta-Version: ""
          Remote-User: ""
          Remote-Groups: ""
          Remote-Email: ""
          Remote-Name: ""
          X-Forwarded-User: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Email: ""
          X-Forwarded-Preferred-Username: ""

    # Public edge only: Cloudflare Access is NOT in front of the direct Argosy path,
    # so a client must not be able to inject Cf-Access-* trust headers. On the
    # internal entrypoint these arrive from cloudflared and are cryptographically
    # validated by cf-access-jwt below (SERV-106) — so they are NOT stripped there.
    strip-cf-access:
      headers:
        customRequestHeaders:
          Cf-Access-Jwt-Assertion: ""
          Cf-Access-Authenticated-User-Email: ""

    # Deny-all for the public catch-all. Traefik has no native 444; an ipAllowList
    # with an unmatchable source range returns 403 before any backend is reached.
    # A true connection-drop (444) can be layered on later at the relay or via a
    # plugin — the security property (unknown hosts get nothing) already holds.
    deny-all:
      ipAllowList:
        sourceRange:
          - "255.255.255.255/32"

    # Login brute-force throttle for the WAN-exposed Argosy auth endpoints (SERV-27).
    # Applied ONLY via the argosy-auth router below (scoped to /api/v1/auth/*), so it
    # never touches media/HLS-segment requests. Per client IP — the public edge trusts
    # no X-Forwarded-* (traefik.yml forwardedHeaders.trustedIPs: []), so this is the
    # real remote IP arriving via the router's DNAT. Token bucket: 5 req/s sustained,
    # bursts up to 15.
    argosy-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

    # Login brute-force throttle for Lyceum's WAN-exposed auth endpoints (SERV-60).
    # Applied ONLY via the lyceum-public-auth router below (scoped to /auth/*), so it
    # covers pairing-code / invite redemption (POST /auth/session) without touching
    # book/reader traffic. Sits at the edge on top of Lyceum's in-app pairingLimiter.
    # Per client IP (same rationale as argosy-login-ratelimit — the public edge trusts
    # no X-Forwarded-*). Token bucket: 5 req/s sustained, bursts up to 15.
    lyceum-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

    # Same shape and same numbers for Chronicle's credential endpoints (CHRN-16).
    # Applied ONLY via chronicle-public-auth below, scoped to /auth/*, so invite
    # redemption and the Cloudflare SSO exchange are throttled while memo UPLOAD
    # traffic is not — CHRN-20 is resumable upload of recordings of arbitrary
    # length, and a 5 req/s bucket across a chunked 40-minute upload would throttle
    # ingest rather than an attacker. Sits on top of Chronicle's own in-process
    # limiter, which exists for a different threat: the container is reachable on
    # construct_net by every other service without passing Traefik, so this edge
    # limiter does nothing for that path.
    #
    # That path is covered now, by chronicle-proxy-secret below (CHRN-75 /
    # SERV-148): the in-process limiter believes X-Forwarded-For only on a
    # request carrying a secret Traefik stamps, so a neighbour going direct is
    # keyed on its own address and cannot choose a bucket. Read the sentence
    # above as scoping this middleware, not as the lateral path being unguarded.
    chronicle-login-ratelimit:
      rateLimit:
        average: 5
        burst: 15

    # Proof that a request came through this edge (CHRN-75 / SERV-148). Attached to
    # every router that reaches the chronicle service — chronicle-public,
    # chronicle-public-auth and chronicle — because clientIP is a general answer and
    # CHRN-20's upload router will want it too. A Chronicle router without it is not
    # broken, it is silently coarse: the app falls back to keying every WAN sign-in
    # on Traefik's address, and says so in its log rather than failing.
    #
    # `customRequestHeaders` OVERWRITES a header the client sent rather than
    # appending, which is the property the whole design rests on and the same one
    # strip-identity-headers uses above — a client's own X-Chronicle-Proxy-Secret is
    # replaced here, so it never reaches the app. Chronicle compares the value in
    # constant time and never presence-tests it.
    #
    # ⚠ `{{ env "..." }}`, NOT `${...}`. The file provider does not expand `${...}`;
    # it would stamp that literal string, which never matches, and nothing would
    # error — Chronicle would log a mismatch and quietly stay on the coarse bucket.
    # crowdsecLapiKey below is the same mechanism and the existence proof that this
    # form works. The value reaches the traefik container from PROD_ENV_FILE via the
    # env line in docker-compose.yml. Unset, the template renders empty and an empty
    # customRequestHeaders value DELETES the header rather than sending a blank one —
    # the same property strip-identity-headers is built on — so the request arrives
    # carrying nothing at all and Chronicle takes its no-header path.
    chronicle-proxy-secret:
      headers:
        customRequestHeaders:
          X-Chronicle-Proxy-Secret: '{{ env "CHRONICLE_PROXY_SECRET" }}'

    # Origin-side validation of Cf-Access-Jwt-Assertion (SERV-106). Every router on
    # the `internal` entrypoint carries this, and scripts/check-edge-auth.sh fails if
    # one does not — a tunneled router that forgets it is unauthenticated, and that is
    # the whole class of bug this closes.
    #
    # Cloudflare Access is enforced at Cloudflare's EDGE. Without this the origin
    # re-checked nothing, so a request that reached :9080 at all was served whatever
    # Host it claimed. cf-access-guard verifies the JWT against the team's published
    # signing keys and the AUD registered for that host; anything else gets a 403 here
    # and never reaches a backend. See services/cf-access-guard/.
    cf-access-jwt:
      forwardAuth:
        address: "http://cf-access-guard:4020/verify"
        # FALSE is the default; it is spelled out because it is load-bearing. The guard
        # picks which AUD to require from X-Forwarded-Host. With this true, Traefik
        # would pass the CLIENT's X-Forwarded-Host through, letting a caller name one
        # host for the audience check while the router serves a different backend. False
        # makes Traefik set that header itself, from the same Host the router matched.
        trustForwardHeader: false
        # Forward only the assertion. Traefik still adds the X-Forwarded-* set it
        # computes itself (the filter runs before those are written), so the guard keeps
        # the host it needs — but the real request's session cookies and Authorization
        # headers never reach it. It has no use for them and should not hold them.
        authRequestHeaders:
          - "Cf-Access-Jwt-Assertion"

    # CrowdSec bouncer (SERV-27): rejects IPs with an active CrowdSec decision
    # before anything else runs. `live` mode = one LAPI round-trip per new client
    # IP (then cached). The LAPI key is minted with `cscli bouncers add` and
    # injected via the container env (file provider go-templating). LAN, tailnet
    # and loopback are exempt so a misfiring scenario can never lock us out of
    # our own edge.
    crowdsec-bouncer:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKey: '{{ env "CROWDSEC_BOUNCER_KEY" }}'
          clientTrustedIps:
            - "10.0.0.0/24"      # home LAN
            - "100.64.0.0/10"    # tailnet
            - "172.16.0.0/12"    # docker networks
            - "127.0.0.1/32"

  routers:
    # ---------------- PUBLIC entrypoint: direct routers ----------------
    # Argosy, Lyceum's direct path (SERV-60) and Chronicle's (CHRN-16). Anything else
    # on this entrypoint is refused by public-catchall.
    argosy:
      entryPoints:
        - public
      rule: "Host(`argosy.zerogravity.industries`)"
      service: argosy
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same Argosy backend, but the auth endpoints get the login rate-limit. Higher
    # priority than `argosy` so /api/v1/auth/* matches here; everything else (incl.
    # media/HLS segments) falls through to `argosy` unthrottled.
    argosy-auth:
      entryPoints:
        - public
      rule: "Host(`argosy.zerogravity.industries`) && PathPrefix(`/api/v1/auth/`)"
      priority: 1000
      service: argosy
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - argosy-login-ratelimit
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # ---------------- PUBLIC entrypoint: Lyceum direct path (SERV-60) ----------------
    # Puts Lyceum on the open 443 edge alongside Argosy so the Flutter app (LYCM-101)
    # can reach it with a bearer token — no Tailscale, no Cloudflare Access. Points at
    # the SAME `lyceum` backend as the tunneled `lyceum` router; the only difference is
    # this host isn't SSO-gated, so a client falls back to invite/pairing (correct).
    # strip-cf-access ensures a spoofed Cf-Access-* on this path authenticates nobody.
    lyceum-public:
      entryPoints:
        - public
      rule: "Host(`lyceum-direct.zerogravity.industries`)"
      service: lyceum
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same Lyceum backend, but /auth/* gets the login rate-limit. Higher priority than
    # lyceum-public so pairing-code / invite redemption is throttled at the edge;
    # everything else (books, reader, covers) falls through to lyceum-public unthrottled.
    lyceum-public-auth:
      entryPoints:
        - public
      rule: "Host(`lyceum-direct.zerogravity.industries`) && PathPrefix(`/auth/`)"
      priority: 1000
      service: lyceum
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - lyceum-login-ratelimit
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # ---------------- PUBLIC entrypoint: Chronicle direct path (CHRN-16) ----------------
    # Same backend as the tunneled `chronicle` router below; this host simply is not
    # SSO-gated, so the Android app and MCP fall back to a redeemed invite. Safe on the
    # WAN entrypoint because Chronicle enforces its own per-device session on every
    # route outside /healthz and /readyz (CHRN-71) — the "authenticates with something
    # Cloudflare Access cannot express" bar this entrypoint sets. strip-cf-access means
    # a spoofed Cf-Access-* here authenticates nobody, and Chronicle verifies the
    # assertion against the JWKS itself rather than trusting the header, so a dropped
    # middleware cannot forge an identity either.
    chronicle-public:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`)"
      service: chronicle
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - chronicle-proxy-secret
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Same backend, /auth/* throttled. Higher priority than chronicle-public so invite
    # redemption and SSO exchange are limited at the edge; upload and read traffic
    # falls through unthrottled. Mirrors argosy-auth and lyceum-public-auth.
    chronicle-public-auth:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`) && PathPrefix(`/auth/`)"
      priority: 1000
      service: chronicle
      middlewares:
        - crowdsec-bouncer
        - strip-cf-access
        - chronicle-login-ratelimit
        - chronicle-proxy-secret
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # /admin is NOT served on the WAN host. CHRN-16 requires "/admin requires Access",
    # and a Host-only rule would have served POST /admin/users/{id}/invite — which
    # mints a live credential — on the open 443 behind only requireOwner and outside
    # the /auth/ limiter. Highest priority so it beats both routers above, pointed at
    # the same blackhole + deny-all pair public-catchall uses so the answer is 403
    # rather than a route to a backend that would have served it.
    #
    # Lyceum serves its whole surface on both hosts; the difference is that
    # Chronicle's ticket states this property, so serving /admin here would be an
    # unstated departure from it. The owner administers accounts through Access;
    # nothing the app or MCP does needs /admin.
    chronicle-public-admin:
      entryPoints:
        - public
      rule: "Host(`chronicle-direct.zerogravity.industries`) && PathPrefix(`/admin`)"
      priority: 2000
      service: blackhole
      middlewares:
        - deny-all
      tls:
        certResolver: letsencrypt
        domains:
          - main: "zerogravity.industries"
            sans:
              - "*.zerogravity.industries"

    # Lowest-priority deny-all. Any Host/SNI on :public that is not Argosy, the Lyceum
    # direct host or the Chronicle direct host is refused (403). Defense-in-depth: the
    # tunneled routers below do not exist on this entrypoint at all, so there is
    # nothing to bypass to.
    public-catchall:
      entryPoints:
        - public
      rule: "HostRegexp(`.+`)"
      priority: 1
      service: blackhole
      middlewares:
        - deny-all
      tls: {}

    # ------------- INTERNAL entrypoint: tunneled apps -------------
    # Reachable only via cloudflared, which is the only other member of
    # construct_edge_net (SERV-107). EVERY router here carries `cf-access-jwt`, which
    # is what makes reaching the entrypoint insufficient on its own (SERV-106) —
    # check-edge-auth.sh fails if a new one is added without it.
    switchyard:
      entryPoints:
        - internal
      rule: "Host(`switchyard.zerogravity.industries`)"
      service: switchyard
      middlewares:
        - cf-access-jwt

    # Chronicle's browser half (CHRN-16). Access-gated like every router here; the
    # browser arrives already signed in and POSTs /auth/sso/cloudflare to exchange the
    # assertion for the same kind of per-device session the direct host issues. Its
    # AUD is in cf-access-guard's CF_ACCESS_AUD_MAP and in the service's own
    # CHRONICLE_CF_ACCESS_AUD. check-edge-auth.sh asserts every service-side AUD
    # appears SOMEWHERE in the map — set membership, not per-host agreement, so it
    # would not catch two services' AUDs being swapped.
    chronicle:
      entryPoints:
        - internal
      rule: "Host(`chronicle.zerogravity.industries`)"
      service: chronicle
      middlewares:
        - cf-access-jwt
        - chronicle-proxy-secret
      # No TLS: internal is plain HTTP (Cloudflare terminates TLS at the edge and
      # the tunnel encrypts the wire).

    # Catenary (SERV-168 / CANT-16). Access-gated like every router here.
    #
    # THIS IS THE ONLY CATENARY ROUTER, and the absence of a public one is the
    # decision rather than an omission. Catenary does not authenticate at all yet —
    # the socket is CANT-22, the token model CANT-28 — and the bar for the `public`
    # entrypoint is an endpoint that authenticates with something Access cannot
    # express. Until then a public router would put a service that will hold
    # everyone's messages, unauthenticated, on the open 443.
    #
    # When that router does eventually land it CANNOT be a Host-only match: /admin
    # would then be served from the public host too, which is exactly what CANT-16's
    # Done-when forbids. It needs its own higher-priority router pointed at the
    # blackhole + deny-all pair, the way chronicle-public-admin above does — that
    # router exists because Chronicle hit this.
    #
    # Unlike chronicle and lyceum, the catenary service carries no AUD of its own:
    # it has no code that reads one, so cf-access-guard is the only thing verifying
    # the assertion and the audience lives only in CF_ACCESS_AUD_MAP. check-edge-auth.sh
    # check 4 treats a service with no audience as a proxy, so this is supported.
    catenary:
      entryPoints:
        - internal
      rule: "Host(`catenary.zerogravity.industries`)"
      service: catenary
      middlewares:
        - cf-access-jwt
      # No TLS: internal is plain HTTP, as above.

    # THE ONE EXEMPTION from origin auth, and the only router on this entrypoint
    # without cf-access-jwt (SERV-106).
    #
    # GitHub cannot authenticate to Cloudflare Access, so Access carries a Bypass
    # policy on this exact path and injects no assertion — the request arrives with no
    # Cf-Access-Jwt-Assertion at all. Without this router it falls through to
    # `switchyard` above and is 403'd, which silently stops external-ref updates and
    # PR-merge auto-close (SERV-45). That is not hypothetical: it happened. The first
    # push after this middleware went to enforce returned 403 on
    # POST /v1/external/github, and the audit-mode log is what caught it.
    #
    # Be precise about what this costs, because "narrow exemption, exact Path" reads
    # safer than it is: at THIS layer the path is an unauthenticated POST into prod
    # Switchyard for anything that can reach the entrypoint. Nothing here checks it.
    # What actually guards it is one layer down — every request is HMAC-verified
    # against GITHUB_WEBHOOK_SECRET and the receiver returns 503 when that secret is
    # absent — so the endpoint authenticates with something Cloudflare Access cannot
    # express, rather than not at all. If that HMAC ever became optional, this router
    # would be a hole. Keeping the rule to an exact `Path()` rather than a
    # `PathPrefix()` is what bounds the damage to the one endpoint that has it.
    #
    # check-edge-auth.sh knows this router by name. Any OTHER internal router that
    # turns up without the middleware fails that check — the allowlist is the point.
    switchyard-github-webhook:
      entryPoints:
        - internal
      rule: "Host(`switchyard.zerogravity.industries`) && Path(`/v1/external/github`)"
      priority: 1000
      service: switchyard

    # Lyceum (LYCM-803): tunneled + Cloudflare Access, mirroring switchyard. HTTP
    # on the internal entrypoint — no tls block. Cf-Access-Jwt-Assertion is
    # preserved here (only stripped on the public entrypoint), checked by
    # cf-access-jwt before the request is proxied, and checked AGAIN by Lyceum's
    # own backend for SSO sign-in. The two are not redundant: this one decides
    # whether the request is served at all, Lyceum's decides who it is served as.
    lyceum:
      entryPoints:
        - internal
      rule: "Host(`lyceum.zerogravity.industries`)"
      service: lyceum
      middlewares:
        - cf-access-jwt

    # Estate wiki (SERV-101): generated static site, tunneled + Cloudflare Access.
    # `internal` only, like switchyard and lyceum — the wiki assembles the whole
    # stack's topology, host exposure and environment-variable names onto one
    # searchable site, which is exactly the reconnaissance summary that must never
    # be reachable from the public entrypoint. It holds no secret values, but a map
    # of the estate is not something to serve to the WAN either.
    # It is also the only tunneled app with no authentication of its own — nginx
    # serving static files will hand the estate map to whoever asks — so on THIS
    # path, cf-access-jwt is not defense in depth, it is the entire gate.
    #
    # Scoped to "this path" deliberately. The guard sits on the router, not on the
    # service, and `wiki` is on construct_net with no auth: `curl http://wiki:80/`
    # from any container there still returns the site, including the arbitrary-workload
    # neighbours (n8n, open-webui, copyparty, ollama). That is pre-existing and outside
    # SERV-106, but it is the same "reaching it is enough" shape, so do not read the
    # sentence above as saying the wiki is closed — it says the tunneled route is.
    # Closing the other one means the wiki growing an auth layer of its own.
    wiki:
      entryPoints:
        - internal
      rule: "Host(`wiki.zerogravity.industries`)"
      service: wiki
      middlewares:
        - cf-access-jwt

    # Remote MCP endpoint (SERV-99 / SWY-260) — the Switchyard tool surface for
    # hosted Claude surfaces. `internal` ONLY, and the entrypoint is the guarantee:
    # the public catch-all deny is defence in depth, but what actually makes this
    # unreachable from the open WAN port is that no router for this host exists on
    # that entrypoint at all. No tls block — internal is plain HTTP, Cloudflare
    # terminates at the edge.
    #
    # GATED like every other tunneled app, and the two checks are not redundant:
    # cf-access-jwt decides whether the request is served at all, and the MCP server
    # decides WHO it is served as — it re-verifies the same assertion against its own
    # per-application AUD and exchanges it for that user's Switchyard token. The
    # server's own check is what SWY-260 built to fail closed; this one is what keeps
    # the failure from ever being the server's to make.
    #
    # NOT behind crowdsec-bouncer, and it cannot drift into being: the bouncer is
    # attached per-router on the public entrypoint only, and the entrypoint-level
    # middleware list in traefik.yml is strip-identity-headers alone. That is worth
    # stating rather than leaving implicit — Anthropic's egress is one narrow range
    # (160.79.104.0/21) hitting one endpoint repeatedly, which is the exact traffic
    # shape a bouncer scenario reads as abuse, and a single decision against that
    # range would break every remote tool call at once.
    #
    # OAuth discovery was the one open risk here, and SERV-100 SETTLED IT — no
    # exemption is needed, and none should be added. The concern was that the MCP
    # server serves RFC 9728 metadata at /.well-known/oauth-protected-resource/mcp
    # unauthenticated by design (a client reads it precisely when it has no
    # credentials yet), so a discovery fetch arriving here would be 403'd by this
    # middleware and surface as Claude's "Couldn't reach the MCP server".
    #
    # Measured once the tunnel route was live: Cloudflare Access answers discovery
    # at the edge and never forwards it. An unauthenticated POST to the public
    # https://mcp.zerogravity.industries/mcp returns Cloudflare's own 401 pointing
    # at .../.well-known/cloudflare-access-protected-resource/mcp — its path, not
    # the origin's — and both that path AND the origin's RFC 9728 path answer 200
    # from Cloudflare (server: cloudflare, cf-version header, a body that differs
    # from what the container serves). Meanwhile the same two paths at the internal
    # entrypoint with a spoofed Host both answer 403. So the edge satisfies
    # discovery and the origin still fails closed; the request never arrives.
    #
    # If that ever changes, the fix is a narrow exact-`Path()` exemption for that
    # one path, argued for in check-edge-auth.sh's allowlist WITH fresh evidence —
    # never a PathPrefix, and never pre-emptively. Do not add one on the strength
    # of the paragraph above; it is the record of a risk that did not materialise.
    #
    # That path is verified, not guessed (against mcp:4.29): an unauthenticated
    # POST /mcp to the origin answers 401 with
    #   WWW-Authenticate: Bearer resource_metadata="https://mcp.zerogravity.industries/.well-known/oauth-protected-resource/mcp"
    # and that exact path answers 200 with the resource document naming the team
    # domain as the authorization server. So the pointer is built from MCP_PUBLIC_URL
    # rather than from the request's Host, which is the reason that variable is
    # configured — a forged Host cannot aim a client's discovery elsewhere.
    switchyard-mcp:
      entryPoints:
        - internal
      rule: "Host(`mcp.zerogravity.industries`)"
      service: switchyard-mcp
      middlewares:
        - cf-access-jwt

    # THE SECOND EXEMPTION from origin auth (PCAD-5 / IDEA-22), whole-host where
    # the webhook's is exact-Path — so state plainly what that costs: everything
    # placard serves is reachable by anything that can reach the entrypoint.
    #
    # That is the service working as specified, not a compromise being tolerated.
    # Be precise about the mechanism, because the obvious version of it is wrong:
    # the CANONICAL logo URLs placard hands out are jsDelivr against its public
    # GitHub repo, and those never touch this host — a gate here would not break
    # them. What a gate breaks is everything that IS this host: the mirror URLs
    # (the same repo-relative paths, placard's own fallback when jsDelivr is the
    # thing that rots), the front page, and /api/services. All of those are
    # public-with-no-session by contract (placard's CLAUDE.md invariant), because
    # any placard URL is liable to be rendered sessionless in a viewer's browser
    # — a launcher tile whose logo_url someone pointed at the mirror, a service
    # badge on some future surface — and the viewer who matters most (a new
    # invitee) has no Access session for placard. A gated placard serves that
    # viewer login HTML where an image belongs, and the surface silently falls
    # back to initials: the exact switchyard failure IDEA-22 audited, rebuilt at
    # a different host, with no error anywhere. An Access gate here doesn't
    # secure the service, it re-arms the trap the service exists to close.
    #
    # What bounds the damage: placard's content is a copy of a PUBLIC GitHub
    # repo, so there is nothing here to protect; the one write path (POST
    # …/upload, staged reads) is token-gated inside the app
    # (PLACARD_UPLOAD_TOKEN), i.e. it authenticates with something Access cannot
    # express, like the webhook's HMAC; and the DB it touches holds only
    # URL-check observations and staged bytes. If placard ever grows a surface
    # that is not public-by-design, that surface moves behind its own token or a
    # separate gated hostname — this router does not acquire a middleware,
    # because a gated placard is a broken placard.
    #
    # check-edge-auth.sh knows this router by name. Never attach a gated
    # (self_hosted + members policy) Access application to this hostname either
    # — the edge and the origin have to agree that it is open.
    placard:
      entryPoints:
        - internal
      rule: "Host(`placard.zerogravity.industries`)"
      service: placard

  services:
    argosy:
      loadBalancer:
        servers:
          - url: "http://argosy:8096"

    switchyard:
      loadBalancer:
        # switchyard-frontend serves the SPA and passes /v1 + /healthz to the
        # backend (see docker-compose.yml). Route the tunneled host at the frontend.
        servers:
          - url: "http://switchyard-frontend:4002"

    lyceum:
      loadBalancer:
        # One Go binary serves the JSON API and the embedded reader SPA same-origin
        # on :4005 — no separate frontend, so route the tunneled host straight at it.
        servers:
          - url: "http://lyceum:4005"

    wiki:
      loadBalancer:
        # nginx serving the generated bundle from a read-only bind mount. No host
        # port exists, so this router is the only route to it.
        servers:
          - url: "http://wiki:80"

    switchyard-mcp:
      loadBalancer:
        # The Streamable HTTP MCP transport on :4080 (SWY-260) — a sibling container
        # to the backend, not the backend itself, so this is deliberately NOT the
        # switchyard or switchyard-frontend address. No host port exists, so this
        # router is the only route to it.
        servers:
          - url: "http://switchyard-mcp:4080"

    chronicle:
      loadBalancer:
        # One Go binary on :4009 serving both hosts — the tunneled Access-gated one
        # and the direct WAN one. Backend for three routers above.
        servers:
          - url: "http://chronicle:4009"

    catenary:
      loadBalancer:
        # One Go binary on :4012 — the next free slot in the estate's 40xx block.
        # Serves /healthz and /readyz today; the WebSocket upgrade (CANT-22) and
        # /sync (CANT-18) land on this same address and port.
        servers:
          - url: "http://catenary:4012"

    placard:
      loadBalancer:
        # One Go binary serves the front page, the mark mirror and the API
        # same-origin on :4009 (PCAD-4).
        servers:
          - url: "http://placard:4009"

    # Never actually reached — deny-all returns 403 first. Present only because a
    # Traefik router requires a service reference.
    blackhole:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
