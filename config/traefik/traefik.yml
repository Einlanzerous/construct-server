# Traefik static configuration — Zero Gravity Industries hybrid edge (SERV-20)
#
# Split entrypoints are the security keystone (plan-of-record, non-negotiable):
#   * public   — the WAN-forwarded 443. Serves ONLY the explicitly-listed direct
#                routers (Argosy, and Lyceum's direct path per SERV-60) plus a
#                lowest-priority deny-all catch-all. Nothing tunneled lives here.
#   * internal — Docker-network-only (NOT published to the host). cloudflared
#                dials this; it carries the tunneled apps (switchyard, lyceum…).
# Identity headers are stripped on ingress on BOTH entrypoints (see the
# entryPoints.*.http.middlewares refs below + config/traefik/dynamic/routers.yml).
#
# TLS is issued via Let's Encrypt DNS-01 (Cloudflare) — never opens port 80 and
# works behind grey-cloud / CGNAT. See docs/zerogravity-edge.md for the runbook.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  format: json
  # Written to a file (shared volume) so CrowdSec can tail it — the crowdsec
  # container mounts this path read-only and parses it with the traefik
  # collection (SERV-27). Error/startup logs still go to stdout (`docker logs`).
  filePath: /var/log/traefik/access.log

# CrowdSec bouncer middleware (SERV-27): checks each request's client IP against
# the local CrowdSec LAPI and 403s banned IPs. Wired into the public Argosy
# routers in dynamic/routers.yml.
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.6.0

api:
  dashboard: true
  insecure: false   # dashboard is reachable only on the internal :8080, never published

entryPoints:
  # WAN-facing 443 (router port-forward, or fronted by the Phase 3 relay while the
  # line is behind CGNAT — see SERV-15). Direct routers only (Argosy + Lyceum's
  # direct path, SERV-60); everything else is denied.
  public:
    address: ":8443"
    http:
      middlewares:
        - strip-identity-headers@file
    # Do not trust any client-supplied X-Forwarded-* on the public edge.
    forwardedHeaders:
      trustedIPs: []

  # Internal entrypoint — target for cloudflared at http://traefik:9080. Plain HTTP
  # on purpose: the leg from cloudflared to Traefik runs inside construct_net behind
  # an already-encrypted tunnel, and Cloudflare presents the edge cert to browsers,
  # so no origin cert is needed here (only the public/Argosy path needs the LE cert).
  # This port is intentionally absent from the compose `ports:` list, so it is
  # unreachable from the host/WAN and can never provide a bypass around Access.
  internal:
    # Bound to ONE address, not every interface (SERV-106). `:9080` meant "listen on all
    # of Traefik's interfaces", and on a shared Docker network that means every neighbour
    # can reach it. That was demonstrated, not theorised — from a throwaway container on
    # construct_net:
    #
    #   curl -H "Host: switchyard.zerogravity.industries" http://traefik:9080/  -> 200
    #
    # unauthenticated prod Switchyard, because Cloudflare Access is enforced at
    # Cloudflare's edge and nothing re-checked it here. The comment above about this port
    # being "unreachable from the host/WAN" was true and beside the point: the exposure
    # was never the host, it was the other ~30 containers.
    #
    # 172.31.240.10 is Traefik's fixed address on construct_edge_net, which only
    # cloudflared shares. THIS VALUE MUST MATCH the ipv4_address in docker-compose.yml —
    # if they disagree Traefik binds an address it does not hold, cloudflared cannot
    # connect, and every tunneled app goes dark. Verify with:
    #
    #   docker run --rm --network construct_net curlimages/curl -sv \
    #     -H "Host: switchyard.zerogravity.industries" http://traefik:9080/
    #
    # which must fail to connect, while the public hostnames still 302 to Access.
    address: "172.31.240.10:9080"
    http:
      middlewares:
        - strip-identity-headers@file

  # Traefik dashboard / API — internal only, never published.
  traefik:
    address: ":8080"

providers:
  file:
    # Explicit allowlist of routers/services/middlewares. No Docker provider: the
    # edge policy is committed and reviewable, and nothing is auto-exposed.
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: acme@zerogravity.industries   # non-secret; change if you prefer
      storage: /letsencrypt/acme.json
      # DNS-01 only. The cloudflare provider reads CF_DNS_API_TOKEN from the
      # container environment (set in .env). While testing, switch to staging to
      # avoid rate limits:
      #   caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
