# Nightly Postgres backup configuration (SERV-43). Tracked, no secrets — every
# value here is public-safe. Sourced by scripts/backup-nightly.sh; a syntax
# error here fails every run loudly rather than silently, since the script
# `set -e`s immediately after sourcing it.
#
# Credentials live separately, in the untracked /etc/construct-backup/backup.env
# (mode 0600, one file, one writer — see docs/backups.md and SERV-43's plan,
# ruling "How does the single backup.env credential file reach the host?").

# ─── the restic image ───────────────────────────────────────────────────────
#
# Pinned by the multi-arch INDEX digest (SERV-105's third-party invariant): a
# per-platform manifest digest pins one architecture and fails everywhere else.
# Get the right one with `docker buildx imagetools inspect restic/restic:<tag>`
# and take the top-level "Digest:" line, never one from the "Manifests:" list.
#
# Confirmed against this exact pin before choosing it (not assumed): `init --help`
# lists --copy-chunker-params and --from-repo/$RESTIC_FROM_REPOSITORY;
# --repository-version defaults to "stable" (v2, --compression auto by default);
# and a live run with RESTIC_REST_USERNAME/RESTIC_REST_PASSWORD set shows restic
# building the REST URL from them (logged as "http://u:***@...").
RESTIC_IMAGE="restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76"

# ─── clusters ────────────────────────────────────────────────────────────────
#
# One entry per Postgres cluster to back up, "container_name:label". The label
# is what tags each night's hub snapshot (`--group-by host,tags` keys retention
# on it) and namespaces the must-dump floor and exclusion-pattern variables
# below (BACKUP_MUST_DUMP_<LABEL>, upper-cased).
#
# `shared` is this stack's own `postgres` container. `argosy` is `argosy-db-1`,
# a second, separately-busy PG17 cluster in the `argosy` compose project
# (~/projects/argosy/deploy) — in scope per SERV-43's plan ruling ("a cluster is
# a config entry"). Each cluster's own `pg_dump`/`pg_dumpall` runs inside that
# cluster's own container, so PG16 vs PG17 client/server skew cannot happen.
BACKUP_CLUSTERS=(
  "postgres:shared"
  "argosy-db-1:argosy"
)

# Exclusion patterns, shell globs matched against a `datname`. Applied to every
# cluster. Confirmed against the live shared cluster (2026-09-26): no real
# service database matches either pattern — the seven `*_test` matches are all
# intentional per-service scratch copies (switchyard_test, lyceum_test, …),
# and `swy*` matches only scratch/preview databases, never `switchyard` itself.
BACKUP_EXCLUDE_PATTERNS=("swy*" "*_test")

# ─── the must-dump floor (SERV-43's decision: "enumerate, exclude, and say so") ──
#
# A hardcoded list is how a service goes silently uncovered if a rename ever
# slips past the exclusion patterns above — so this floor is enforced as a
# FLOOR, not a ceiling: the run fails if any name here is missing from the
# dumped set, but a brand-new database with no config change is still dumped
# automatically (enumeration decides what's dumped; this only decides what's
# *mandatory*). `postgres` (the maintenance database) is included deliberately
# — dumping it costs nothing and keeps the floor's rule simple: every real,
# non-scratch database, full stop.
#
# Provenance of `drydock_user`, the bare `centrifuge` role and `catenary`'s
# provisioning is tracked in docs/backups.md (SERV-43 plan criterion 19) — not
# yet fully traced as of this list; see that file before treating a restore
# drill as proof a cold rebuild self-heals.
BACKUP_MUST_DUMP_SHARED=(amber argosy asr authentik catenary centrifuge chronicle cook_book drydock interlock lyceum placard postgres purser switchyard)

# argosy-db-1 holds two databases: `argosy` (live) and `argosy_test` (a scratch
# copy, correctly caught by the `*_test` exclusion pattern above — not listed
# here on purpose).
BACKUP_MUST_DUMP_ARGOSY=(argosy postgres)

# ─── per-cluster admin role ─────────────────────────────────────────────────
#
# The role to connect as for each cluster — defaults to "postgres" and only
# needs an entry here when a cluster differs. Found against the real box
# (2026-09-26): the official postgres image's initdb creates whatever role
# POSTGRES_USER names, and argosy-db-1 runs POSTGRES_USER=argosy, so it has no
# role literally called "postgres" at all — confirmed via
# `docker inspect argosy-db-1 --format '{{.Config.Env}}'`.
BACKUP_ADMIN_USER_ARGOSY="argosy"

# ─── retention ───────────────────────────────────────────────────────────────
BACKUP_RETENTION_DAILY=14
BACKUP_RETENTION_WEEKLY=8

# ─── destinations ────────────────────────────────────────────────────────────
#
# "name:repository-url-with-no-credentials", e.g.
#   "desktop:rest:http://imperial-prime-wsl:8000/construct/"
# Credentials for a destination named NAME live in backup.env as
# RESTIC_PASSWORD_NAME / REST_USER_NAME / REST_PASSWORD_NAME (upper-cased) —
# the script maps these onto restic's own RESTIC_PASSWORD / RESTIC_REST_USERNAME
# / RESTIC_REST_PASSWORD per invocation; never store restic's own variable
# names in this file, since it would blur which side of the mapping owns them.
#
# Empty until SERV-215 wires the desktop as the first real destination. The
# fan-out and miss-semantics logic in scripts/backup-nightly.sh is real and
# tested (make backup-test) against this array being empty — a run with no
# destinations configured snapshots the hub and does nothing else, which is
# the correct behaviour rather than a degraded one.
BACKUP_DESTINATIONS=()

# After this many consecutive missed copies to one destination, the run exits
# non-zero (in addition to that destination's own attempt failing). A hub
# failure always exits non-zero immediately, regardless of this threshold —
# see "Miss semantics" in docs/backups.md.
BACKUP_CONSECUTIVE_MISS_THRESHOLD=3

# ─── wall-clock bounds, seconds ──────────────────────────────────────────────
#
# Every one of these wraps a SINGLE external call (one pg_dump, one restic
# invocation) — never the whole run. The unit's own TimeoutStartSec (SERV-214)
# is the run-wide bound and is sized against the written budget in
# docs/backups.md: preflight max + hub duration + Σ(destination retries ×
# per-call timeout) + margin.
BACKUP_PG_DUMP_TIMEOUT_SEC=1800
BACKUP_RESTIC_TIMEOUT_SEC=1800

# Bounded retry loop for docker/tailscale/pg_isready at the top of a run
# (relevant mainly at boot, once SERV-214 wires the timer with Persistent=true).
BACKUP_PREFLIGHT_MAX_SEC=1200
