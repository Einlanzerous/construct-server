# Static server for the generated estate wiki (SERV-101).
#
# Serves the VitePress bundle from a read-only bind mount. There is no upstream,
# no state and no write path — everything here is about serving pre-built files
# correctly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site is built with cleanUrls, so pages link to `/services/switchyard`
    # while the file on disk is `services/switchyard.html`. Without the `$uri.html`
    # probe every internal link 404s — which looks like a generator bug and is not.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed assets are immutable by construction; the HTML that references them is
    # not, and must be revalidated or a deploy ships new content behind a stale page.
    #
    # The three security headers are REPEATED here, not inherited. nginx's add_header
    # is replace-not-merge across levels: a block that declares any add_header
    # inherits none from its parent, so declaring Cache-Control alone would silently
    # drop X-Content-Type-Options, X-Frame-Options and Referrer-Policy from every
    # /assets/ response while still reading as though they applied.
    location /assets/ {
        # One Cache-Control, not two. `expires 1y` emits its own, and nginx sends
        # both — legal (they combine per RFC 9110) but ambiguous to read in a trace.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The architecture maps (SERV-159) are the one thing on this site that is FRAMED:
    # each is a standalone artifact under public/, embedded by an <iframe> on its
    # repo page from this same origin. The server-level X-Frame-Options below is
    # DENY, which blocks that — DENY has no same-origin exception, unlike SAMEORIGIN
    # — so without this block the repo page renders the heading, the provenance line
    # and a working full-screen link around an EMPTY FRAME, with the build, the log
    # and the page structure all green. Nothing in this repo can see it: `vitepress
    # build` sends no such header, so a map verified in the build output is still
    # broken through nginx. The only check that catches it is a request through the
    # deployed path, which is what REVIEW.md says about anything at the edge anyway.
    #
    # SAMEORIGIN, not the removal of the header: a cross-site framer is still
    # refused, which is the guarantee that mattered. Scoped to this prefix so the
    # rest of the site keeps DENY.
    #
    # All three headers restated, for the reason spelled out above /assets/:
    # add_header is replace-not-merge, so a block declaring one inherits none.
    location /architecture/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # This origin sits behind Cloudflare Access on an unpublished Traefik
    # entrypoint, so these are defense-in-depth rather than the primary control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health probe. Deliberately NOT `return 200` — a bare return would report
    # healthy against an empty mount, which is the one failure this needs to catch
    # (nginx starts fine with nothing to serve). try_files makes the answer depend
    # on the bundle actually being there: 200 with the homepage, or 503.
    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }
}
