# Static server for the generated estate wiki (SERV-101).
#
# Serves the VitePress bundle from a read-only bind mount. There is no upstream,
# no state and no write path — everything here is about serving pre-built files
# correctly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site is built with cleanUrls, so pages link to `/services/switchyard`
    # while the file on disk is `services/switchyard.html`. Without the `$uri.html`
    # probe every internal link 404s — which looks like a generator bug and is not.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed assets are immutable by construction; the HTML that references them is
    # not, and must be revalidated or a deploy ships new content behind a stale page.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # This origin sits behind Cloudflare Access on an unpublished Traefik
    # entrypoint, so these are defense-in-depth rather than the primary control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health probe. Deliberately NOT `return 200` — a bare return would report
    # healthy against an empty mount, which is the one failure this needs to catch
    # (nginx starts fine with nothing to serve). try_files makes the answer depend
    # on the bundle actually being there: 200 with the homepage, or 503.
    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }
}
