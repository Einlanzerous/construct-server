name: Journald check

# SATL-25: the read-only journald status script, the owner-run rollout script and their mock-bin tests. Narrow path filter;
# nothing here touches a host. The compose anchor itself is covered by `docker compose config`
# on the deploy path.

on:
  push:
    paths:
      - 'scripts/check-journald-logging.sh'
      - 'scripts/test/test-check-journald-logging.sh'
      - 'scripts/journald-logging-rollout.sh'
      - 'scripts/test/test-journald-logging-rollout.sh'
      - '.github/workflows/journald-check.yml'
  pull_request:
    paths:
      - 'scripts/check-journald-logging.sh'
      - 'scripts/test/test-check-journald-logging.sh'
      - 'scripts/journald-logging-rollout.sh'
      - 'scripts/test/test-journald-logging-rollout.sh'
      - '.github/workflows/journald-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The check reports drivers and counts, never a log line
        run: ./scripts/test/test-check-journald-logging.sh

      - name: The rollout script's phases pass and fail where they should, and print no log value
        run: ./scripts/test/test-journald-logging-rollout.sh
