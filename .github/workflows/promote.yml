name: Promote / Rollback a Version

# One workflow with a direction, not two (SERV-78, SERV-79). "Make prod run this exact
# version" is the same operation whichever way it points, and SERV-79 argues the case
# directly: one code path means one set of bugs, and rollback is the path you least want
# to be the less-tested one — it runs when prod is already broken.
#
# What it actually does is edit one line of a pins file and commit it. It does not pull
# an image or touch a container, because deploy.yml already fires on a push that changes
# versions.env (SERV-96) and is the only thing that deploys (SERV-76). A promote that
# recreated containers itself would be a second way for prod to change, which is exactly
# what that ticket spent its length removing.
#
# TWO PINS FILES, ONE WORKFLOW (SERV-130). Every container pins in versions.env and is
# deployed by deploy.yml. Signet is a host binary under systemd: it pins SIGNET_VERSION
# in versions-host.env and is deployed by deploy-signet.yml, which carries the matching
# path trigger. Everything above the file split is identical — the direction, the
# required reason, the production-promote gate, the trailers — because "make prod run
# this exact version" is the same operation whatever runs it.
#
# The split itself is forced rather than chosen: deploy-scope.sh maps each changed pin in
# versions.env onto compose services and refuses one that no image interpolates, which
# its caller reads as "pull the whole stack". A signet pin in versions.env would make
# every signet promote pull and recreate the entire prod stack.
#
# THE RECREATE IS NOW SCOPED TO THE PINS THIS WORKFLOW MOVED — with caveats, listed below.
# Three earlier versions of this comment got the bound wrong in both directions, so state
# it precisely rather than approximately.
#
# The history, because the shape of the fix only makes sense against it. deploy.yml PULLED
# the whole stack before `up -d`, and a pull moves every image whose reference is not
# immutable — so the named service drifted because its pin changed, and so did anything
# else that had published since the last deploy. Measured, not theorised: the first real
# rollback through this workflow (purser 0.13 -> 0.12, 2026-08-17) recreated purser, ollama
# AND semaphore. Only purser was named. SERV-105 pinned the third-party images by digest,
# which took ollama and semaphore out of it. SERV-109 scoped the pull, which took out the
# larger first-party half — larger because those services have dependents, and per SERV-102
# the Node ones do not recover on their own from a peer recreate that moves an address.
#
# Pinning could not have fixed the first-party half. Every value in versions.env is
# `LYCEUM_TAG=1.10`-shaped and that tag MOVES on a patch release *deliberately*, so
# security fixes land without an edit. The float is the feature; scoping is what makes it
# not apply to a rollback.
#
# HOW THE SCOPING FINDS A PROMOTE: this workflow commits versions.env and NOTHING ELSE, and
# deploy.yml matches on exactly that shape (scripts/deploy-scope.sh), then pulls and
# recreates only the services behind the pins that actually changed, with --no-deps.
# KEEP THIS WORKFLOW'S COMMIT PURE. Adding any second file to it does not fail — it
# silently drops the deploy back to a whole-stack pull, and quietly un-fixes SERV-109.
#
# What is still NOT bounded, and should not be written as if it were:
#
#   * FOUR of the thirteen pins cover two services each, so they recreate in pairs:
#     APERTURE_TAG, CENTRIFUGE_TAG and SWITCHYARD_TAG (backend + frontend) and
#     INTERLOCK_TAG (web + worker). Correct — a repo's images ship from one release — but
#     it is two containers, and interlock-worker is one of the Node services SERV-102 is
#     about. Only nine of the thirteen pins name exactly one container.
#   * The pin is major.minor, so rolling purser back to 0.13 fetches the newest 0.13 PATCH.
#     That is not necessarily the image prod was running the last time it was on 0.13. If
#     the exact code matters, compare the org.opencontainers.image.revision label via
#     `make versions` — a digest comparison alone invents drift that is not there (SERV-88).
#   * The four watchtower opt-ins (dozzle, uptime-kuma, datadog, watchtower) still float,
#     because watchtower cannot roll a digest-pinned container. They are outside this
#     workflow either way: nothing here can repoint a third-party image.
#
# SERV-63's --no-deps concern is a different thing and genuinely does not arise here: that
# is about --force-recreate propagating through depends_on, and this path never forces.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to repoint"
        required: true
        type: choice
        options:
          - amber
          - aperture
          - argosy
          - asr
          - centrifuge
          - chronicle
          - cook_book
          - drydock
          - interlock
          - lyceum
          - placard
          - purser
          - signet
          - switchyard
      version:
        description: "Target tag — major.minor (1.11). signet takes a FULL release tag (v1.9.1). A sha only to roll back to a pin from before SERV-125"
        required: true
        type: string
      kind:
        description: "Which direction this is (recorded in the commit and the ledger)"
        required: true
        type: choice
        options:
          - promote
          - rollback
        default: promote
      reason:
        description: "Why. Recorded in the commit message — a version moving with no explanation is the blind spot this epic exists to close."
        required: true
        type: string
      requested_by:
        description: "Who asked. LEAVE BLANK from the Actions tab — github.actor is right there. Only an API dispatch fills it (SERV-104)."
        required: false
        type: string
        default: ""

# A choice input is the whole allow-list for `service`: it cannot be a typo and it cannot
# be an injected string, which matters because these values reach a shell.

# WHY `requested_by` EXISTS (SERV-104). `Delivery-Actor` is the only channel by which a
# promoter's identity reaches the ledger, and it is set from `github.actor`. That is
# correct for a human in the Actions tab and WRONG for an API dispatch: a run created
# with a PAT reports the PAT's owner, so once Switchyard can dispatch (SWY-188), every
# promote it sends would be attributed to the token — one identity for all of them,
# recorded in the field that exists specifically to say who asked. Adding the credential
# without this input would quietly un-do SERV-130's trailer for the path it was most
# needed on.
#
# It is an ATTESTATION, NOT AN AUTHENTICATION, and the distinction should not be blurred:
# whoever holds the dispatch token can put any string here. That is acceptable because it
# is not what authorises anything — the `production-promote` reviewer is, and GitHub
# records the approver independently of this field. Blank means "trust github.actor",
# which is why the default is empty rather than a placeholder.

# Two version changes at once would both edit versions.env from the same base and the
# loser's push would be rejected. Queue them instead — cancel-in-progress would be wrong
# here, since a cancelled promote may already have pushed.
concurrency:
  group: version-change
  cancel-in-progress: false

jobs:
  repoint:
    runs-on: self-hosted

    # THE MANUAL GATE. IDEA-19 is explicit that this needs no code: an Environment with
    # required reviewers makes GitHub hold the job until someone approves, so there is no
    # approval UI to build and no state machine to get wrong.
    #
    # This is deliberately NOT `home-server`. That environment holds PROD_ENV_FILE and is
    # consumed by deploy.yml on every push; adding required reviewers to it would put a
    # human approval in front of every ordinary deploy. A separate environment gates the
    # promote without touching the deploy path. It needs no secrets of its own.
    environment: production-promote

    permissions:
      # Applies to GITHUB_TOKEN, which is still what the two assertion steps use for
      # `gh api`. The pin commit itself goes out over PROMOTE_PUSH_TOKEN — see the
      # checkout step — so `contents: write` here is not what makes the push work.
      contents: write
      packages: read # read image manifests to verify the tag exists

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history: the push below rebases first, and `git pull --rebase` cannot
          # work on checkout's default depth-1 clone.
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN, and the reason is a hard constraint rather than a
          # preference. `main` is governed by the `Proect Main` ruleset, whose only bypass
          # actor is the *admin* repository role; GITHUB_TOKEN acts as the
          # github-actions[bot] app installation, holds no repository role, and its push
          # is rejected with GH013.
          #
          # The obvious fix — add GitHub Actions to the bypass list — is NOT AVAILABLE on
          # this repo, and that is worth writing down so nobody spends an afternoon
          # looking for the checkbox. Bypass actors of type `Integration` must belong to
          # an organization, and this repo is owned by a user account. The UI simply does
          # not offer GitHub Actions in the picker, and the API rejects it outright:
          #
          #   422: Actor GitHub Actions integration must be part of the ruleset source
          #        or owner organization
          #
          # A PAT authenticates as the user, who holds the admin role, so it bypasses via
          # the entry already in the list — no ruleset change at all. The token is scoped
          # to `contents: write` on this repo only and managed by Signet, per CLAUDE.md;
          # the scope does not affect the bypass, which is evaluated on the actor.
          token: ${{ secrets.PROMOTE_PUSH_TOKEN }}
          persist-credentials: true

      - name: Verify the approval gate actually exists
        # `environment:` above silently does nothing if the environment has no protection
        # rules — and GitHub CREATES a missing environment on first use, unprotected. So
        # the failure mode of a typo'd or never-configured environment is not an error,
        # it is a promote that skips the gate and looks like it was approved.
        #
        # Checking after the fact cannot un-skip a gate, but it does stop this run before
        # it commits, and it turns a silent hole into a one-time setup error. Same
        # reasoning as deploy.yml's pinned-image assertion: the guard exists because the
        # thing it guards fails quietly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-promote" --jq '.protection_rules[].type' 2>/dev/null)"; then
            echo "Error: cannot read the 'production-promote' environment."
            echo "Either it does not exist, or the token cannot see it. Create it under"
            echo "Settings > Environments and add at least one required reviewer."
            exit 1
          fi
          if ! printf '%s\n' "$rules" | grep -qx 'required_reviewers'; then
            echo "Error: the 'production-promote' environment has no required reviewers,"
            echo "so this promote was NOT gated by a human."
            echo
            echo "Found protection rules: ${rules:-<none>}"
            echo
            echo "Add one under Settings > Environments > production-promote >"
            echo "Required reviewers. Nothing was committed."
            exit 1
          fi
          echo "Gate present: this run was approved by a required reviewer."

      - name: Verify the push credential is present
        # An empty secret is not a credential (the CLAUDE.md invariant). If
        # PROMOTE_PUSH_TOKEN is unset, `actions/checkout` silently falls back to
        # GITHUB_TOKEN, which cannot bypass the `Proect Main` ruleset — so the failure
        # would surface as a GH013 rejection at the push, five steps and one human
        # approval later, and read as a ruleset problem rather than a missing secret.
        #
        # Checked here for the same reason the gate assertion is: a rollback runs with
        # prod already broken, and the worst moment to discover a missing secret is
        # halfway through fixing an outage.
        env:
          PROMOTE_PUSH_TOKEN: ${{ secrets.PROMOTE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_PUSH_TOKEN:-}" ]; then
            echo "Error: PROMOTE_PUSH_TOKEN is not set."
            echo
            echo "This workflow pushes the pin change to main, which is protected by the"
            echo "Proect Main ruleset. GITHUB_TOKEN cannot bypass it, and GitHub Actions"
            echo "cannot be added as a bypass actor on a user-owned repo (422: must be"
            echo "part of the owner organization). So the push needs a PAT, which"
            echo "authenticates as the admin user and bypasses via the existing entry."
            echo
            echo "Mint a fine-grained PAT with 'contents: write' on this repo only, then:"
            echo "  signet set --project construct-server --name PROMOTE_PUSH_TOKEN"
            echo "  signet target add --secret construct-server/PROMOTE_PUSH_TOKEN \\"
            echo "      --gh-repo Einlanzerous/construct-server"
            echo "  signet sync"
            echo
            echo "Verify the grant actually took — SGNT-29 is the bug where exactly this"
            echo "kind of grant 403'd while 'signet sync --check' reported it healthy."
            echo
            echo "Nothing was committed."
            exit 1
          fi
          echo "Push credential present."

      - name: Resolve the pin variable
        # One variable per SOURCE REPO, not per image — a repo's backend and frontend ship
        # from one release, so 13 variables cover 17 images (versions.env). The service
        # names in the dropdown map onto the keys by uppercasing, cook_book included.
        #
        # SIGNET IS THE ONE EXCEPTION, in both the key and the file (SERV-130). It is a
        # host binary under systemd rather than a container, so it has no image, no
        # registry tag and no compose service — its pin is `SIGNET_VERSION` and it lives
        # in versions-host.env.
        #
        # The separate file is not cosmetic. deploy-scope.sh maps every changed pin in
        # versions.env onto compose services and REFUSES one that no image interpolates,
        # which its caller correctly reads as "pull the whole stack" — so a SIGNET_VERSION
        # in versions.env would make each signet promote trigger a full prod stack pull
        # and recreate. That is the SERV-109 regression arriving through the file that
        # guards against it. versions-host.env's header carries the argument in full.
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [ "$SERVICE" = "signet" ]; then
            key=SIGNET_VERSION
            file=versions-host.env
          else
            key="$(printf '%s' "$SERVICE" | tr '[:lower:]' '[:upper:]')_TAG"
            file=versions.env
          fi
          echo "PIN_KEY=$key" >> "$GITHUB_ENV"
          echo "PIN_FILE=$file" >> "$GITHUB_ENV"
          echo "Service '$SERVICE' pins via $key in $file"

      - name: Log in to GitHub Container Registry
        # Skipped for signet, which has no image: its artifact is a GitHub Release asset,
        # so there is no manifest to read and nothing to authenticate to. The next step
        # verifies it against the releases API instead.
        if: inputs.service != 'signet'
        # Needed to read manifests in the next step, and it has to be the PAT rather than
        # GITHUB_TOKEN: these packages are published from the *service* repos, and a
        # repo's GITHUB_TOKEN can only read packages linked to that repo. deploy.yml
        # reads the same credential from the same place for the same reason.
        run: |
          set -euo pipefail
          env_file=/opt/construct-server/.env
          if [ ! -f "$env_file" ]; then
            echo "Error: no deployed .env at $env_file — the host is not bootstrapped (SERV-76)."
            exit 1
          fi
          GITHUB_USER=$(grep '^GITHUB_USER=' "$env_file" | cut -d'=' -f2)
          GITHUB_PAT=$(grep '^GITHUB_PAT=' "$env_file" | cut -d'=' -f2)
          if [ -z "$GITHUB_USER" ] || [ -z "$GITHUB_PAT" ]; then
            echo "Error: GITHUB_USER/GITHUB_PAT missing from $env_file."
            echo "An empty credential is not a credential — refusing to continue rather"
            echo "than failing later with an opaque manifest error."
            exit 1
          fi
          printf '%s' "$GITHUB_PAT" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      - name: Verify the target version exists in the registry
        # Pre-flight, before anything is written. Nothing else catches a tag that does not
        # exist: versions.env would still be valid, `docker compose config` would still be
        # valid, and deploy.yml's assertion only rejects `:latest` and empty. The deploy
        # would fail at `docker compose pull` with the bad pin already on main — worst
        # during a rollback, which runs when prod is already broken.
        if: inputs.service != 'signet'
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/verify-tag.sh "$PIN_KEY" "$VERSION"

      - name: Verify the target release exists, with its binary
        # Signet's half of the pre-flight above. verify-tag.sh is deliberately not
        # taught about this: it derives its image list from docker-compose.yml, and a
        # host binary has no entry there — it would exit 2 on "no image uses
        # ${SIGNET_VERSION}", which is a correct refusal with a misleading reason.
        #
        # THE ASSET IS CHECKED, NOT JUST THE TAG, and SERV-125 is why. Both argosy and
        # drydock cut releases normally for months while their publish workflows never
        # once fired, so the tags existed and no artifact behind them ever did. A
        # release-exists check would have passed every one of them. Here the same shape
        # would commit a pin that `gh release download` then 404s on, mid-deploy, with
        # the bad pin already on main.
        #
        # A FULL patch tag is required, not major.minor: versions.env lets the registry
        # resolve the newest patch behind `1.12`, and a releases API has nothing to
        # resolve. Checked explicitly so `v1.9` fails here saying so, rather than as a
        # download 404 later.
        if: inputs.service == 'signet'
        env:
          GH_TOKEN: ${{ secrets.SIGNET_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: '$VERSION' is not a full signet release tag."
            echo "Expected vMAJOR.MINOR.PATCH, e.g. v1.9.1."
            echo
            echo "Unlike the container pins, signet cannot take major.minor: there is no"
            echo "registry to resolve the newest patch, and 'gh release download v1.9'"
            echo "has nothing to match. Nothing was committed."
            exit 1
          fi

          # Mirrors signet_asset in ansible/roles/signet/defaults/main.yml, which builds
          # it from the BARE version — the release assets are named without the prefix.
          bare="${VERSION#v}"
          asset="signet-${bare}-linux-amd64"

          # ── the multi-address bind floor ──────────────────────────────────────
          #
          # REFUSED HERE, not warned about, and not left to the deploy. The unit binds
          # "127.0.0.1:4010,172.17.0.1:4010" and anything before v1.4.1 (SGNT-17) reads
          # that whole comma string as one address, fails to bind, and — the unit being
          # Restart=always — burns its start limit in about 25 seconds and lands in
          # `failed`. It does not degrade to loopback-only. It takes the credential
          # daemon down completely.
          #
          # ansible/roles/signet/tasks/binary.yml asserts the same floor, so this is
          # belt and braces on purpose: that assert fires AFTER the pin is committed to
          # main, which is the state verify-tag.sh exists to prevent for the container
          # services — a rollback that fails to install, leaving prod broken with a bad
          # pin now on main and someone mid-incident reading an ansible traceback.
          #
          # SERV-130 item 4: this hazard used to live only in a failure message nobody
          # read until it was already too late. A rollback is initiated HERE.
          #
          # THE FLOOR IS READ, NOT COPIED. Hardcoding `1.4.1` here would be a second
          # spelling of `signet_min_version`, and the failure mode of them drifting is
          # the one this step exists to prevent: raise the floor in ansible only, and
          # this check keeps accepting the version, commits the pin to main, and lets
          # binary.yml refuse it AFTER the bad pin is on main — during a rollback.
          # CLAUDE.md tolerates one such copy (assert-token-shapes.sh vs switchyard's
          # API_TOKEN_RE_SOURCE) and names the ticket that removes it; there is no
          # reason to add a second when the value is one grep away in this checkout.
          #
          # Fails CLOSED: an unreadable floor refuses the promote rather than skipping
          # the check, because "the guard could not run" and "the guard passed" must
          # not look the same from here.
          defaults=ansible/roles/signet/defaults/main.yml
          floor="$(sed -n 's/^signet_min_version:[[:space:]]*["'"'"']\{0,1\}v\{0,1\}\([0-9][0-9.]*\)["'"'"']\{0,1\}[[:space:]]*$/\1/p' "$defaults")"
          if [ -z "$floor" ]; then
            echo "Error: could not read signet_min_version from $defaults."
            echo
            echo "That value is the floor below which a signet binary cannot parse the"
            echo "unit's multi-address bind and fails to start entirely. Refusing to"
            echo "promote without it rather than skipping the check — if the line moved"
            echo "or changed shape, fix this read. Nothing was committed."
            exit 1
          fi
          echo "Minimum installable version, from $defaults: v${floor}"

          lowest="$(printf '%s\n%s\n' "$bare" "$floor" | sort -V | head -1)"
          if [ "$bare" != "$floor" ] && [ "$lowest" = "$bare" ]; then
            echo "Error: $VERSION predates v${floor}, which introduced multi-address SIGNET_ADDR (SGNT-17)."
            echo
            echo "The unit binds two addresses. An older binary cannot parse that and will"
            echo "fail to bind AT ALL — including on loopback — then burn its restart limit"
            echo "in ~25s and land in 'failed'. That is worse than whatever you are rolling"
            echo "back from, and it takes every container's credential path with it."
            echo
            echo "To go back this far, pin signet_addr to a single host:port first. That is"
            echo "an ansible change, so it cannot ride along with a pin commit and this"
            echo "workflow will not pretend otherwise."
            echo
            echo "Nothing was committed."
            exit 1
          fi

          if ! assets="$(gh release view "$VERSION" --repo Einlanzerous/signet \
                          --json assets --jq '.assets[].name' 2>&1)"; then
            echo "Error: no signet release tagged '$VERSION'."
            echo
            echo "$assets"
            echo
            echo "Releases available:"
            gh release list --repo Einlanzerous/signet --limit 10 || true
            echo
            echo "Nothing was committed."
            exit 1
          fi

          missing=
          for want in "$asset" "${asset}.sha256"; do
            printf '%s\n' "$assets" | grep -qx -- "$want" || missing="${missing} ${want}"
          done

          if [ -n "$missing" ]; then
            echo "Error: release $VERSION exists but is missing:${missing}"
            echo
            echo "Assets it does carry:"
            printf '%s\n' "$assets" | sed 's/^/  - /'
            echo
            echo "The deploy downloads the binary AND verifies its checksum, so both are"
            echo "required. A tag with no artifact behind it is the SERV-125 shape — it"
            echo "would commit the pin and 404 mid-deploy. Nothing was committed."
            exit 1
          fi

          echo "Release $VERSION carries $asset and its checksum."

      - name: Warn about migrations
        if: inputs.kind == 'rollback'
        # SERV-79 asks for this to be decided rather than discovered. The decision is
        # WARN, not REFUSE.
        #
        # Refusing is not implementable honestly: whether a rollback is safe depends on
        # what migrations the newer version applied, and each service owns its own
        # migrator with its own schema-version table (amber, lyceum, interlock and purser
        # all differ). This repo cannot inspect that generically, and a check that is
        # right for some services and wrong for others is worse than none — it would
        # produce a confident "safe" that nobody should trust.
        #
        # Warning also keeps rollback fast, which is the point of it. A rollback that
        # blocks on a safety check it cannot actually perform is a rollback that does not
        # get used when prod is down.
        run: |
          echo "::warning title=Migrations do not roll back::The image is rolling back; the database is not."
          cat <<'EOF'
          The image tag rolls back. Applied migrations DO NOT.

          If the version being left applied a migration, the older image is about to run
          against a newer schema. Whether that is fine or fatal depends on the migration:
          an added nullable column is usually harmless, a renamed or dropped one is not.

          This workflow deliberately warns instead of refusing — each service owns its own
          migrator, so there is no generic check this repo could make that would be
          trustworthy for all of them (SERV-79).

          If the rollback crosses a migration, plan the database side before continuing.
          EOF

      - name: Repoint the pin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out="$(./scripts/set-version.sh "$PIN_KEY" "$VERSION" "$PIN_FILE")"
          echo "$out"
          case "$out" in
            *"already"*) echo "NOOP=1" >> "$GITHUB_ENV" ;;
            *)           echo "NOOP=0" >> "$GITHUB_ENV" ;;
          esac

      - name: Commit and push
        if: env.NOOP == '0'
        # Every input reaches the shell through env, never through ${{ }} interpolated
        # into the script body: `reason` is free text, and a run: block that pastes it
        # inline would execute whatever it contained.
        #
        # `chore(deploy):` for both directions deliberately. release-please owns this
        # repo's version (CLAUDE.md), and repointing another service's image is not a
        # change to the stack's own version — a `fix:` here would open a release PR and
        # bump construct-server for something that did not change it.
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Collapses a value to a single line. Defined HERE, above its first use, rather
          # than next to the git trailers it was written for — `requested_by` is free text
          # from whoever holds PROMOTE_DISPATCH_TOKEN, and every place it lands wants the
          # same guarantee. See the trailer block below for the git half of the argument
          # and the $GITHUB_ENV write below for the runner half.
          flatten() { printf '%s' "$1" | tr '\n\r\t' '   ' | sed 's/  */ /g; s/^ //; s/ $//'; }

          # Who to credit. See the header above `on:` — blank means this was run from the
          # Actions tab, where github.actor is the person; a value means an API dispatch
          # told us who asked, because github.actor there is only the token's owner.
          # Both are kept in the prose line: the claim and who was holding the credential
          # when it was made are different facts and an incident review wants both.
          #
          # FLATTENED AT THE ASSIGNMENT, so every downstream use is single-line by
          # construction rather than each one remembering to sanitise. github.actor is a
          # GitHub login and cannot contain a newline; requested_by is arbitrary text.
          if [ -n "${REQUESTED_BY:-}" ]; then
            actor="$(flatten "$REQUESTED_BY")"
            via="dispatched by ${ACTOR}"
          else
            actor="$ACTOR"
            via="via the Actions tab"
          fi

          # Carried to the Summary step, which is a separate shell and would otherwise
          # fall back to `github.actor` — i.e. to the token on any dispatched promote.
          # That is the same misattribution `requested_by` exists to remove, surviving in
          # the other human-readable record of the run, and once Switchyard dispatches
          # routinely it would be wrong every time.
          #
          # THE VALUE MUST BE ONE LINE, and $GITHUB_ENV is a stricter consumer than the
          # trailer block. The runner parses this file when the step EXITS, which is after
          # `git push` below has already put the pin on main — so a value that breaks the
          # parse fails the step with `Invalid format` while the promote has, in every
          # sense that matters, already happened. Worse is the case that does NOT error: a
          # second line that is well-formed `KEY=VALUE` silently defines that variable for
          # every later step, and those are `run:` blocks executed by
          # `bash --noprofile --norc`, which still sources $BASH_ENV. On a self-hosted
          # runner that is arbitrary code as the user owning the deploy root. The
          # production-promote reviewer bounds it and is not a control you would want to
          # be relying on, since nothing in the approval prompt shows this input.
          echo "PROMOTE_ACTOR=$actor" >> "$GITHUB_ENV"

          if [ "$KIND" = "rollback" ]; then
            subject="chore(deploy): roll back ${SERVICE} to ${VERSION} (SERV-79)"
          else
            subject="chore(deploy): promote ${SERVICE} to ${VERSION} (SERV-78)"
          fi

          # ONE FILE, and only ever one — see the header. deploy-scope.sh matches a
          # promote by an exact-equality check on the whole changed-file list, so a
          # second file here does not fail: it silently drops the deploy back to a
          # whole-stack pull and un-fixes SERV-109. The signet path has the same
          # constraint for the opposite reason — versions-host.env must be alone so
          # deploy-signet.yml's trigger is the only one that fires.
          git add "$PIN_FILE"

          # The final -m block holds git TRAILERS, and that is the point (SERV-117).
          # This workflow does not deploy — it commits versions.env and lets deploy.yml's
          # path trigger fire — so the run that reports to the delivery ledger is that
          # one, and these two lines are the only channel by which the kind and the
          # reason reach it. `kind` promises to be "recorded in the commit and the
          # ledger"; before this it reached the commit and stopped there.
          #
          # Trailers rather than a parseable subject line: a reason is free text a human
          # wrote during a rollback, and reasons contain colons.
          #
          # Both in ONE -m, because git parses only the LAST paragraph as the trailer
          # block. Two -m blocks are two paragraphs, and `Delivery-Kind` in the
          # second-to-last one is invisible to `%(trailers:key=...)` — it reads as an
          # ordinary line of prose and deploy.yml finds nothing.
          # `Delivery-Actor` is the third trailer and it is not decoration: it is the
          # ONLY way the promoter's identity reaches the ledger. The deploy is fired by
          # a push authored by PROMOTE_PUSH_TOKEN's owner, so `github.actor` and
          # `github.triggering_actor` in the deploying run are the PAT owner rather
          # than whoever asked for the promote. `Requested by ${ACTOR}` above is prose
          # in the commit body and `%(trailers:key=...)` cannot reach it — git parses
          # only the LAST paragraph as trailers, which is also why all three live in
          # one -m rather than three.
          #
          # A TRAILER IS ONE LINE, so the values that go into the block are flattened
          # first — and SERV-104 is what makes that necessary rather than tidy. Until an
          # API dispatch existed, `reason` could only be typed into a single-line text box
          # in the Actions tab and could not contain a newline. A JSON dispatch can send
          # one, and a newline inside the block breaks git's parse of the whole paragraph:
          # `%(trailers:key=Delivery-Kind)` then returns nothing, deploy.yml reports the
          # deploy with no kind, no reason and no actor, and NOTHING FAILS — the promote
          # succeeds and the ledger row is simply blank. That is the failure this epic
          # exists to remove, arriving through the field meant to prevent it.
          #
          # The prose body above keeps the reason verbatim, newlines included. Only the
          # trailer copy is flattened, because only the trailer copy is parsed — which is
          # why `reason` is flattened here and `actor` was flattened at its assignment:
          # the reason has one use that legitimately wants the raw text, the actor has
          # none. `flatten` is defined at the top of this block.
          git commit \
            -m "$subject" \
            -m "Requested by ${actor} (${via})." \
            -m "Reason: ${REASON}" \
            -m "Delivery-Kind: ${KIND}
          Delivery-Reason: $(flatten "$REASON")
          Delivery-Actor: ${actor}"

          # main IS protected — by the `Proect Main` ruleset, not classic branch
          # protection, which is why `branches/main/protection` returns 404 and makes it
          # look unprotected. This lands because checkout was given a PAT, so the push
          # authenticates as the admin user and bypasses via the entry already in the
          # ruleset. Over GITHUB_TOKEN it would be rejected with GH013.
          #
          # Rebase first in case main moved while this run waited for its approval, which
          # can be a long time. That also satisfies the ruleset's required_linear_history.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # NO EXPLICIT DISPATCH OF deploy.yml, deliberately, and this is the one thing to
          # re-check if the credential ever changes. GitHub does not create workflow runs
          # from events authored by GITHUB_TOKEN, so an earlier version of this file had
          # to dispatch deploy.yml by hand. A PAT-authored push is a normal push event and
          # fires deploy.yml's `versions.env` path trigger on its own — dispatching as
          # well would start a second, concurrent deploy of the same commit.
          echo "Pushed. deploy.yml fires on this commit via its versions.env path trigger."

      - name: Summary
        # The producer side of the delivery ledger (SWY-191) is still a follow-up: this
        # writes a run summary and the commit is the durable record — `git log -p
        # versions.env` is the version history, which is half of why the pins were moved
        # into git at all (SERV-96). Posting the row to Switchyard is what remains.
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            if [ "${NOOP}" = "1" ]; then
              printf '## No change\n\n`%s` is already pinned to `%s`. Nothing was committed and no deploy was triggered.\n' \
                "$SERVICE" "$VERSION"
            else
              printf '## %s: %s -> %s\n\n' "${KIND}" "$SERVICE" "$VERSION"
              printf '| | |\n|---|---|\n'
              printf '| Service | `%s` (`%s` in `%s`) |\n' "$SERVICE" "$PIN_KEY" "$PIN_FILE"
              printf '| Version | `%s` |\n' "$VERSION"
              printf '| Requested by | %s |\n' "${PROMOTE_ACTOR:-$ACTOR}"
              printf '| Commit | `%s` |\n' "${COMMIT_SHA:-unknown}"
              printf '\n**Reason:** %s\n\n' "$REASON"
              if [ "$SERVICE" = "signet" ]; then
                printf 'The commit is on `main`; **Deploy Signet** takes it from here. Its\n'
                printf 'playbook verifies the daemon is actually serving the new version before\n'
                printf 'the run goes green, so a binary that installs and does not come up fails\n'
                printf 'that run (SERV-130).\n'
              else
                printf 'The commit is on `main`; **Deploy to Construct** takes it from here and\n'
                printf 'ends with `scripts/assert-healthy.sh`, so a version that breaks the stack\n'
                printf 'fails that run rather than going quietly green (SERV-102).\n'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
