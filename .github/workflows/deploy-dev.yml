name: Deploy to Dev

# The pipeline's step 2 (SERV-97). `docs/delivery-pipeline.md` has always said a merge
# auto-deploys to dev with no gate — SERV-77 built the dev project and its `make dev-*`
# targets, but nothing moved code into it, so dev was a sandbox someone started by hand
# rather than a pipeline stage. Everything downstream assumes otherwise: the gate suite,
# the verifier (SERV-80), the contract tests (SERV-81). A verifier reading acceptance
# criteria against a stale dev writes a confident verdict about the wrong code, which is
# worse than no verdict at all.
#
# WHY A SCHEDULE AND NOT ONLY A DISPATCH.
# The design of record says `repository_dispatch` → deploy that sha. The service repos do
# dispatch — but from `release.yml`, gated on release-please cutting a version, so
# `image-updated` fires on a RELEASE and not on a merge. Dev tracks `latest`, which
# `publish.yml` pushes on every push to main and announces to nobody. Listening only for
# dispatches would leave dev moving on releases: the exact staleness this ticket exists to
# remove, with a workflow file that looks like it fixed it.
#
# So the schedule is the mechanism that makes the acceptance criterion true today, and the
# dispatch is the mechanism that makes it prompt. Adding a per-merge `deploy-dev` dispatch
# to each service repo's `publish.yml` is the follow-up (SERV-108); when every one of them
# sends it, this cron can drop to a low-frequency backstop or go away.
#
# WHAT THIS DOES NOT DO: touch prod. Different root, different compose file, different
# project, different network, different secret. The last step asserts that rather than
# trusting it.

on:
  workflow_dispatch:
  repository_dispatch:
    # `deploy-dev` is the type a service repo should send on every merge to main.
    # `image-updated` is what they send today, on release — accepted so a release still
    # reaches dev promptly rather than waiting for the next scheduled run.
    types: [deploy-dev, image-updated]
  schedule:
    # Hourly. Dev exists to run what just merged, so a lag measured in hours is the most
    # this can be while still being honest about it. A run with nothing new to pull is a
    # ~1 minute no-op that doubles as a "dev is still healthy" check.
    - cron: '0 * * * *'
  push:
    branches: ["main"]
    paths:
      - 'docker-compose.dev.yml'
      - 'dev-versions.env'
      - 'db/**'
      - 'scripts/**'
      # The dev edge (SERV-93). Both are mounted or built into the dev project, so a
      # change here that never deploys leaves the box running the old copy — the same
      # reason `scripts/**` is on this list. cf-access-guard is shared with prod, whose
      # deploy.yml triggers on it too; a change to it is a change to both edges.
      - 'config/traefik-dev/**'
      - 'services/cf-access-guard/**'
      - '.github/workflows/deploy-dev.yml'

# Same reasoning as deploy.yml: two runs would race on one deploy root, one rendered .env
# and one set of containers. Queue rather than cancel — a cancelled run can have already
# rsynced files or recreated half the project, and half-applied is worse than late. A
# scheduled trigger makes overlap likelier here than in prod, not less.
concurrency:
  group: deploy-construct-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: self-hosted
    # Dev's secrets live on their own GitHub Environment, so this job cannot read
    # PROD_ENV_FILE even by accident — `home-server` is a different environment and only a
    # job declaring it can read its secrets. That is the same boundary prod relies on,
    # pointed the other way (SERV-77).
    #
    # `home-server-dev` carries a deployment branch policy restricting it to `main`, mirroring
    # `home-server`. Without it, `workflow_dispatch` from an arbitrary branch would run that
    # branch's `run:` blocks on the self-hosted runner with DEV_ENV_FILE in scope. Repo write
    # access is needed either way, so this is depth rather than a hole — but the asymmetry
    # with prod would have been unintended. It is GitHub config, not settable from here;
    # re-check it if the environment is ever recreated.
    environment: home-server-dev
    env:
      DEV_ROOT: /opt/construct-server-dev
      DEV_PROJECT: construct-server-dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify required tools are on PATH
        # The runner is a systemd service with a bare system PATH and no login shell, so
        # anything under $HOME is invisible to it. Check explicitly rather than letting a
        # missing binary surface as `command not found` from three layers down inside a
        # make recipe (SERV-62 hit this twice). python3 is here because
        # check-dev-isolation.sh parses the Traefik router config with it, and jq because
        # assert-token-shapes.sh reads compose's resolved config as JSON (SERV-118).
        run: |
          missing=""
          for b in docker make rsync python3 jq; do
            command -v "$b" >/dev/null 2>&1 || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "Error: not on the runner's PATH:$missing"
            echo "The runner does not source a login shell — add the directory via \$GITHUB_PATH."
            exit 1
          fi

      - name: Verify the dev root exists
        # Fail loudly rather than creating it: /opt is root-owned and this job has no sudo,
        # so a mkdir here would fail in a less legible way. Ansible owns creating and
        # chowning the directory, the same split as prod (SERV-76).
        run: |
          if [ ! -d "$DEV_ROOT" ]; then
            echo "Error: dev root $DEV_ROOT does not exist."
            echo "Bootstrap the host first: ansible-playbook ansible/site.yml"
            echo "or, for a one-off:  sudo install -d -o \$(id -un) -g \$(id -gn) $DEV_ROOT"
            exit 1
          fi

      - name: Sync dev stack files to the dev root
        # Only what the dev project reads. --delete is per-directory so a removed file does
        # not linger, and .env is never inside a synced directory — it is written by the
        # next step and has to survive this one.
        run: |
          # rsync creates the LAST component of a destination path and no intermediate
          # ones, so `$DEV_ROOT/config/traefik-dev/` fails on a dev root that has never
          # held a config/ — which is every dev root before SERV-93. db/ and scripts/
          # are one level deep and happened not to need this; the two below are two.
          mkdir -p "$DEV_ROOT/config" "$DEV_ROOT/services"
          rsync -a --delete ./db/      "$DEV_ROOT/db/"
          rsync -a --delete ./scripts/ "$DEV_ROOT/scripts/"
          # The dev edge (SERV-93): traefik-dev mounts config/traefik-dev/, and
          # cf-access-guard-dev is BUILT from services/cf-access-guard/ rather than
          # pulled — the same source as prod's guard, built again for this project so
          # dev depends on no artefact the prod project happens to have around.
          # Synced unconditionally, even when the edge profile is off: a deploy root
          # missing the build context fails at `build` time with a path error rather
          # than at review time, and syncing two small directories costs nothing.
          rsync -a --delete ./config/traefik-dev/        "$DEV_ROOT/config/traefik-dev/"
          rsync -a --delete ./services/cf-access-guard/  "$DEV_ROOT/services/cf-access-guard/"
          rsync -a docker-compose.dev.yml dev-versions.env Makefile "$DEV_ROOT/"

      - name: Restore dev secrets
        # DEV_ENV_FILE is to dev what PROD_ENV_FILE is to prod, and it is emphatically not
        # a copy of it: purser provisions real accounts across four services, so a dev
        # purser holding prod credentials does not fail safely — it succeeds, against
        # production (SERV-77). Start from .env.dev.example and generate every value fresh.
        #
        # RENDERED BY SIGNET from the `construct-server-dev` vault project, not set by
        # hand — so a wrong value is fixed in the vault and `signet sync`d, never with
        # `gh secret set`, which the next sync reverts. That indirection is the durable
        # half of SERV-118: a hand-written environment secret is how 48 characters of hex
        # came to sit where a switchyard API token belonged, for two days, through a
        # deploy that went green.
        #
        # Rendered by the SAME script prod uses, merging the secret with dev-versions.env
        # into one complete .env, so `make dev-*`, check-dev-parity.sh and a bare compose
        # invocation in the dev root all resolve identical values without knowing the pin
        # file exists.
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          if [ -z "$DEV_ENV_FILE" ]; then
            echo "Error: DEV_ENV_FILE secret is missing or empty."
            echo "An empty environment is not an environment — compose would interpolate every"
            echo "credential to the empty string and start a half-configured dev stack."
            echo "DEV_ENV_FILE is rendered by Signet — do not set it by hand."
            echo "Fix it in the vault:  signet target list --project construct-server-dev"
            echo "then:                 signet sync"
            exit 1
          fi
          printf '%s\n' "$DEV_ENV_FILE" | ./scripts/render-env.sh - dev-versions.env "$DEV_ROOT/.env"
          chmod 600 "$DEV_ROOT/.env"

      - name: Is the dev edge deployed? (SERV-93)
        id: edge
        # Dev's edge — traefik-dev, cf-access-guard-dev, cloudflared-dev — carries
        # `profiles: [edge]`, and the switch is the tunnel credential itself: half of
        # SERV-93 lives in the Cloudflare Zero Trust dashboard (a second tunnel, one
        # Access application per dev hostname) and nothing in this repo can create it.
        # So this asks the Makefile, which owns that test, rather than restating it —
        # two places deciding what "the dev edge is deployed" means is how they come
        # to disagree.
        #
        # Runs AFTER the .env is rendered, because that is the file the test reads.
        # A notice rather than a warning when it is off: dev with no edge is the
        # documented interim state, not a fault. What would be a fault is the edge
        # being half-on, and the steps below assert against that rather than this.
        run: |
          on="$(make -s dev-edge-on)"
          echo "on=$on" >> "$GITHUB_OUTPUT"
          if [ -n "$on" ]; then
            echo "Dev edge is ON — the edge profile is active for every step below."
          else
            echo "::notice::Dev edge is not deployed: DEV_ENV_FILE carries no DEV_CLOUDFLARE_TUNNEL_TOKEN. Dev runs on its loopback ports only. See docs/dev-environment.md for the Zero Trust steps (SERV-93)."
          fi

      - name: Verify the rendered environment holds tokens switchyard will accept (SERV-118)
        # switchyard-dev crash-looped 166 times across two days because
        # SWITCHYARD_BOOTSTRAP_TOKEN in DEV_ENV_FILE was 48 characters of hex rather than
        # a switchyard API token — and the deploy that rendered it went green. SWY-295 had
        # just turned a malformed token from a silently dead credential into a loud boot
        # failure, and dev tracks `latest`, so dev was the first tier to run that build.
        # The value had been wrong long before anything said so.
        #
        # This is the render-time half of that fix, and it belongs beside the tag check
        # below for the same reason: both ask whether what we just rendered is coherent,
        # before anything pulls or starts. The DURABLE half is bringing DEV_ENV_FILE under
        # Signet the way PROD_ENV_FILE already is (SERV-94) — a hand-written environment
        # secret is why a wrong value was reachable in the first place, and Signet says so
        # itself: "nothing in construct-server manages DEV_SWITCHYARD_BOOTSTRAP_TOKEN".
        # Until that lands, a deploy that renders an environment the application will
        # refuse fails here rather than 166 restarts and two days later.
        #
        # The script asks compose rather than grepping .env, and prints no credential —
        # its header has the reasoning for both.
        env:
          DEPLOY_ROOT: ${{ env.DEV_ROOT }}
          COMPOSE_FILE: docker-compose.dev.yml
          COMPOSE_PROJECT: construct-server-dev
        run: ./scripts/assert-token-shapes.sh

      - name: Verify every dev tag variable is accounted for
        # Prod's guard asserts no first-party image resolved to `:latest`. Dev cannot borrow
        # it — `latest` is dev's intended state, so the same assertion passes unconditionally
        # here and would be a check that cannot fail. (Nor can a bare trailing `:` occur:
        # `${VAR:-latest}` substitutes the default when the variable is empty as well as
        # when it is unset, so the obvious "did a pin come out blank" test is also
        # unfailable. Verified rather than assumed.)
        #
        # What CAN go wrong is coverage, and it is the same class of bug prod's guard
        # exists for: a dev service added with `${DEV_AMBER_TAG:-latest}` and no matching
        # line in dev-versions.env floats with nothing to hold it, and a line in
        # dev-versions.env that no service reads is a control that silently does nothing.
        # Assert the two sets match, in both directions.
        run: |
          referenced="$(grep -oE '\$\{DEV_[A-Z0-9_]+_TAG' docker-compose.dev.yml | sed 's/^\${//' | sort -u)"
          pinned="$(grep -oE '^DEV_[A-Z0-9_]+_TAG' dev-versions.env | sort -u)"

          unpinned="$(comm -23 <(printf '%s\n' "$referenced") <(printf '%s\n' "$pinned"))"
          dead="$(comm -13 <(printf '%s\n' "$referenced") <(printf '%s\n' "$pinned"))"

          rc=0
          if [ -n "$unpinned" ]; then
            echo "Error: docker-compose.dev.yml reads these variables, dev-versions.env does not set them:"
            printf '%s\n' "$unpinned" | sed 's/^/  - /'
            echo "Each falls through to :-latest with nothing tracked in git holding it there."
            rc=1
          fi
          if [ -n "$dead" ]; then
            echo "Error: dev-versions.env sets these, no service reads them:"
            printf '%s\n' "$dead" | sed 's/^/  - /'
            echo "A pin nothing reads looks like a control and is not one. Remove it."
            rc=1
          fi
          [ "$rc" -eq 0 ] || exit 1
          echo "All $(printf '%s\n' "$referenced" | grep -c .) dev tag variables are set in dev-versions.env."

      - name: Show what dev will pull
        # Compose's own resolution, in the dev root, against the .env it will actually use.
        # Not a grep of that file: compose strips quotes and takes the last of duplicate
        # keys, and a grep-vs-compose disagreement of exactly that kind has shipped a bug
        # here once already (see deploy.yml, SERV-88).
        working-directory: ${{ env.DEV_ROOT }}
        env:
          # Without this the three edge services are filtered out of the resolved
          # config and this step would quietly under-report what the deploy is about
          # to start.
          COMPOSE_PROFILES: ${{ steps.edge.outputs.on == '1' && 'edge' || '' }}
        run: docker compose -f docker-compose.dev.yml config --images | sed 's/^/  /'

      - name: Ensure the dev network exists
        # External and owned by this project alone. NOTHING from prod may join it — the
        # last step of this job is what asserts that. `make dev-up` creates it too; this is
        # here so a missing network reads as its own step rather than as a compose error
        # inside a make recipe.
        run: docker network create construct_dev_net 2>/dev/null || true

      - name: Snapshot what dev is running, before the pull (SERV-117)
        # Half of the answer to "did this run actually deploy anything?". This
        # workflow runs HOURLY, and a tick that pulls nothing has deployed nothing —
        # but the delivery ledger deliberately does NOT deduplicate reports the way
        # it deduplicates observations, because a deploy that really happened twice
        # is two events. So a reporter that fired every tick would append a row an
        # hour, for ever, and bury the handful of rows that are real deploys.
        #
        # Compared on the image DIGEST rather than the tag: dev floats on `latest`,
        # so the tag is the same string on both sides of a pull that moved the whole
        # tier. That is the same trap the pull step above documents.
        #
        # Empty on a cold dev root, which reads correctly as "everything here is new".
        #
        # NAMED FOR THE RUN. `/tmp` survives between jobs on a self-hosted runner,
        # and this step sits behind six that can fail (rsync, render-env, the DEV_
        # tag validation, `config --images`, network create). With a fixed filename
        # a run that died before reaching it would diff against the PREVIOUS run's
        # snapshot, see that run's change again, and append a duplicate row for a
        # tick that pulled nothing — precisely the flooding this guard exists to
        # prevent. Run-scoped, absence means absence, and the resolve step reports
        # nothing rather than guessing.
        continue-on-error: true
        env:
          DEPLOY_ROOT: ${{ env.DEV_ROOT }}
          COMPOSE_FILE: docker-compose.dev.yml
          COMPOSE_PROJECT: construct-server-dev
        # `|| rm -f`, not `|| true`: the redirection creates the file before the
        # script runs, so a failure would leave a ZERO-BYTE baseline — which means
        # the opposite thing, a cold root where everything is new, and would report
        # every tracked service on a run that recreated nothing. On an HOURLY cron
        # that is a row an hour. Absence has to mean absence.
        run: ./scripts/delivery-facts.sh > "/tmp/dev-delivery-before-${{ github.run_id }}.txt" || rm -f "/tmp/dev-delivery-before-${{ github.run_id }}.txt"

      - name: Pull the images dev tracks
        # This is what actually moves dev forward, and it is not optional. Dev floats on
        # `latest`, so the image STRING in the compose file never changes — compose compares
        # that string, sees no drift, and `up -d` alone is a no-op no matter how many times
        # main has moved. A floating tag is not a floating container.
        #
        # No GHCR login step: all four first-party dev images are public packages (verified
        # with an anonymous `docker manifest inspect`), so dev needs no registry credential
        # and DEV_ENV_FILE stays free of a GitHub PAT. If one is ever made private this
        # fails with an auth error rather than silently — which is the right way round.
        run: make dev-pull

      - name: Deploy the dev stack
        # `make dev-up`, NOT a bare `docker compose up -d`, and the target's three steps are
        # not collapsible. `depends_on: service_healthy` only waits for Postgres to accept
        # connections; it says nothing about whether the per-service DATABASES exist, and
        # those are created by db/init-db.sh afterwards. A single `up -d` against a cold dev
        # root starts every service with no database to connect to — measured at 10 restarts
        # each before the ordering was added. Prod gets away with the same shape only
        # because its databases already exist.
        run: make dev-up

      - name: Assert nothing in dev is unhealthy
        id: dev-health
        # Docker computes health and acts on none of it, in dev exactly as in prod
        # (SERV-102). Most dev services declare no healthcheck at all, so this mostly
        # catches the case that matters here — a service that crash-looped or exited — and
        # names the ones that cannot be seen to fail. A shorter timeout than prod's 300s:
        # dev has no `start_period: 15m` service to wait out.
        run: make dev-health-check

      - name: Assert dev is still isolated from prod
        id: dev-isolation
        # SERV-97's acceptance criterion, and the one thing this workflow could plausibly
        # break. Checks from the NETWORK's side as well as the project's, because the
        # regression this repo has already made once is a PROD container joining the dev
        # network — invisible to any dev-side check.
        #
        # always(), because a failed health check is not a reason to stop asking the
        # security question — and an unhealthy dev is one of the states in which someone
        # might reach for the network bridge that this forbids.
        if: always()
        run: make dev-verify-isolation

      - name: Assert the dev origin rejects a spoofed Host (SERV-93)
        id: dev-edge-auth
        # Dev's copy of prod's post-deploy edge gate. The config half would pass in a
        # checkout; the point of running it HERE is the live half, which asks the
        # deployed dev edge whether a request with no valid Cloudflare Access
        # assertion gets served. A middleware present in routers.yml but not in
        # effect — guard down, guard in audit mode, guard holding no signing keys,
        # an address traefik-dev cannot reach — reads as correct everywhere except
        # here.
        #
        # RUNS UNCONDITIONALLY, and the target decides — keying off whether an edge
        # container is actually RUNNING, not off whether the token says one should be.
        # Those come apart: `compose up -d` with a profile off does not stop the
        # containers that profile created, so removing DEV_CLOUDFLARE_TUNNEL_TOKEN
        # leaves a live edge serving while intent says "not deployed". Gating this step
        # on intent would have taken the auth assertion silent over exactly that edge,
        # which is worse than not having it. `make dev-up` above now reconciles the
        # half-on state; this is the belt to that braces.
        #
        # When nothing is running it prints why and exits 0 — a check that "passes" by
        # having nothing to check would be dishonest, but so would a red job over an
        # edge that was never set up. The property that matters while dev has no edge is
        # the isolation assert above, which always runs.
        #
        # always(), for the same reason the isolation check is always() — a failed
        # health check is not a reason to stop asking the security question.
        if: always()
        run: make dev-edge-auth-check

      - name: Report what dev is running
        # The third acceptance criterion: answerable from the run, not by shelling in.
        # Prints the commit each image was built from, not just the digest — a digest
        # comparison alone invents version drift that does not exist, because the publish
        # workflow builds the same source twice seconds apart (SERV-88).
        #
        # always(), so a failed health check still tells you what is deployed — precisely
        # the moment the question gets asked. continue-on-error with it, because a REPORT
        # must not be able to fail a deploy: if an earlier step died before anything was
        # created, this exits 2 for want of containers, and a second red step over the same
        # root cause only obscures the first.
        if: always()
        continue-on-error: true
        env:
          DEPLOY_ROOT: ${{ env.DEV_ROOT }}
          COMPOSE_FILE: docker-compose.dev.yml
          COMPOSE_PROJECT: construct-server-dev
        run: |
          ./scripts/report-versions.sh
          {
            printf '## Dev is running\n\n'
            ./scripts/report-versions.sh --markdown
            printf '\nTriggered by `%s`.\n' "$GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Report the dev deploy to the Switchyard ledger (SERV-117) ───────────────
      #
      # This is the case PULL CAN NEVER COVER. Dev floats on `latest`, so a container
      # inspect yields a digest and no version, and the epic wrote off the entire dev
      # column as version-unknown for that reason. It is not: the image carries
      # `org.opencontainers.image.version` from the release that built it, so a
      # REPORT can name the version even though the tag cannot. Verified on the live
      # tier — dev switchyard is 4.14.0 while prod is 4.13.1, which is precisely the
      # drift this epic exists to make visible.
      #
      # Only what actually moved. See the before-snapshot above for why an hourly
      # cron must not report on every tick.
      - name: Resolve what this run actually deployed
        id: reportable
        if: always()
        continue-on-error: true
        env:
          SWITCHYARD_URL: http://localhost:4002
          SWITCHYARD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          DEPLOY_ROOT: ${{ env.DEV_ROOT }}
          COMPOSE_FILE: docker-compose.dev.yml
          COMPOSE_PROJECT: construct-server-dev
          # The ledger holds ONE row per service with the environment as the other
          # axis, so dev's `switchyard-dev` container is prod's `switchyard` service
          # seen in a second environment. The suffix is a compose-project artefact.
          LEDGER_NAME_STRIP_SUFFIX: -dev
          DISPATCH_IMAGE: ${{ github.event.client_payload.image }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -uo pipefail

          if [ -z "${SWITCHYARD_TOKEN:-}" ]; then
            echo "::warning::SWITCHYARD_DEPLOY_TOKEN is not set — this deploy will not reach the ledger."
            exit 0
          fi

          # STATUS FIRST, before any early exit below — a failed deploy that reports
          # nothing is the failure mode this ordering exists to prevent.
          # Both gates count, the same way prod consults deploy/healthy/edge-auth.
          # The isolation assert is dev's ONLY security gate and the one thing this
          # workflow could plausibly break — its own header says so — so a run that
          # goes red on it must not write `succeeded` to the ledger.
          status=succeeded
          if [ "${{ steps.dev-health.outcome }}" != "success" ] \
            || [ "${{ steps.dev-isolation.outcome }}" != "success" ] \
            || [ "${{ steps.dev-edge-auth.outcome }}" = "failure" ]; then
            status=failed
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          # A SCHEDULED tick does not report a successful move (SERV-121).
          #
          # This workflow runs hourly, and its report would contribute a run URL
          # pointing at a cron job — near-zero provenance. What it actually did was
          # STEAL the enrichment: on the 4.15.0 release the 05:25 tick pulled the
          # backend four minutes before the dispatch carrying commit_count,
          # ticket_keys and the gate result arrived, so the row was written bare and
          # the dispatch found nothing left to move.
          #
          # The prober still observes the move within five minutes, so the matrix
          # shows the right version either way. It simply carries no CLAIM, which is
          # honest: nobody decided that deploy.
          #
          # `schedule` only, and after the status write. A workflow_dispatch is not
          # racing anything and a human triggering it IS provenance; and a tick whose
          # deploy FAILED is the one row with no substitute, so failures still report
          # on every path.
          if [ "$status" = "succeeded" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled tick, deploy succeeded — the prober covers what moved; no claim to add."
            exit 0
          fi

          # `--since` keeps only what this run recreated — a change in the image
          # digest or the container id — and then only what the ledger tracks. An
          # hourly tick that pulled nothing produces no lines and writes no row.
          #
          # On FAILURE the filter is dropped: a broken dev tier is not a no-op, and
          # the run may have died before anything was recreated, so "what moved" is
          # exactly the question that has no answer then.
          if [ "$status" = "failed" ]; then
            echo "Dev deploy failed — reporting every tracked service, not just what moved."
            noise="$(./scripts/delivery-reportable.sh 2>&1 >/tmp/dev-reportable.txt || true)"
          else
            noise="$(./scripts/delivery-reportable.sh --since "/tmp/dev-delivery-before-${{ github.run_id }}.txt" 2>&1 >/tmp/dev-reportable.txt || true)"
          fi
          printf '%s\n' "$noise"
          lines="$(cat /tmp/dev-reportable.txt 2>/dev/null || true)"

          # THE DISPATCH MATCH IS RESOLVED BEFORE THE EMPTY-LIST EXIT.
          #
          # Ordering, not style. The whole point of the fallback is the case where
          # THIS run moved nothing tracked — the cron got the image first — and an
          # early exit above it would skip the one branch it exists for, leaving the
          # release with no row at all now that the cron no longer writes one. That
          # is the "strictly worse" outcome SERV-121 warned about in advance.
          #
          # The enrichment describes a VERSION, not a run, so when the filtered
          # match is empty it asks what is running now, unfiltered.
          enriched=""
          if [ -n "${DISPATCH_IMAGE:-}" ] && [ -n "${DISPATCH_VERSION:-}" ]; then
            match="$(printf '%s\n' "$lines" | grep -x -- "${DISPATCH_IMAGE}=${DISPATCH_VERSION}" || true)"
            if [ -z "$match" ]; then
              match="$(./scripts/delivery-reportable.sh 2>/dev/null \
                | grep -x -- "${DISPATCH_IMAGE}=${DISPATCH_VERSION}" || true)"
              [ -n "$match" ] && echo "Dispatched version is already live — reporting it with its provenance anyway."
            fi
            [ -n "$match" ] && enriched="$match"
          fi

          if [ -z "$lines" ] && [ -z "$enriched" ]; then
            echo "Nothing moved that the ledger tracks, and no dispatched version is live — no row to write."
            exit 0
          fi
          [ -n "$lines" ] && { echo "Deployed by this run:"; printf '%s\n' "$lines" | sed 's/^/  /'; }

          # With `lines` empty and `enriched` set this yields the empty string, so the
          # "everything else" step stays skipped on its `!= ''` guard.
          plain="$lines"
          if [ -n "$enriched" ]; then
            plain="$(printf '%s\n' "$lines" | grep -vx -- "$enriched" || true)"
          fi

          {
            echo "enriched=${enriched}"
            echo "plain<<PLAIN_EOF"
            printf '%s\n' "$plain"
            echo "PLAIN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the released service to dev, with its provenance
        if: always() && steps.reportable.outputs.enriched != ''
        continue-on-error: true
        env:
          # Explicit, not the script default: the `reportable` step above spells the
          # same endpoint out, and a port move that edits one and misses these is a
          # ledger gap on a GREEN run, not a red job.
          RD_URL: http://localhost:4002
          RD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          RD_ENVIRONMENT: dev
          RD_SERVICE: ${{ github.event.client_payload.image }}
          RD_VERSION: ${{ github.event.client_payload.version }}
          RD_STATUS: ${{ steps.reportable.outputs.status }}
          RD_SHA: ${{ github.event.client_payload.sha }}
          RD_COMMIT_COUNT: ${{ github.event.client_payload.commit_count }}
          # Guarded: `toJson()` of a MISSING property is the four-character string
          # `null`, not empty — and the filter would take that for a
          # comma-separated list and post `ticket_keys: ["null"]`, a link on the
          # matrix to a ticket that does not exist. Any dispatch carrying
          # image+version without ticket_keys hits it.
          RD_TICKET_KEYS: ${{ github.event.client_payload.ticket_keys && toJson(github.event.client_payload.ticket_keys) || '' }}
          RD_GATE_PASSED: ${{ github.event.client_payload.gate_passed }}
          RD_GATE_TOTAL: ${{ github.event.client_payload.gate_total }}
          RD_GATE_RUN_URL: ${{ github.event.client_payload.gate_run_url }}
          RD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-deploy.sh
      - name: Report everything else dev moved to
        if: always() && steps.reportable.outputs.plain != ''
        continue-on-error: true
        env:
          # Explicit, not the script default: the `reportable` step above spells the
          # same endpoint out, and a port move that edits one and misses these is a
          # ledger gap on a GREEN run, not a red job.
          RD_URL: http://localhost:4002
          RD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          RD_ENVIRONMENT: dev
          RD_SERVICES: ${{ steps.reportable.outputs.plain }}
          RD_STATUS: ${{ steps.reportable.outputs.status }}
          RD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-deploy.sh
