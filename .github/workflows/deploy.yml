name: Deploy to Construct

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy, image-updated]
  push:
    branches: ["main"]
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'config/**'
      # ...but NOT the dev edge's Traefik config (SERV-93). Nothing in the prod stack
      # reads it, and `config/**` would otherwise make a dev-only routing edit fire a
      # PROD deploy — which, being a change outside versions.env, takes the whole-stack
      # path in deploy-scope.sh (SERV-109) and pulls every first-party service whose
      # major.minor pin has published since. A dev edit must not roll prod forward.
      # deploy-dev.yml carries the matching positive trigger.
      - '!config/traefik-dev/**'
      - 'aperture/**'
      - 'db/**'
      - 'caddy/**'
      # versions.env is what a version change edits (SERV-96), and promote/rollback
      # (SERV-78, SERV-79) will commit it — so a push that repoints a tag has to be
      # able to reach the box on its own.
      - 'versions.env'
      # scripts/ is rsynced to the deploy root and executed FROM there — by the
      # Makefile targets, and since SERV-111 by delivery-prober.service, which
      # runs $DEPLOY_ROOT/scripts/probe-delivery.sh every five minutes. Without
      # this path a script fix merges to main and the box keeps running the old
      # copy until some unrelated change happens to trigger a deploy: the same
      # "editing a checkout changes nothing" hazard SERV-76 fixed for compose,
      # one directory over. Note deploy.yml itself runs these from the CHECKOUT,
      # deliberately, so this trigger is about the copy other things execute.
      - 'scripts/**'
      # cf-access-guard is the one first-party service BUILT on the box rather than
      # pulled (SERV-106), which makes its source a stack file. Without this a guard
      # change merges and then waits for an unrelated deploy to carry it — and since
      # SERV-109 that carrier might be a scoped one, which would not apply it at all.
      # Narrow to the one directory on purpose: services/ also holds argosy-acquisition,
      # which is not part of this stack.
      - 'services/cf-access-guard/**'
      # …and the shared verifier it is built from (SERV-131). The guard imports
      # pkg/cfaccess through a path replace, so a module-only change is a change to
      # the deployed binary with nothing under services/ to show for it.
      - 'pkg/cfaccess/**'

# Two deploys running at once would race on the same deploy root, the same rendered .env
# and the same containers. That was unlikely while a deploy only ever came from a person
# merging, but promote.yml (SERV-78) pushes a versions.env commit straight to main, which
# fires the path trigger above — so a promote landing alongside an ordinary merge is now
# an ordinary occurrence. Queue rather than cancel:
# a cancelled deploy can have already rsynced files or recreated half the stack, and
# leaving that half-applied is worse than waiting.
concurrency:
  group: deploy-construct
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: home-server
    env:
      # The stack is deployed from a fixed path, NOT from this checkout (SERV-76).
      # `_work/` is a CI scratch directory shared by every self-hosted workflow in
      # this repo — deploy.yml, deploy-signet.yml and pr-review.yml all check out
      # here, and actions/checkout resets it on every run. Because pr-review.yml
      # fires on `pull_request`, this directory frequently holds an *unmerged* PR
      # merge ref. Binding the live compose project to it meant "what is deployed"
      # depended on which workflow ran last. Ansible deploys to the same fixed path.
      DEPLOY_ROOT: /opt/construct-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history, because the deploy-scope step (SERV-109) diffs the commit range
          # this push covers and checkout's default depth-1 clone cannot resolve
          # `github.event.before`. Cheap on this runner: `_work/` persists between runs,
          # so only the first fetch is a full one.
          #
          # Getting this wrong is not dangerous, only wasteful — deploy-scope.sh refuses
          # on an unresolvable ref and the deploy falls back to a whole-stack pull. That
          # is verified, not assumed: run against a --depth 1 clone it exits 3.
          fetch-depth: 0

      - name: Verify required tools are on PATH
        # The runner is a systemd service with a bare system PATH and no login shell, so
        # anything under $HOME is invisible to it. Check explicitly rather than letting a
        # missing binary surface as `command not found` from three layers down inside a
        # script (SERV-62 hit this twice).
        #
        # deploy-dev.yml has carried this step since SERV-97 (and added jq to it in
        # SERV-118); prod never had one at all, and until now that was survivable. jq is
        # reached by delivery-reportable.sh, which checks for it itself, and by
        # report-deploy.sh, which does not — but both run at the very END of the deploy
        # under continue-on-error, so a miss costs a report on a stack that is already
        # up. The token gate below changes that: it reads compose's resolved config as
        # JSON, and a gate that exits 2 on a missing dependency is a gate that did not
        # run. That failure should read as "jq is not on PATH" here, rather than as
        # "cannot resolve the environment" eight steps later.
        #
        # Each name earns its place: docker and rsync for the sync and deploy steps, jq
        # for the token gate and report-deploy.sh, python3 for deploy-scope.sh and
        # check-edge-auth.sh, curl for the reporting and edge-auth steps. `git` is
        # deliberately absent — actions/checkout above cannot have succeeded without it,
        # so checking here would be a test that can only pass.
        run: |
          missing=""
          for b in docker rsync jq python3 curl; do
            command -v "$b" >/dev/null 2>&1 || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "Error: not on the runner's PATH:$missing"
            echo "The runner does not source a login shell — add the directory via \$GITHUB_PATH."
            exit 1
          fi

      - name: Verify deploy root exists
        # Fail loudly rather than creating it here: /opt is root-owned and the
        # runner has a bare system PATH with no login shell, so a mkdir would need
        # sudo semantics this job deliberately does not have. Ansible owns creating
        # and chowning the directory (`ansible/roles/server`), which is also what
        # populates it on a cold host. A missing root should read as "the host was
        # never bootstrapped", not as a confusing compose error three steps later.
        run: |
          if [ ! -d "$DEPLOY_ROOT" ]; then
            echo "Error: deploy root $DEPLOY_ROOT does not exist."
            echo "Bootstrap the host first: ansible-playbook ansible/site.yml"
            exit 1
          fi

      - name: Sync stack files to deploy root
        # Only the files the running stack actually reads. --delete is per-directory
        # so a removed config file does not linger, and .env is never in a synced
        # directory — it is written by the next step and must survive this.
        run: |
          rsync -a --delete ./config/    "$DEPLOY_ROOT/config/"
          rsync -a --delete ./db/        "$DEPLOY_ROOT/db/"
          rsync -a --delete ./aperture/  "$DEPLOY_ROOT/aperture/"
          rsync -a --delete ./scripts/   "$DEPLOY_ROOT/scripts/"
          # cf-access-guard is the one service built on the box (SERV-106), so its
          # source is a stack file. Named explicitly rather than syncing ./services/
          # wholesale: that directory also holds argosy-acquisition, which carries a
          # real .env and a live sqlite database that have no business in the deploy
          # root. --delete is scoped to this one subdirectory for the same reason.
          #
          # mkdir first: rsync creates the LAST component of a destination path, not
          # missing parents, so on a root that has never had services/ the sync fails
          # with "No such file or directory". The build step then does not fail with
          # it — `up -d` happily starts whatever image is already in the local daemon
          # cache — so without this the deploy would look green while running stale
          # guard code. Seen for real on the first rehearsal.
          mkdir -p "$DEPLOY_ROOT/services"
          rsync -a --delete ./services/cf-access-guard/ "$DEPLOY_ROOT/services/cf-access-guard/"
          # The guard's build reads pkg/cfaccess as a named build context (SERV-131),
          # so the module is a stack file for exactly the same reason the guard's own
          # source is. Without this the build fails on the deploy root rather than
          # silently building something stale — the named context does not exist —
          # but only after the rsync step has already claimed success.
          mkdir -p "$DEPLOY_ROOT/pkg"
          rsync -a --delete ./pkg/cfaccess/ "$DEPLOY_ROOT/pkg/cfaccess/"
          rsync -a docker-compose.yml Makefile versions.env "$DEPLOY_ROOT/"

      - name: Restore Secrets
        # The deployed environment comes from two sources with different homes (SERV-96):
        # PROD_ENV_FILE carries the credentials, and versions.env — tracked in git —
        # carries the first-party image pins, which are not secrets. Keeping the pins in
        # a file makes a version change a reviewable commit instead of an unlogged secret
        # edit, and gives promote/rollback (SERV-78, SERV-79) something they can actually
        # write: GITHUB_TOKEN has no `secrets` permission, so repointing a tag inside the
        # secret would need a PAT with environment-secret write (the grant that 403'd in
        # SGNT-29), while writing a file needs `contents: write`.
        #
        # render-env.sh merges them into ONE file rather than compose reading two via
        # --env-file, so the deployed .env stays the complete environment: a bare
        # `docker compose up -d` on the box, the Makefile targets and
        # check-compose-drift.sh all keep resolving the same values without knowing
        # versions.env exists. See that script's header for the rest of the reasoning.
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "Error: PROD_ENV_FILE secret is missing or empty!"
            exit 1
          fi
          printf '%s\n' "$PROD_ENV_FILE" | ./scripts/render-env.sh - versions.env "$DEPLOY_ROOT/.env"
          chmod 600 "$DEPLOY_ROOT/.env"

      - name: Verify the rendered environment holds tokens switchyard will accept (SERV-124)
        # The render-time gate dev has had since SERV-118, now on the tier that needed it
        # more. `assert-token-shapes.sh` shipped gating deploy-dev.yml while prod got the
        # same script as a DIAGNOSTIC — `make assert-tokens`, which nobody is obliged to
        # run. Prod carries five of these variables to dev's two and the worse failure:
        # since SWY-295 a malformed BOOTSTRAP_TOKEN makes switchyard REFUSE TO BOOT, and
        # prod switchyard is the ticket system the rest of the estate is tracked in.
        #
        # THE GATE IS NOT ONLY A DETECTOR — IT IS WHAT PRESERVES THE RECOVERY.
        # `ensureBootstrapToken` is additive, so a bad value cannot be repaired by
        # correcting the variable: it adds a second dead row. The last copy of the good
        # token lives in the RUNNING container's environment, and it survives exactly
        # until the recreate. Stopping here — after the render, before anything pulls,
        # builds or recreates — is what keeps it readable. That is not hypothetical: on
        # 2026-08-22 this script failed the dev deploy at precisely this point,
        # switchyard-dev was never recreated, and the good value was still there to be
        # recovered from it.
        #
        # AND "PROD IS SAFER BECAUSE IT IS SIGNET-MANAGED" IS FALSE. SERV-118 left prod
        # ungated partly on that reasoning; the same day disproved it. DEV_ENV_FILE was
        # brought under Signet seeded from a stale `creds/dev.env`, and `signet render
        # --check` compares key SETS, not values — by design, so it can run without
        # holding secrets. A vault handover therefore cannot see a wrong value on its way
        # in, and that is as true of a prod handover as it was of dev's. Vault management
        # protects against a hand-EDITED value; it does nothing about a WRONG one, and
        # `sync` will silently revert an out-of-band correction because whatever the vault
        # holds wins. Both tiers are Signet-rendered now, so the two are symmetric.
        #
        # ENFORCING, NOT A REHEARSAL MODE, AND THE REASON IS NOT IMPATIENCE.
        # cf-access-guard shipped with `CF_ACCESS_GUARD_MODE=audit` because the question
        # it asked — which real requests carry a valid Access JWT — could only be answered
        # against live traffic nobody had characterised. There is no equivalent unknown
        # here: the input is five variables, every one of them was inspected on
        # 2026-08-22, and `make assert-tokens` reported 5/5 well shaped. A warn period
        # would observe what is already known, and it would need its own forcing function
        # — check-edge-auth.sh fails while that audit mode is set, which is the only
        # reason that rehearsal did not become the steady state. Enforcing from the start
        # is the cheaper honest option.
        #
        # THE COST, STATED PLAINLY. The regex is a SECOND COPY, in shell, in this repo, of
        # switchyard's `API_TOKEN_RE_SOURCE`, and it fails CLOSED: if switchyard widens the
        # alphabet or the length, a newly minted VALID token fails this check and blocks
        # the production deploy path until someone edits a shell script here. That is the
        # accepted trade, not an oversight — the ungated failure mode is prod switchyard
        # refusing to boot after a rotation, with its own recovery path destroyed by the
        # recreate, which is strictly worse than a loud deploy failure fixable in one
        # line. Same direction as SERV-102 and SERV-106: prefer the noisy failure to the
        # silent one. SWY-303 removes the copy by publishing the pattern for this script
        # to read; when it lands, this comment is what should shrink.
        #
        # THE GATE IS STACK-WIDE AND THE DEPLOYS IT GATES ARE NOT. Under SERV-109 a
        # promote or rollback pulls and recreates only the services behind the pins that
        # moved, so a malformed leaf-consumer token — SWITCHYARD_TOKEN_N8N_VOX_DICTATE,
        # which authenticates one n8n workflow — fails this step and therefore fails a
        # rollback of, say, purser, which would never have touched n8n. A rollback runs
        # with prod already broken and its whole value is being predictable, so it is the
        # deploy least able to absorb a new precondition. Left stack-wide anyway: scoping
        # the check to the services being recreated would mean the environment is only
        # ever inspected where it is already being changed, and the failure this exists to
        # catch is a bad value sitting in a variable nobody touched. Worth knowing which
        # deploy it will bite, which is why it is written here rather than only weighed.
        #
        # No credential reaches the log — the script reports the variable, its length and
        # whether it carries the `sw_` prefix, and its header has the reasoning for that
        # and for asking compose rather than grepping .env.
        run: ./scripts/assert-token-shapes.sh

      - name: Verify first-party image tags are pinned
        # The `:-latest` default in docker-compose.yml is a bootstrap convenience, and
        # once real pins exist it becomes a hazard: a tag var dropped from versions.env
        # would not fail, it would silently float that service back to `latest` and
        # quietly undo SERV-88. That is the empty-environment-variable invariant exactly
        # — an unset value must never be treated as a value.
        #
        # So the fallback stays (a fresh host with no pins still starts), and prod is
        # protected by asserting here instead. Fail loudly and name the offenders,
        # rather than deploying something whose version nobody chose.
        #
        # Assert on compose's OWN resolution, not on a grep of .env. An earlier version
        # of this step read the raw text after `=`, which disagrees with compose in
        # three ways: compose strips surrounding quotes, so `PURSER_TAG=""` is two
        # characters to a shell test but the empty string to compose (it floated purser
        # to `:latest` while this step reported success); compose takes the LAST
        # duplicate key where a grep takes the first; and a hardcoded variable list goes
        # quietly stale the day an eleventh service is added. Reading `config --images`
        # in the deploy root, against the same .env compose will use, cannot disagree
        # with compose by construction.
        #
        # Scoped to ghcr.io/einlanzerous deliberately: several third-party images
        # (dozzle, cloudflared, n8n, semaphore) sit on `:latest` legitimately, and an
        # unscoped check would fail every deploy on them.
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          images="$(docker compose config --images)"
          firstparty="$(printf '%s\n' "$images" | grep '^ghcr\.io/einlanzerous/' || true)"
          # `:latest` = floated back to the fallback; a bare trailing `:` = an empty var
          # interpolated in, which is neither an error nor `latest`.
          unpinned="$(printf '%s\n' "$firstparty" | grep -E ':(latest)?$' || true)"
          if [ -n "$unpinned" ]; then
            echo "Error: these first-party images are not pinned to a version:"
            printf '%s\n' "$unpinned" | sed 's/^/  - /'
            echo
            echo "Each resolves to a floating or empty tag, making the deployed version"
            echo "nondeterministic again (SERV-88). Fix the matching <SERVICE>_TAG in"
            echo "versions.env and merge it — the pins are tracked in git, not in the"
            echo "PROD_ENV_FILE secret (SERV-96)."
            exit 1
          fi
          echo "All $(printf '%s\n' "$firstparty" | grep -c .) first-party images are pinned."

      - name: Ensure construct_net network exists
        run: docker network create construct_net 2>/dev/null || true

      - name: Ensure the wiki bind source exists
        # The wiki service mounts $DEPLOY_ROOT/wiki/site, which is generated content
        # and therefore not in the repo — wiki.yml creates it. If compose gets there
        # first, the Docker daemon creates the missing bind source as ROOT, and every
        # subsequent rsync from wiki.yml (running as the runner user) fails against
        # it, permanently.
        #
        # Ansible claims this path on a cold host; this covers the ordering race on a
        # warm one, since nothing sequences these two workflows. mkdir -p is a no-op
        # when it already exists and cannot fix a directory already owned by root —
        # which is why the ansible task is the real guard, and this is the cheap one.
        run: mkdir -p "$DEPLOY_ROOT/wiki/site"

      - name: Log in to GitHub Container Registry
        run: |
          GITHUB_USER=$(grep '^GITHUB_USER=' "$DEPLOY_ROOT/.env" | cut -d'=' -f2)
          GITHUB_PAT=$(grep '^GITHUB_PAT=' "$DEPLOY_ROOT/.env" | cut -d'=' -f2)
          echo "$GITHUB_PAT" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      - name: Resolve the guard's source revision
        # cf-access-guard is built on the box rather than pulled (SERV-106), so unlike
        # every pinned image nothing records which SOURCE the running container was built
        # from — and SERV-109 needs that, because a scoped deploy has to decide whether to
        # recreate it. The image ID cannot answer: BuildKit re-exports the config on every
        # build, so a full cache hit still yields a new ID and an ID comparison would
        # recreate the auth-path container on every deploy.
        #
        # Runs in the CHECKOUT: the deploy root is an rsync target with no git history.
        # An empty result is not fatal and must not read as a match — the scoped path
        # below recreates the guard whenever it cannot prove the running one is current.
        #
        # BOTH paths, since SERV-131: the guard's behaviour now lives partly in
        # pkg/cfaccess, so a revision taken from services/cf-access-guard alone would
        # be unchanged by a module-only edit — and the scoped path below would then
        # prove the running guard "current" while it ran the old verifier. That is the
        # one failure this label exists to make impossible.
        run: |
          set -uo pipefail
          rev="$(git log -1 --format=%H -- services/cf-access-guard pkg/cfaccess || true)"
          echo "GUARD_REVISION=$rev" >> "$GITHUB_ENV"
          echo "cf-access-guard source revision: ${rev:-<could not resolve>}"

      - name: Build cf-access-guard
        # EXPLICIT, because `up -d` builds only when the image is MISSING — it does
        # not notice that the source changed. Without this step an edit to the guard
        # would rsync to the deploy root and then be ignored for as long as a stale
        # image existed, which for a service that decides whether requests are
        # authenticated is the worst possible kind of silent no-op.
        #
        # Cheap after the first run: the source is stdlib-only Go with no module
        # downloads — pkg/cfaccess is imported through a path replace and arrives as a
        # build context, not from a proxy — so an unchanged tree is a layer-cache hit.
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: docker compose build cf-access-guard

      - name: Determine deploy scope
        # SERV-109. A promote or rollback commit touches versions.env and nothing else
        # (promote.yml writes exactly that), which makes it recognisable — and it is the
        # one deploy where "and also whatever else moved" is unacceptable, because a
        # rollback runs with prod already broken and its value is being predictable.
        #
        # Runs in the CHECKOUT rather than the deploy root: the deploy root is an rsync
        # target with no git history, and this question is entirely about the commit range.
        #
        # THE FALLBACK DIRECTION IS THE WHOLE SAFETY ARGUMENT. Anything unexpected — a
        # dispatch with no push range, an unresolvable ref, a pin that maps to no service —
        # sets FULL, which is byte-for-byte the deploy this workflow did before SERV-109.
        # Nothing may set the scope to "no services" except deploy-scope.sh exiting 0 with
        # an empty list, which means no image reference changed at all. A scope that
        # silently narrowed to nothing would be a deploy that goes green and ships nothing,
        # the same class of failure as the stale-image incident in the rsync step above.
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "This run has no push range (workflow_dispatch or repository_dispatch)."
            echo "A dispatch can be for anything, so it deploys the whole stack."
            echo "DEPLOY_SCOPE=FULL" >> "$GITHUB_ENV"
            exit 0
          fi
          if scope="$(./scripts/deploy-scope.sh "$BASE" "$GITHUB_SHA")"; then
            if [ -z "$scope" ]; then
              echo "=> scope: NONE (no image reference changed)"
              echo "DEPLOY_SCOPE=NONE" >> "$GITHUB_ENV"
              echo "### Deploy scope: nothing to pull" >> "$GITHUB_STEP_SUMMARY"
              echo "\`versions.env\` changed but no pin value did." >> "$GITHUB_STEP_SUMMARY"
            else
              services="$(printf '%s' "$scope" | tr '\n' ' ')"
              echo "=> scope: SCOPED to ${services% }"
              echo "DEPLOY_SCOPE=SCOPED" >> "$GITHUB_ENV"
              echo "DEPLOY_SERVICES=$services" >> "$GITHUB_ENV"
              echo "### Deploy scope: version change only" >> "$GITHUB_STEP_SUMMARY"
              echo "Pulling and recreating **only**: \`${services% }\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "=> scope: FULL (whole stack)"
            echo "DEPLOY_SCOPE=FULL" >> "$GITHUB_ENV"
          fi

      - name: Read the promote/rollback provenance off the commit (SERV-117)
        # PUSH ONLY. On workflow_dispatch and repository_dispatch `github.sha` is
        # whatever main's tip happens to be, which after a promote or rollback is
        # THAT commit — so an unrelated dispatch deploy two hours later would read
        # its trailers and report `rolled_back` on a service nobody rolled back,
        # quoting somebody else's reason, on the page whose whole job is to be
        # believed. It persists until the next commit lands on main, and
        # re-running deploy.yml from the Actions tab is the one time the tip is
        # guaranteed to be a promote commit.
        #
        # On a push the trailer commit IS the tip that was just pushed, which is
        # exactly the run promote.yml intended to trigger.
        if: github.event_name == 'push'
        # promote.yml holds the two facts the delivery ledger most wants and has
        # nowhere to put them: `kind` (promote | rollback) and a REQUIRED `reason`.
        # Its own input description says the kind is "recorded in the commit and the
        # ledger" — until now only the first half was true, because promote.yml does
        # not deploy. It commits versions.env and lets this workflow's path trigger
        # fire, so this is the run that has to carry them forward.
        #
        # Read as git trailers rather than by parsing the subject line: a reason is
        # free text written by a human under pressure during a rollback, and a
        # subject-line regex would mangle the ones containing a colon.
        #
        # Empty on an ordinary merge, which is correct — there is no promote reason
        # for a deploy nobody promoted, and the ledger omits the note rather than
        # inventing one.
        run: |
          set -uo pipefail
          kind="$(git log -1 --format='%(trailers:key=Delivery-Kind,valueonly)' | head -1 | tr -d '\r')"
          reason="$(git log -1 --format='%(trailers:key=Delivery-Reason,valueonly)' | head -1 | tr -d '\r')"
          echo "DELIVERY_KIND=${kind}" >> "$GITHUB_ENV"
          # The ledger bounds `note` at 500 characters and the API rejects a longer
          # one outright. Trim here so a verbose reason costs its tail rather than
          # the whole report.
          echo "DELIVERY_NOTE=${reason:0:500}" >> "$GITHUB_ENV"
          if [ -n "$kind" ]; then
            echo "This deploy is a ${kind}: ${reason:-<no reason given>}"
          fi

      - name: Snapshot what prod is running, before the deploy (SERV-117)
        # The baseline for "what did this run actually deploy?". Compared on the
        # image DIGEST after `up -d`, because a FULL deploy fires on a push to
        # `config/**`, `db/**`, `caddy/**` or `scripts/**` and recreates nothing —
        # and reports are deliberately NOT deduplicated the way observations are,
        # so a reporter that fired on every run would append a row per no-op.
        #
        # NAMED FOR THE RUN. `/tmp` survives between jobs on a self-hosted runner,
        # so a fixed filename left by a previous run would be diffed against by the
        # next one — and a run that failed before this step would then "detect" the
        # PREVIOUS run's change and report it a second time. The run-scoped name
        # makes absence mean absence: delivery-reportable.sh reports nothing when
        # the baseline is missing, which is the honest reading of "this step never
        # executed".
        continue-on-error: true
        # `|| rm -f`, not `|| true`. The redirection creates the file before the
        # script runs, so a failure would otherwise leave a ZERO-BYTE baseline —
        # and an empty baseline means something specific and opposite: a cold root
        # where every container is new. delivery-reportable.sh would then report
        # every tracked service for a run that recreated nothing. Removing it puts
        # the run back in the "no baseline, report nothing" branch, which is the
        # honest reading of "I could not look".
        run: ./scripts/delivery-facts.sh > "/tmp/delivery-before-${{ github.run_id }}.txt" || rm -f "/tmp/delivery-before-${{ github.run_id }}.txt"

      - name: Deploy Stack
        id: deploy
        # Deliberately NOT --force-recreate in either path: compose recreates only what
        # actually drifted, so the blast radius already matches the intent. Do not add it —
        # it would rebuild every container on the box, including the shared postgres, on
        # every push (SERV-63).
        #
        # Running from the deploy root is what resolves the relative bind mounts
        # (./config, ./db, ./aperture) against it rather than against this checkout,
        # and what binds the compose project to a stable path.
        #
        # TWO PATHS, because `pull` means different things on the two kinds of deploy
        # (SERV-109):
        #
        #   FULL — an ordinary merge, or any dispatch. A whole-stack pull, which under the
        #     major.minor pins fetches patch releases and nothing else. That float is the
        #     one we keep deliberately (SERV-88), so a security fix lands without an edit.
        #
        #   SCOPED — the commit changed versions.env and nothing else, i.e. a promote or a
        #     rollback. Only the services behind the pins that actually moved are pulled and
        #     recreated. Without this, rolling purser back also recreates lyceum if lyceum
        #     cut a patch since the last deploy — collateral nobody named, and worse than
        #     the third-party case SERV-105 closed, because these services have dependents
        #     and per SERV-102 the Node ones do not recover from a peer recreate on their own.
        #
        # --no-deps on the scoped path for the SERV-63 reason: every service with a database
        # depends on postgres, so an unscoped compose action aimed at one container reaches
        # the shared database. Same flag `make recreate` bakes in.
        #
        # --remove-orphans stays on the FULL path only. A commit that touched nothing but
        # versions.env cannot have removed a service, so there are no orphans it could mean.
        #
        # WHAT THE SCOPED PATH GIVES UP: it converges nothing it did not name. If an earlier
        # deploy left a compose change unapplied, a promote landing afterwards rsyncs that
        # compose file to the deploy root and does not apply it, where the old whole-stack
        # `up -d` would have. So a green promote no longer implies the running stack matches
        # main.
        #
        # TWO WAYS an earlier deploy leaves a change unapplied, and the second is the easy
        # one to miss: it FAILED before reaching this step, or it was CANCELLED while still
        # pending. `concurrency` holds at most one pending run per group and a newer run
        # supersedes it — `cancel-in-progress: false` protects the RUNNING deploy, not the
        # queued one. A cancelled run leaves nothing red in the Actions tab, so there is no
        # failure to prompt the re-run below. That is the right trade for a rollback, but
        # it is a trade, and the way to settle it is to re-run THIS workflow from the Actions
        # tab: a workflow_dispatch carries no push range, so it always takes the FULL path.
        #
        # Do NOT reach for check-compose-drift.sh to answer that question. It compares
        # declared vs live MOUNTS and the compose project root and nothing else — not the
        # image, env, ports, networks or command — so an unapplied env or digest change is
        # invisible to it and it prints "No drift" on exactly the thing being asked about.
        #
        # cf-access-guard is the one exception to that caveat, because it is the one place
        # where an unapplied change is invisible to every gate. It is build-only and can
        # never appear in a scope list, so the SCOPED branch compares its source revision
        # explicitly and recreates it when — and only when — it is behind. See there.
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail

          # ── Is cf-access-guard behind? Decided ONCE, above the case. ──────────────────
          #
          # Deliberately not inside a branch. The guard can never appear in a scope list —
          # it is build-only, so no versions.env pin can name it — but whether it is STALE
          # has nothing to do with what this particular deploy is for, and putting the
          # check inside SCOPED left NONE unable to notice. It is the service where a
          # stale binary is least visible: assert-healthy sees a healthy container and
          # check-edge-auth sees the old binary still refusing a spoofed Host, so nothing
          # downstream catches it.
          #
          # Compared on the source revision, not the image ID. BuildKit re-exports the
          # image config on every build, so a full cache hit still yields a new ID and an
          # ID comparison would recreate the container that decides whether requests are
          # authenticated on EVERY deploy. The label recreates it exactly when the source
          # moved, which on an ordinary promote is never.
          #
          # This is what covers the pending-run window. `concurrency` does NOT serialise
          # queued deploys: cancel-in-progress governs the RUNNING run only, and GitHub
          # cancels any previously pending run when a newer one arrives. So a guard change
          # queued behind an in-flight deploy is discarded when the next push lands, and
          # its own FULL deploy never runs at all. This comparison does not care why the
          # guard is behind, only that it is — which is the point of asking the container
          # rather than reasoning about triggers.
          #
          # Ambiguity recreates: no label, no container, or an unresolved revision.
          guard=()
          guard_running="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' cf-access-guard 2>/dev/null || true)"
          if [ -z "${GUARD_REVISION:-}" ] || [ "$guard_running" != "$GUARD_REVISION" ]; then
            echo "cf-access-guard is behind: running '${guard_running:-<no label>}', checkout '${GUARD_REVISION:-<unresolved>}'."
            guard=(cf-access-guard)
          fi

          case "${DEPLOY_SCOPE:-FULL}" in
            NONE)
              # No image reference changed, so nothing is pulled and nothing pinned is
              # recreated — but the guard is not pinned, and a versions.env comment edit
              # is still a deploy that rsynced and rebuilt its source one step earlier.
              echo "versions.env changed but no pin did — nothing to pull."
              if [ ${#guard[@]} -gt 0 ]; then
                echo "Recreating cf-access-guard, which is not pinned and so is not in scope."
                docker compose up -d --no-deps "${guard[@]}"
              else
                echo "Nothing to recreate either."
              fi
              ;;
            SCOPED)
              # An empty array here would make `up -d` mean the WHOLE STACK, which is the
              # footgun `make force-recreate` guards against by refusing an empty svc=.
              # Guard it the same way rather than trusting the step above.
              read -r -a services <<< "${DEPLOY_SERVICES:-}"
              if [ ${#services[@]} -eq 0 ]; then
                echo "Error: scope is SCOPED but names no service. Refusing to run an"
                echo "unscoped compose command that would look like a scoped one."
                exit 1
              fi
              # Two lists, because the guard is BUILT and never pulled: `services` is what
              # moves in the registry, `recreate` is what compose must act on.
              recreate=("${services[@]}" "${guard[@]}")
              echo "Scoped deploy (SERV-109): pull ${services[*]} | recreate ${recreate[*]}"
              docker compose pull "${services[@]}"
              docker compose up -d --no-deps "${recreate[@]}"
              ;;
            *)
              # FULL needs no guard handling, and NOT because of the BuildKit re-export
              # quirk — do not tie this branch's correctness to that, or a future
              # reproducible-build fix will look like it broke this. Enumerate instead: if
              # the source moved the image differs on any builder; if a hand-build stamped
              # the label `unknown` the image config differs; if there is no container
              # `up -d` creates one. Every way the guard can be behind is a way compose
              # already recreates it here.
              #
              # The re-export quirk only means FULL ALSO recreates it when nothing changed,
              # every single time. That is waste, pre-existing and tracked separately — it
              # is not what makes this branch correct.
              docker compose pull && docker compose up -d --remove-orphans
              ;;
          esac

      - name: Ensure databases exist
        # Idempotent — creates any missing users/databases without affecting existing ones
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: sleep 5 && docker compose exec -T -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres postgres bash < ./db/init-db.sh

      - name: Assert nothing is unhealthy
        id: healthy
        # Until now a deploy reported success as soon as `up -d` returned, which says
        # only that compose started containers — not that any of them work. Docker
        # computes health and then acts on none of it (`restart: unless-stopped` restarts
        # exited containers, not unhealthy ones), so on 2026-08-15 switchyard sat at a
        # failing streak of 12 while the deploy that broke it stayed green (SERV-102).
        # This is what that signal now reaches.
        #
        # Runs after the init-db step deliberately: several services crash-loop until
        # their database exists, so asserting before it would fail every cold deploy.
        #
        # This detects, it does not recover — `up -d` has already happened by the time
        # this runs, so a failure here means "the stack is broken, go look", not "the
        # deploy was prevented". Wiring the same script to an automatic rollback is
        # SERV-79; keeping it exit-code-clean is what lets that reuse it unchanged.
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: ./scripts/assert-healthy.sh --timeout 300

      - name: Assert the origin still rejects a spoofed Host
        id: edge-auth
        # SERV-106. The config half of this runs against files and would pass in a
        # checkout; the point of running it HERE is the live half, which asks the
        # deployed edge the one question that matters — does a request with no valid
        # Cloudflare Access assertion get served? A middleware that is present in
        # routers.yml but not in effect (guard down, guard in audit mode, guard
        # holding no signing keys, address Traefik cannot reach) reads as correct
        # everywhere except here.
        #
        # Runs after assert-healthy so a guard that never came up is reported as the
        # unhealthy container it is, rather than as a mysterious 500 in a probe.
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: ./scripts/check-edge-auth.sh

      # ── Report this deploy to the Switchyard delivery ledger (SERV-117) ─────────
      #
      # The push half of SWY-191's two-producer ledger. The reconciler already
      # observes what is RUNNING; this records how it got there — the gate result,
      # the commit count, the ticket keys, the actor and a link to this run, none of
      # which any observer can derive.
      #
      # THREE RULES, all of them about not lying:
      #
      #   1. Report what was ACTUALLY deployed. An `image-updated` dispatch carrying
      #      4.14.0 still deploys whatever `versions.env` pins, which may be 4.13 —
      #      and the container behind that pin is running 4.13.1. The version comes
      #      off the running image's `org.opencontainers.image.version` label, which
      #      agrees with /healthz character for character; the pin does not.
      #
      #   2. Attach the release enrichment ONLY when the dispatched version is the
      #      one that went live. A commit count belonging to a release still sitting
      #      behind the pin is worse than no commit count.
      #
      #   3. Never fail the deploy. The ledger observes deploys; it does not gate
      #      them. Every step here is `continue-on-error` or soft-failing, and the
      #      action itself warns rather than exits on an unreachable Switchyard.
      #
      # `if: always()` because a FAILED deploy is the one most worth recording — the
      # matrix has no way to show it otherwise, and 2026-08-15's silent breakage
      # (SERV-102) is exactly what a `failed` row is for.
      - name: Resolve what was deployed
        id: reportable
        if: always()
        continue-on-error: true
        env:
          SWITCHYARD_URL: http://localhost:4002
          SWITCHYARD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          DISPATCH_IMAGE: ${{ github.event.client_payload.image }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -uo pipefail

          if [ -z "${SWITCHYARD_TOKEN:-}" ]; then
            echo "::warning::SWITCHYARD_DEPLOY_TOKEN is not set — this deploy will not reach the ledger."
            exit 0
          fi

          # STATUS IS DECIDED AND WRITTEN FIRST, before any early exit below.
          #
          # Every assertion in the deploy counts. A stack that came up broken did not
          # succeed, and neither did one that left the origin serving unauthenticated
          # requests (SERV-106) — a deploy that goes red in the Actions tab must not go
          # green in the ledger.
          status=succeeded
          if [ "${{ steps.deploy.outcome }}" != "success" ] \
            || [ "${{ steps.healthy.outcome }}" != "success" ] \
            || [ "${{ steps.edge-auth.outcome }}" != "success" ]; then
            status=failed
          elif [ "${DELIVERY_KIND:-}" = "rollback" ]; then
            # A successful rollback is not a plain success. The matrix renders a
            # rolled-back production row with its own alert, which is the whole
            # point: prod is running deliberately-older code and the page should
            # say so rather than showing a calm green row at an unexpected version.
            status=rolled_back
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          # THE MOVEMENT FILTER APPLIES TO SUCCESSES ONLY.
          #
          # `--since` keeps only what this run recreated, which is the right flood
          # guard for a no-op success: the FULL path fires on a push to `config/**`
          # or `scripts/**`, and reports are deliberately not deduplicated the way
          # observations are.
          #
          # A FAILED deploy is not a no-op anyone wants hidden, and it is the one row
          # with no substitute — the reconciler cannot observe a deploy that did not
          # happen. It is also the case where "what moved" is least answerable: the
          # run may have died before `up -d` ran at all. So on failure the filter is
          # dropped and every tracked service is reported failed. Filter 2 in
          # delivery-reportable.sh still bounds that to services the ledger knows.
          #
          # SERV-102 is the worked example, and it is why this is not theoretical:
          # postgres' digest moved and switchyard's did not, and switchyard was the
          # thing that broke.
          # A NONE scope pulled nothing and recreated nothing pinned, so on a SUCCESS
          # there is no deploy to report and a row would be a row per no-op commit.
          #
          # Checked HERE, below the status write, not above it. NONE is not an idle
          # job: its Deploy Stack branch still recreates cf-access-guard when the
          # guard is behind, and `assert-healthy` and `check-edge-auth` both run
          # unconditionally afterwards. A comment-only edit to versions.env while the
          # stack is unhealthy is a red job, and exiting above the status write would
          # leave the ledger silent about it.
          if [ "${DEPLOY_SCOPE:-FULL}" = "NONE" ] && [ "$status" = "succeeded" ]; then
            echo "scope is NONE and the deploy succeeded — nothing was deployed, nothing to report."
            exit 0
          fi

          if [ "$status" = "failed" ]; then
            echo "Deploy failed — reporting every tracked service, not just what moved."
            lines="$(./scripts/delivery-reportable.sh 2>&1 >/tmp/reportable.txt || true)"
          else
            lines="$(./scripts/delivery-reportable.sh --since "/tmp/delivery-before-${{ github.run_id }}.txt" 2>&1 >/tmp/reportable.txt || true)"
          fi
          printf '%s\n' "$lines"
          reportable="$(cat /tmp/reportable.txt 2>/dev/null || true)"

          if [ -z "$reportable" ]; then
            echo "Nothing to report — no tracked service moved, or the ledger is unreachable."
            exit 0
          fi

          # Did the release that triggered this actually go live? Only then does its
          # commit count, ticket list and gate result describe what is running.
          enriched=""
          if [ -n "${DISPATCH_IMAGE:-}" ] && [ -n "${DISPATCH_VERSION:-}" ]; then
            # NO unfiltered fallback here, and the asymmetry with deploy-dev.yml is
            # deliberate (SERV-121). Dev needs one because its cron is SILENCED on a
            # successful move, so a race leaves the movement unreported and the
            # enrichment is the only thing that can still write the row.
            #
            # Prod has no silenced path: every deploy.yml run reports what it moved.
            # So a fallback here could only ever fire when another run has ALREADY
            # written a bare row for that version, and it would append a second,
            # enriched one — the duplicate this ticket explicitly rejected, since
            # `deployments` is append-only and SWY-187 renders history from it.
            match="$(printf '%s\n' "$reportable" | grep -x -- "${DISPATCH_IMAGE}=${DISPATCH_VERSION}" || true)"
            if [ -n "$match" ]; then
              enriched="$match"
              echo "dispatch matched what went live: $match"
            else
              echo "dispatch was ${DISPATCH_IMAGE}=${DISPATCH_VERSION}, which is not what is running — reporting without its enrichment."
            fi
          fi

          plain="$reportable"
          if [ -n "$enriched" ]; then
            plain="$(printf '%s\n' "$reportable" | grep -vx -- "$enriched" || true)"
          fi


          {
            echo "enriched=${enriched}"
            echo "plain<<PLAIN_EOF"
            printf '%s\n' "$plain"
            echo "PLAIN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the released service, with its provenance
        if: always() && steps.reportable.outputs.enriched != ''
        continue-on-error: true
        env:
          # Explicit, not the script default: the `reportable` step above spells the
          # same endpoint out, and a port move that edits one and misses these is a
          # ledger gap on a GREEN run, not a red job.
          RD_URL: http://localhost:4002
          RD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          RD_ENVIRONMENT: prod
          RD_SERVICE: ${{ github.event.client_payload.image }}
          RD_VERSION: ${{ github.event.client_payload.version }}
          RD_STATUS: ${{ steps.reportable.outputs.status }}
          RD_SHA: ${{ github.event.client_payload.sha }}
          RD_COMMIT_COUNT: ${{ github.event.client_payload.commit_count }}
          # Guarded: `toJson()` of a MISSING property is the four-character string
          # `null`, not empty — and the filter would take that for a
          # comma-separated list and post `ticket_keys: ["null"]`, a link on the
          # matrix to a ticket that does not exist. Any dispatch carrying
          # image+version without ticket_keys hits it.
          RD_TICKET_KEYS: ${{ github.event.client_payload.ticket_keys && toJson(github.event.client_payload.ticket_keys) || '' }}
          RD_GATE_PASSED: ${{ github.event.client_payload.gate_passed }}
          RD_GATE_TOTAL: ${{ github.event.client_payload.gate_total }}
          RD_GATE_RUN_URL: ${{ github.event.client_payload.gate_run_url }}
          RD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RD_NOTE: ${{ env.DELIVERY_NOTE }}
        run: ./scripts/report-deploy.sh
      - name: Report everything else this deploy recreated
        if: always() && steps.reportable.outputs.plain != ''
        continue-on-error: true
        env:
          # Explicit, not the script default: the `reportable` step above spells the
          # same endpoint out, and a port move that edits one and misses these is a
          # ledger gap on a GREEN run, not a red job.
          RD_URL: http://localhost:4002
          RD_TOKEN: ${{ secrets.SWITCHYARD_DEPLOY_TOKEN }}
          RD_ENVIRONMENT: prod
          RD_SERVICES: ${{ steps.reportable.outputs.plain }}
          RD_STATUS: ${{ steps.reportable.outputs.status }}
          RD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RD_NOTE: ${{ env.DELIVERY_NOTE }}
        run: ./scripts/report-deploy.sh
      - name: Prune Images
        # Clean up old docker images to save disk space
        run: docker image prune -f
