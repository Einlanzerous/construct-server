name: Base Images

# Fail when any first-party service builds FROM a base image that is past end-of-life
# or referenced by a floating tag (SERV-170).
#
# The 2026-09-05 survey found four repos on an Alpine that had been out of support for
# five months, two on a Node that had been for four, Go builders two releases behind,
# and nginx runtimes fifteen months past EOL — none of it visible from anywhere, because
# an EOL base image builds, deploys and reports healthy. The Dockerfiles live in the
# service repos and only change when someone edits them, so a check that ran on their
# CI would run exactly when nobody is looking at the base image. This one runs on a
# CLOCK: every Monday it reads every Dockerfile on every first-party repo's default
# branch, asks endoflife.date whether each cycle is still supported, and goes red if
# not. The next answer to "how many repos are on an EOL base" is this run, not a survey.
#
# ── WHY IT LIVES HERE, ON A SCHEDULE, ON A HOSTED RUNNER ─────────────────────────────
#
# Here, because this repo already derives the list of first-party repos from
# docker-compose.yml (verify-tag.sh, the wiki) and one sweep with one policy is the
# SERV-111 shape — many per-repo checks with their own copies of the rule would drift
# the same way the Dockerfiles did. On a schedule, because a base image goes EOL with
# no commit anywhere. On ubuntu-latest, because it needs only curl, jq and gh, has no
# reason to touch the stack, and should still report when the box is busy or down.
#
# ── WHAT A RED RUN MEANS ─────────────────────────────────────────────────────────────
#
# Read the step summary: one row per FROM line of a PUBLIC repo, with the repo path, the
# cycle, when it ended, and the newest supported cycle; private repos are counts only (the
# log is public). Run `make base-images-check` locally for those. Fix it in the service repo (bump the tag, build,
# release), then re-run this from the Actions tab. A scheduled run that fails emails the
# repo owner; that is the alarm, and it is deliberately not gated on any deploy, since a
# stale base image is a rotation-class problem and not a "stop the deploy" one.
#
# A run that cannot reach endoflife.date fails too (exit 2). "Could not check" must never
# come out green — see the note in scripts/check-base-images.sh.
#
# ── THE PUBLISHED RESULT (SERV-294) ──────────────────────────────────────────────────
#
# Satlink's Practices board reads the sweep's result instead of re-deriving the rule. The
# sweep writes a JSON document (schema in docs/base-images.md) already filtered to PUBLIC
# repos inside the script, so the artifact below and the `estate-results` branch only ever
# hold public data: this repo is public, and an artifact, a log and a data branch are all
# world-readable. The `publish` job force-pushes that one file as a single orphan commit.
# It is the only job with contents: write, never runs for a pull request, and only for a
# ref that is main.
#
# The run log, annotations and step summary are world-readable too, so the sweep runs with
# --redact (SERV-350): a public repo gets a full row, a private one (or one whose privacy
# could not be read) is a count. The sweep still goes red on a private finding; to see which
# repo and line, run `make base-images-check` locally, where nothing is withheld.
#
# A week WITH findings must still publish: the sweep step exits 1, so the upload step and
# the publish job both run on `!cancelled()` and not on the default success(). A red sweep
# means findings; a red publish job means the file is stale.

on:
  schedule:
    # Mondays 07:00 UTC — after the weekend's upstream releases, before the week's work.
    - cron: '0 7 * * 1'
  pull_request:
    paths:
      - 'scripts/check-base-images.sh'
      - 'scripts/base-images-sweep.sh'
      - 'scripts/publish-base-images.sh'
      - 'scripts/test/**'
      - 'Makefile'
      - '.github/workflows/base-images.yml'
  push:
    branches: ["main"]
    paths:
      - 'scripts/check-base-images.sh'
      - 'scripts/base-images-sweep.sh'
      - 'scripts/publish-base-images.sh'
      - 'scripts/test/**'
      - 'Makefile'
      - '.github/workflows/base-images.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sweep.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # A guard that fails closed is only worth having if it is known to fail at all,
      # and the fixture run is the only way to see that without an EOL image in the
      # estate. It runs first so a broken script reads as "the script is broken" and
      # not as "the estate is clean". `make base-images-test` runs the script's self-test
      # and the publish and sweep scripts' test, so CI covers both.
      - name: Prove the check can fail
        run: make base-images-test

      # Two tokens, same split as wiki.yml. GITHUB_TOKEN reads the public repos, which
      # is most of them. WIKI_DOCS_TOKEN reads the private ones (amber, switchyard);
      # without it those two are reported as UNREADABLE and the run fails, because a
      # sweep that silently skipped repos would be green on an estate it only half
      # examined. The script prefers GH_TOKEN, so the private-capable one goes there.
      #
      # PRIVACY_GH_TOKEN is the OTHER token, on purpose: GITHUB_TOKEN cannot read private
      # repos, so a 404 from it means private and a 200 `private: false` proves a repo is
      # world-readable. WIKI_DOCS_TOKEN would answer 200 for a private repo and prove
      # nothing. The wrapper is a script so its exit handling can fail in a test: it
      # re-raises the exit code (a red sweep means findings) and sets `published` whenever
      # a document exists, exit 0 or 1.
      - name: Sweep every first-party Dockerfile
        id: sweep
        env:
          GH_TOKEN: ${{ secrets.WIKI_DOCS_TOKEN || secrets.GITHUB_TOKEN }}
          PRIVACY_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/base-images-sweep.sh

      # `!cancelled()`, not the default success(), or a sweep that exits 1 (findings) would
      # skip this and the file would go stale in exactly the weeks with findings. The
      # event and ref gate keeps a pull request's own copy of the script, which holds
      # WIKI_DOCS_TOKEN, from ever uploading anything.
      - name: Upload the public-only document
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sweep.outputs.published == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: base-images-json
          path: ${{ runner.temp }}/out/base-images.json
          retention-days: 1
          if-no-files-found: error

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## A first-party service builds from an unsupported or floating base image"
            echo
            echo "Each row above names the repo, file and line. The fix lives in that repo:"
            echo "bump the tag to the newest supported cycle the row names, build, and release."
            echo "Then re-run this workflow from the Actions tab."
            echo
            echo "This log is public, so a private repo (or one whose privacy could not be read)"
            echo "shows only as a count of withheld repos, findings and warnings. For the repo,"
            echo "file and line, run \`make base-images-check\` on the box or a checkout with"
            echo "a token that can read the private repos."
            echo
            echo "An \`UNMAPPED\` row means the image's product is not in \`PRODUCT_MAP\` in"
            echo "\`scripts/check-base-images.sh\` — add the mapping rather than an exemption."
            echo "An \`UNRESOLVED\` row on a whole repo means the token could not read it."
            echo
            echo "Locally: \`make base-images-check\` (this sweep) or"
            echo "\`make base-images-check dir=~/projects\` (your checkouts)."
            echo "Design of record: \`docs/base-images.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job that can write, and only the one ref. A cancelled run publishes nothing
  # (`!cancelled()`, not always()), and a queued run waits for the one before it rather
  # than cancelling it; the script also refuses a document older than the branch's, since
  # GitHub keeps only the newest pending run per group.
  publish:
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.outputs.published == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: base-images-publish
      cancel-in-progress: false
    steps:
      # The checkout is only for the scripts: no credential is persisted, and the push
      # credential comes solely from PUBLISH_GH_TOKEN, handed to git through its environment.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the public-only document
        uses: actions/download-artifact@v4
        with:
          name: base-images-json
          path: ${{ runner.temp }}/in

      - name: Publish to estate-results
        env:
          PUBLISH_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-base-images.sh "$RUNNER_TEMP/in/base-images.json"
