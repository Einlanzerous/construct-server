name: Build the estate wiki

# SERV-101. Deliberately a SEPARATE workflow from deploy.yml, for two reasons that
# both came out of review on #108.
#
# 1. Documentation must not be on the critical path of shipping the stack. Built
#    inside deploy.yml, this ran before `docker compose up -d` with no
#    continue-on-error, so an npm registry outage, a `docker pull` failure, or a
#    Vue-hostile character landing in an unrelated repo's README could abort a
#    deploy — after the rsync step had already put new config on the box, leaving
#    it holding new files with old containers. That is the exact opposite of the
#    degrade-don't-fail behaviour the fetch step was written for.
#
# 2. The wiki's sources include README.md, CLAUDE.md and docs/**. Adding those to
#    deploy.yml's `paths:` meant a docs-only edit ran `docker compose pull` — and
#    under major.minor pins, a pull is precisely where a new patch release enters.
#    So editing a README could roll a first-party service to a version nobody chose
#    to ship at that moment. That unattended-change property is what SERV-75 took
#    away from watchtower; it should not come back through the docs.
#
# The split lets each trigger set be honest: deploy.yml changes what runs, this
# changes what the wiki says about it. The `wiki` container is long-lived and the
# site is a bind-mounted directory, so publishing here needs no compose action at
# all.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'wiki/**'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'versions.env'
      - 'CLAUDE.md'
      - 'PRINCIPLES.md'
      - 'README.md'
      - '.github/workflows/wiki.yml'

# A second push while a build is running makes the first one's output stale before
# it lands. Cancel it rather than racing two rsyncs at the same directory.
concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiki:
    runs-on: self-hosted
    env:
      DEPLOY_ROOT: /opt/construct-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify deploy root exists
        run: |
          if [ ! -d "$DEPLOY_ROOT" ]; then
            echo "Error: deploy root $DEPLOY_ROOT does not exist."
            echo "Bootstrap the host first: ansible-playbook ansible/site.yml"
            exit 1
          fi

      - name: Build the site
        # Built inside a container rather than on the runner. node IS on the bare
        # system PATH here (/usr/bin/node), so this would work today — but the
        # runner is a systemd service with no login shell, which is exactly the trap
        # SERV-62 hit twice, and pinning the toolchain in an image means a host node
        # upgrade cannot quietly change what gets built. The runner needs only docker.
        #
        # `node:22`, not `node:22-alpine`: the architecture maps (SERV-159) verify
        # their source evidence with git in both the fetch and the generate step, and
        # the Debian image carries git in its base where alpine does not. See the
        # note in the Makefile for why `apk add git` is not the cheaper option it
        # looks like — and for why this is not a git PIN, since `node:22` moves.
        #
        # Two tokens, because they solve different halves of the problem, and the
        # first run after merge proved the rate limit is the bigger half.
        #
        # GITHUB_TOKEN is free and always present. Unauthenticated API calls are
        # capped at 60/hour per IP, and this fetch makes one request per repo per
        # ingested file — every estate repo × CLAUDE.md, README.md, PRINCIPLES.md,
        # REVIEW.md and docs/architecture.archify.json, which is comfortably over
        # that cap — so on a shared runner IP it reliably 403s partway through and
        # most repo pages come out empty. Authenticating lifts it to 1,000/hour, and
        # most of the estate's repos are public, so this alone covers nearly all of
        # them.
        #
        # WIKI_DOCS_TOKEN is still what reads the PRIVATE ones (amber, switchyard).
        # It stays optional: fetch.ts prefers it, falls back to GITHUB_TOKEN, and
        # degrades to a warning if neither can read a repo.
        env:
          WIKI_DOCS_TOKEN: ${{ secrets.WIKI_DOCS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WIKI_DOCS_TOKEN:-}" ]; then
            echo "WIKI_DOCS_TOKEN not set — falling back to GITHUB_TOKEN."
            echo "Public repos will be read; private ones (amber, switchyard) will be skipped."
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e WIKI_BUILD_REF="${GITHUB_SHA:0:7}" \
            -e WIKI_DOCS_TOKEN \
            -e GITHUB_TOKEN \
            -v "$PWD:/repo" -w /repo/wiki \
            node:22 \
            sh -c 'npm ci --no-audit --no-fund && npm run fetch && npm run build'

      - name: Publish to the deploy root
        # The built bundle is content, not an image, so a docs change updates the
        # site with no container recreate at all. --delete so a page for a removed
        # service does not linger: the deployed site is exactly what this commit
        # generates, never an accumulation.
        #
        # mkdir before rsync matters on a host where the wiki container started
        # before this workflow ever ran — see the ownership note in
        # ansible/roles/server/tasks/main.yml.
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_ROOT/wiki/site"
          rsync -a --delete ./wiki/docs/.vitepress/dist/ "$DEPLOY_ROOT/wiki/site/"
