name: Deploy Signet

# Auto-deploy the Signet daemon on release (SERV-62). Signet's own release
# workflow attaches the linux-amd64 binary + .sha256 to the GitHub Release, then
# fires a `signet-released` repository_dispatch here with the tag in the payload
# (SGNT-12).
#
# The job runs on the self-hosted runner because the daemon lives on that host,
# and sits behind a required reviewer so the credential daemon is never bounced
# unreviewed.
#
# The environment is `signet-prod`, not the existing `home-server`, for two
# reasons. `home-server` is shared with deploy.yml, so a reviewer rule there
# would also gate every docker stack deploy — a much bigger behavioural change
# than this ticket intends. And IDEA-19 models delivery as environment × service
# with GitHub Environments as the gate, so naming by service and environment
# lets a future `signet-dev` sit beside this one instead of forcing a rename.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signet release tag to deploy, e.g. v1.2.0"
        required: true
        type: string
  repository_dispatch:
    types: [signet-released]

# The job token is handed to a subprocess (gh, via ansible); it only ever needs
# to read releases.
permissions:
  contents: read

concurrency:
  # Never let two deploys race for the same binary and unit.
  group: deploy-signet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: signet-prod
    # cancel-in-progress is false, so a hung run would hold the concurrency
    # group indefinitely without this.
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$DISPATCH_TAG}"
          if [ -z "$TAG" ]; then
            echo "No tag supplied by either trigger." >&2
            exit 1
          fi
          # Refuse anything that is not a plain version tag: this value reaches
          # a shell command, and repository_dispatch payloads are attacker-
          # controlled by anyone who can call the API with a repo token.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing malformed tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying Signet $TAG"

      # The runner is a systemd service, so it never sources the user's shell
      # profile and pip's user-install bin dir is off PATH — which is where
      # ansible lives. deploy.yml never hit this because docker is on the system
      # PATH; this is the first workflow here to shell out to a user-installed
      # tool. GITHUB_PATH applies to subsequent steps, not this one.
      - name: Put user-installed tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail here with a clear reason rather than as `command not found` from
      # inside the deploy step.
      - name: Check ansible is available
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            echo "ansible-playbook not on PATH: $PATH" >&2
            echo "Install it for the runner user, e.g. pip install --user ansible" >&2
            exit 1
          fi
          ansible-playbook --version | head -1

      # ansible/inventory.ini is gitignored, and checkout runs `git clean -ffdx`,
      # so the repo copy is never present here. Ansible treats a missing
      # inventory as "no hosts matched" and exits 0 — the deploy would go green
      # having done nothing, skipping the very version check that exists to
      # catch a stale daemon. Write our own instead, outside the workspace so
      # the next checkout cannot remove it. The runner *is* the target host.
      - name: Write a local inventory
        run: |
          printf '[server]\nlocalhost ansible_connection=local\n' \
            > "$RUNNER_TEMP/signet-inventory.ini"
          cat "$RUNNER_TEMP/signet-inventory.ini"

      # Downloads the release asset, verifies its sha256, installs it atomically,
      # restarts the unit through the scoped sudo rule, and confirms /healthz
      # reports the new version. Idempotent: a host already on the target
      # version is left alone. Only builtin modules are used, so no collections
      # are installed.
      - name: Deploy the release
        env:
          # `gh release download` needs a token; the default job token can read
          # releases from the signet repo when it is public, and SIGNET_RELEASE_TOKEN
          # overrides it for the private case.
          GH_TOKEN: ${{ secrets.SIGNET_RELEASE_TOKEN || github.token }}
          SIGNET_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          ansible-playbook ansible/ops/update-signet.yml \
            -i "$RUNNER_TEMP/signet-inventory.ini" \
            -e "signet_version=$SIGNET_VERSION"

      # Reached only when the playbook succeeded, which means its version-aware
      # health check already passed. Reported from the same source rather than
      # re-probing, so the summary cannot claim more than was verified.
      - name: Report the deployed version
        env:
          SIGNET_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          echo "### Signet $SIGNET_VERSION deployed and verified serving" >> "$GITHUB_STEP_SUMMARY"
