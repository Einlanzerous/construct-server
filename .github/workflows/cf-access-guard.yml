name: cf-access-guard tests

# The guard decides whether requests to every tunneled app are authenticated
# (SERV-106). The bypass table it used to own — alg=none, HS256 algorithm
# confusion, cross-application audience, expired, no exp at all, tampered payload,
# unknown kid — now lives in pkg/cfaccess as shared vectors that Switchyard's
# TypeScript suite runs too (SERV-131), and this job runs BOTH modules. Until this
# workflow existed, nothing ran any of it: the tests could rot silently and the
# first symptom would have been at the edge.
#
# Runs through the service's own Dockerfile (`--target test`) rather than with
# `setup-go`, so there is exactly ONE toolchain pin in the repo. CI cannot end up on
# a different compiler than the one that builds the deployed binary — which for an
# auth gate is worth more than the seconds a native runner would save. Nothing
# downstream depends on that stage, so ordinary builds and deploys skip it.

on:
  push:
    paths:
      - 'services/cf-access-guard/**'
      # The guard is built from the shared verifier, so a module-only change is a
      # change to this binary. Omitting it would let pkg/cfaccess merge untested by
      # the job that actually compiles it into something deployed.
      - 'pkg/cfaccess/**'
      - '.github/workflows/cf-access-guard.yml'
  pull_request:
    paths:
      - 'services/cf-access-guard/**'
      - 'pkg/cfaccess/**'
      - '.github/workflows/cf-access-guard.yml'

jobs:
  test:
    # GitHub-hosted, matching ansible-lint.yml. Deliberately NOT the self-hosted
    # runner: this needs no access to the box, and the runner is a systemd service
    # with a bare system PATH that cannot see the host's Go anyway (it lives under
    # $HOME) — the CLAUDE.md invariant that bit SERV-62 twice.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: gofmt, go vet, go test
        # The build fails on the first check that fails, and names which. The test
        # stage runs the guard's suite AND pkg/cfaccess's, including the shared
        # vectors — see the Dockerfile.
        #
        # --build-context: the guard imports pkg/cfaccess through a path replace, and
        # a named context is how that reaches the build without making the repo root
        # (and, on the box, the deploy root's rendered .env) a docker build context.
        run: |
          docker build \
            --build-context cfaccess=./pkg/cfaccess \
            --target test \
            -f services/cf-access-guard/Dockerfile \
            services/cf-access-guard
