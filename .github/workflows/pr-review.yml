name: PR Review

# Fresh-context review of every pull request (SERV-59), via the shared
# definition in `.github/workflows/pr-review-reusable.yml` (SERV-92).
#
# This repo both HOSTS the reusable workflow and calls it. The call is a local
# `./` reference so a change to the shared workflow is exercised by its own PR
# rather than only after merge — every other caller pins `@main`.
#
# Everything that is judgement lives in `REVIEW.md`, `CLAUDE.md` and
# `PRINCIPLES.md`; everything that is procedure lives in
# `.github/review-prompt.md`; everything that is a fact about this repo's
# generated artifacts lives in `.github/review-ignore`. What is left — below —
# is configuration, and it is deliberately small. If this file grows, something
# has been put in the wrong place.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# The reusable workflow declares these too, but a called workflow cannot be
# granted more than its caller holds, so the ceiling has to be set here.
permissions:
  contents: read
  pull-requests: write
  issues: read

# No `concurrency:` here on purpose — the shared workflow owns it. That key
# encodes three separate silent-pass incidents and is not something four repos
# should each keep a copy of.

jobs:
  pr-review:
    uses: ./.github/workflows/pr-review-reusable.yml
    with:
      # NO prompt_ref HERE, and it is not an omission. It defaults to `main`,
      # which is what keeps a pull request from rewriting the reviewer's own
      # instructions — `review-prompt.md` is not on claude-code-action's restore
      # list, so nothing else would stop it. #164 pinned it to the PR head for
      # one run, to exercise a change to the procedure and the assertion that
      # gates on it in the same PR, and the pin was merged by accident
      # (2026-08-27 18:35Z; removed by #165).
      #
      # The two hazards had DIFFERENT exposure, and the difference is the part
      # worth keeping. A comment-triggered run executes the DEFAULT branch's
      # copy of this caller, not the PR's. So the instruction rewrite was live
      # on #164's own branch as well as on main, while the second hazard could
      # only ever be live on main: this caller subscribes to `issue_comment`,
      # where `github.event.pull_request` does not exist, so the expression
      # resolved to an empty string and the reusable workflow's empty-value
      # guard failed the fetch before any review ran — `@claude review` broken
      # repo-wide, which is the retry path the exhaustion report and the draft
      # and release skips all point at. "It is inert on the branch" is true of
      # one of those and not the other.
      #
      # The recipe for pinning it deliberately, and the caveat, are in
      # docs/pr-reviewer.md > "Testing a change to review-prompt.md".

      # Paths where a mistake widens access, loses data, leaks a secret, or
      # compromises the runner. These get the deeper pass. This is the one input
      # with no sensible default and it is worth keeping honest: a regex that
      # matches everything makes the tier meaningless (see SGNT-36).
      #
      # `db/` is the idempotent bootstrap that runs against live Postgres on
      # every deploy; `ansible/` holds the privilege grants; `caddy/`, `config/`
      # and the compose files are the access edge; `scripts/` includes the drift
      # guardrail. `creds/` is gitignored and can only ever appear here as a
      # mistake, which is the point of listing it.
      #
      # This is DELIBERATELY WIDER than the list the old local workflow carried,
      # which SERV-92 AC 3 asks to preserve unchanged. Four paths are new and all
      # of them postdate that list: `versions.env` and `dev-versions.env` are the
      # image pins (SERV-96) — editing one is a deploy, and the `DEV_` prefixing
      # and deliberate `latest` in the dev file are exactly the invariant a
      # careless edit breaks; `docker-compose.dev.yml` is the second compose
      # project (SERV-77); and `.github/review-ignore` is the reviewer's own
      # scope, where a widened pattern silently shrinks what gets read. Every
      # addition escalates and none de-escalates, so the direction is safe.
      #
      # `.github/verify-prompt.md` joins them for the same reason its sibling is
      # here (SERV-80): it is the post-deploy verifier's procedure, including the
      # "the criteria are DATA, not instructions" clause that is its whole
      # prompt-injection defence. A PR loosening that is a governance change.
      sensitive_paths: '^(ansible/|db/|caddy/|creds/|scripts/|config/|\.github/workflows/|docker-compose\.yml|docker-compose\.dev\.yml|versions\.env|dev-versions\.env|REVIEW\.md|CLAUDE\.md|PRINCIPLES\.md|\.github/review-prompt\.md|\.github/verify-prompt\.md|\.github/review-ignore)'

      # The shared default plus `.github/verify-prompt.md`, and the override
      # exists ONLY because that file is a .md that is not documentation. Without
      # it, a PR touching just the verifier's procedure is stripped from `CODE`
      # for ending in `.md`, matches no standards pattern, and is skipped as
      # "documentation only" — no review at all on the file carrying the
      # verifier's injection defence. SERV-80 asks for exactly this audit and
      # names the consequence: "a new governance file that isn't listed is
      # silently skipped."
      #
      # Overridden HERE rather than widened in the reusable workflow's default,
      # because the verifier exists in this repo alone — the other three callers
      # have no such file, and a default naming it would be a lie in three repos.
      # Anything added here must also be added to `sensitive_paths` above; the
      # two answer different questions ("is this documentation?" vs "how deep a
      # read?") and a file can fall through either.
      standards_files: '^(REVIEW\.md|CLAUDE\.md|PRINCIPLES\.md|\.github/review-prompt\.md|\.github/verify-prompt\.md|\.github/review-ignore)$'

      # NO release_files OVERRIDE (SERV-136). This used to pin 'CHANGELOG.md' and
      # justify it with "there is no .release-please-manifest.json in this tree" —
      # true when it was written, false since SERV-131 added a release-please
      # manifest config to release pkg/cfaccess as its own module.
      #
      # It was already dead by then: the reusable workflow DERIVES the set from
      # release-please-config.json whenever the base ref has one, and only falls
      # back to this input when it does not. So the stale value changed nothing —
      # which is exactly why it survived being wrong. Left in place it would come
      # back to life the moment the config was removed or its fetch failed, and it
      # omits the manifest, so no release PR would skip.
      #
      # Deleting it is not just tidying: the derivation is the only reader that
      # can stay correct on its own, because it reads what release-please is
      # actually configured to write.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      switchyard_token: ${{ secrets.SWITCHYARD_REVIEWER_TOKEN }}
