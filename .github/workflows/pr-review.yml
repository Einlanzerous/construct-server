name: PR Review

# Fresh-context review of every pull request (SERV-59), via the shared
# definition in `.github/workflows/pr-review-reusable.yml` (SERV-92).
#
# This repo both HOSTS the reusable workflow and calls it. The call is a local
# `./` reference so a change to the shared workflow is exercised by its own PR
# rather than only after merge — the other three repos pin `@main`.
#
# Everything that is judgement lives in `REVIEW.md`, `CLAUDE.md` and
# `PRINCIPLES.md`; everything that is procedure lives in
# `.github/review-prompt.md`; everything that is a fact about this repo's
# generated artifacts lives in `.github/review-ignore`. What is left — below —
# is configuration, and it is deliberately small. If this file grows, something
# has been put in the wrong place.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# The reusable workflow declares these too, but a called workflow cannot be
# granted more than its caller holds, so the ceiling has to be set here.
permissions:
  contents: read
  pull-requests: write
  issues: read

# No `concurrency:` here on purpose — the shared workflow owns it. That key
# encodes three separate silent-pass incidents and is not something four repos
# should each keep a copy of.

jobs:
  pr-review:
    uses: ./.github/workflows/pr-review-reusable.yml
    with:
      # Paths where a mistake widens access, loses data, leaks a secret, or
      # compromises the runner. These get the deeper pass. This is the one input
      # with no sensible default and it is worth keeping honest: a regex that
      # matches everything makes the tier meaningless (see SGNT-36).
      #
      # `db/` is the idempotent bootstrap that runs against live Postgres on
      # every deploy; `ansible/` holds the privilege grants; `caddy/`, `config/`
      # and `docker-compose.yml` are the access edge; `scripts/` includes the
      # drift guardrail. `creds/` is gitignored and can only ever appear here as
      # a mistake, which is the point of listing it.
      sensitive_paths: '^(ansible/|db/|caddy/|creds/|scripts/|config/|\.github/workflows/|docker-compose\.yml|docker-compose\.dev\.yml|versions\.env|REVIEW\.md|CLAUDE\.md|PRINCIPLES\.md|\.github/review-prompt\.md|\.github/review-ignore)'
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      switchyard_token: ${{ secrets.SWITCHYARD_REVIEWER_TOKEN }}
