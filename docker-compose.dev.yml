# Dev environment — the second compose project (SERV-77).
#
# Project name `construct-server-dev`, its own network, its own Postgres. Run it
# with the Makefile's dev-* targets, never with a bare `docker compose` — the
# targets pin the project name, the env file and the deploy root, and getting any
# of the three wrong is how dev and prod get confused for each other.
#
# WHY THIS FILE IS EXPLICIT RATHER THAN `extends:` FROM docker-compose.yml
# `extends` looked right — dev would track prod automatically — but it merges the
# wrong keys. Verified against compose v5.0.0: `networks` is a UNION, not a
# replacement, and `depends_on` is inherited too. A dev service extending prod's
# would therefore drag in `construct_net` and a dependency on the prod `postgres`,
# which is exactly the isolation this ticket exists to create. Defining dev
# explicitly is the cost of keeping dev off the prod network.
#
# The obvious downside is drift: a key added to a prod service is not added here.
# `scripts/check-dev-parity.sh` (make dev-parity) reports env keys that prod has
# and dev does not, so the drift is detectable rather than silent.
#
# WHAT IS DELIBERATELY *NOT* IN DEV
#   - Signet     — no SIGNET_API_TOKEN, so the connector self-disables. Dev must
#                  not hold a handle on the credential vault.
#   - CF Access  — no CF_ACCESS_* , so SSO stays off and login falls back to token
#                  paste. Dev is reached through Access at the edge, not by
#                  trusting an Access JWT internally.
#   - GitHub     — no webhook secret, no poller PAT. Dev must never act on, or
#                  write back to, real tickets and PRs.

name: construct-server-dev

services:
  # --- DEV DATABASE ---
  # Deliberately a separate server rather than extra databases inside the shared
  # prod Postgres. SERV-77 asks for "a dev migration running against a prod
  # database" to be structurally impossible: separate roles in one server enforce
  # that with grants, a separate server enforces it with topology — there is no
  # route and no credential from here to prod's data.
  #
  # It also keeps dev deploys away from the shared Postgres, whose recreation
  # bounces every database-backed service on the box (SERV-63).
  #
  # Pinned by digest to the SAME image prod runs (SERV-102, SERV-105). Under the old
  # floating `16-alpine` this container was recreated whenever upstream published and a
  # `docker compose pull` happened to run — and a postgres recreate moves its address on
  # the network, which Node/Bun's `pg-pool` caches and retries forever. That is precisely
  # what killed prod switchyard on 2026-08-15, and `switchyard-dev` is the same runtime,
  # so dev inherits the failure mode exactly. Dev pulls on every deploy, which is far more
  # often than prod did.
  #
  # Matching prod's digest is also the point of dev: a dev postgres one minor version ahead
  # of prod's is a rehearsal of something that is not going to ship. Bump both together.
  postgres-dev:
    image: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    container_name: postgres-dev
    restart: unless-stopped
    # Loopback only. Dev's database is reachable from this host for a psql shell
    # and from nowhere else; it is not on construct_net, so no prod container can
    # route to it either.
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-55432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # db/init-db.sh runs *inside* this container and reads each role's password
      # from its environment, so every dev service's password has to be here too —
      # mirroring what the prod postgres does. Without them the script hits its
      # empty-password guard and skips the role rather than blanking it, which is
      # the right behaviour but leaves the service unable to connect.
      #
      # Only the four dev services are listed. The prod-only roles the shared
      # script also tries to create (cook_book, centrifuge, authentik, interlock,
      # amber) have no password here and are skipped loudly — correct, since they
      # are not part of the dev slice.
      - SWITCHYARD_DB_PASSWORD=${SWITCHYARD_DB_PASSWORD}
      - ARGOSY_DB_PASSWORD=${ARGOSY_DB_PASSWORD}
      - LYCEUM_DB_PASSWORD=${LYCEUM_DB_PASSWORD}
      - PURSER_DB_PASSWORD=${PURSER_DB_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - construct_dev_net

  # --- SWITCHYARD (dev) ---
  switchyard-dev:
    # Dev tracks HEAD on purpose (IDEA-19 step 2), which is the one place a
    # floating tag is correct — the point of dev is to run what just merged. The
    # SERV-88 pinning guard runs only against the prod deploy root, so this does
    # not trip it.
    #
    # The variable is not a change of heart about that (SERV-97). `dev-versions.env` sets
    # every one of these to `latest`, so the default state is unchanged; what the indirection
    # buys is a reviewable place to hold dev on an older version for an afternoon, and a
    # vocabulary distinct from prod's `SWITCHYARD_TAG` so a misplaced prod `.env` cannot
    # quietly pin dev to prod's versions. See that file's header.
    image: ghcr.io/einlanzerous/switchyard/backend:${DEV_SWITCHYARD_TAG:-latest}
    container_name: switchyard-dev
    restart: unless-stopped
    environment:
      - PORT=4002
      - DATABASE_URL=postgres://switchyard_user:${SWITCHYARD_DB_PASSWORD}@postgres-dev:5432/switchyard?sslmode=disable
      # Same variable purser-dev uses for its link to this service, deliberately:
      # two vars for one URL means pointing dev at a tunnel hostname later updates
      # one of them and leaves this service still advertising loopback in its own
      # links. One var, one answer.
      - PUBLIC_URL=${DEV_SWITCHYARD_PUBLIC_URL:-http://localhost:14002}
      - UPLOAD_DIR=/data/uploads
      - BOOTSTRAP_TOKEN=${SWITCHYARD_BOOTSTRAP_TOKEN}
      - EXTERNAL_REF_KEY_PREFIX=*
      # No GITHUB_TOKEN / GITHUB_WEBHOOK_SECRET: the poller logs "polling
      # disabled" and the webhook receiver 503s, which is what dev should do.
      # A dev Switchyard that closes real tickets on PR merge is a bug, not a
      # feature. No SIGNET_API_TOKEN, no CF_ACCESS_*: see the header.
    volumes:
      - switchyard_dev_uploads:/data/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - construct_dev_net

  switchyard-frontend-dev:
    image: ghcr.io/einlanzerous/switchyard/frontend:${DEV_SWITCHYARD_TAG:-latest}
    container_name: switchyard-frontend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_SWITCHYARD_PORT:-14002}:4002"
    environment:
      - PORT=4002
      - BACKEND_URL=http://switchyard-dev:4002
    depends_on:
      - switchyard-dev
    networks:
      - construct_dev_net

  # --- ARGOSY (dev) ---
  argosy-dev:
    image: ghcr.io/einlanzerous/argosy:${DEV_ARGOSY_TAG:-latest}
    container_name: argosy-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_ARGOSY_PORT:-18096}:8096"
    environment:
      - ARGOSY_ADDR=:8096
      - ARGOSY_DATABASE_URL=postgres://argosy_user:${ARGOSY_DB_PASSWORD}@postgres-dev:5432/argosy?sslmode=disable
      - ARGOSY_MEDIA_DIR=/media
      - ARGOSY_ARTWORK_DIR=/artwork
      - ARGOSY_SUBTITLE_DIR=/subtitles
      - ARGOSY_TRANSCODE_DIR=/transcode
      # Scanning is off by default in dev (0 disables the periodic sweep). Two
      # scanners walking the same library on a schedule is wasted IO for no test
      # value; trigger one by hand via POST /api/v1/scan when a change needs it.
      - ARGOSY_SCAN_INTERVAL=${DEV_ARGOSY_SCAN_INTERVAL:-0}
      - ARGOSY_ADMIN_USERNAME=${ARGOSY_ADMIN_USERNAME:-admin}
      - ARGOSY_ADMIN_PASSWORD=${ARGOSY_ADMIN_PASSWORD}
      - ARGOSY_PROVISION_TOKEN=${ARGOSY_PROVISION_TOKEN}
      - ARGOSY_DISABLE_MDNS=1
      - TMDB_API_READ_ACCESS_KEY=${TMDB_API_READ_ACCESS_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - argosy_dev_artwork:/artwork
      - argosy_dev_subtitles:/subtitles
      - argosy_dev_transcode:/transcode
      # Same libraries as prod, READ-ONLY — dev gets realistic metadata to scan
      # without a copy of the media. Read-only is what makes sharing them safe;
      # do not drop :ro to let dev write here.
      - ${ARGOSY_MEDIA_DIR_HOST:-/data/media}:/media:ro
      - /mnt/ssd_storage/media:/media-ssd:ro
    devices:
      - /dev/dri
    group_add:
      - "44"
      - "993"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - construct_dev_net

  # --- LYCEUM (dev) ---
  lyceum-dev:
    image: ghcr.io/einlanzerous/lyceum:${DEV_LYCEUM_TAG:-latest}
    container_name: lyceum-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_LYCEUM_PORT:-14005}:4005"
    environment:
      - LYCEUM_ADDR=:4005
      - LYCEUM_DATABASE_URL=postgres://lyceum_user:${LYCEUM_DB_PASSWORD}@postgres-dev:5432/lyceum?sslmode=disable
      - LYCEUM_DATA_DIR=/data/blobs
      - LYCEUM_AUTH=${DEV_LYCEUM_AUTH:-false}
      # Cover fetch off: it reaches out to Apple Books/iTunes per book, which is
      # outbound traffic a dev instance has no reason to generate.
      #
      # (Folder ingest is also off, but by OMITTING LYCEUM_BOOKS_WATCH_DIR rather
      # than by this line — see EXPECTED_ABSENT in scripts/check-dev-parity.sh.
      # The books mount is shared read-only with prod, and two ingesters racing
      # over the same directory is not a useful thing to test.)
      - LYCEUM_COVER_FETCH=false
    volumes:
      - lyceum_dev_data:/data/blobs
      - ${LYCEUM_BOOKS_DIR_HOST:-/data/media/books}:/books:ro
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - construct_dev_net

  # --- PURSER (dev) ---
  # The reason lyceum and argosy are in this project at all: purser is the service
  # that calls everything else, so its peer URLs are the contract under test
  # (SERV-81). Every one of them points at a dev peer — a dev purser that
  # provisions accounts in prod would be the worst possible outcome of this ticket.
  purser-dev:
    image: ghcr.io/einlanzerous/purser:${DEV_PURSER_TAG:-latest}
    container_name: purser-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_PURSER_PORT:-14006}:4006"
    environment:
      - PURSER_ADDR=:4006
      - PURSER_DATABASE_URL=postgres://purser_user:${PURSER_DB_PASSWORD}@postgres-dev:5432/purser?sslmode=disable
      - PURSER_API_TOKEN=${PURSER_API_TOKEN}
      # BASE_URL is the internal API endpoint purser calls; URL is the
      # user-facing link it puts in invites. Prod sets both and they differ, so
      # dev must too — setting only BASE_URL leaves the public links unset and
      # purser would fall back to whatever its default is. The parity check
      # caught exactly that when this file was first written.
      #
      # The URL values default to the loopback ports because those work today.
      # Once the dev tunnel hostnames exist (see the Cloudflare steps in
      # docs/dev-environment.md), point them at those in DEV_ENV_FILE — one env
      # change per service, no compose edit.
      - PURSER_SWITCHYARD_BASE_URL=http://switchyard-dev:4002
      - PURSER_SWITCHYARD_URL=${DEV_SWITCHYARD_PUBLIC_URL:-http://localhost:14002}
      - PURSER_LYCEUM_BASE_URL=http://lyceum-dev:4005
      - PURSER_LYCEUM_URL=${DEV_LYCEUM_PUBLIC_URL:-http://localhost:14005}
      - PURSER_ARGOSY_BASE_URL=http://argosy-dev:8096
      - PURSER_ARGOSY_URL=${DEV_ARGOSY_PUBLIC_URL:-http://localhost:18096}
      - PURSER_ARGOSY_PROVISION_TOKEN=${ARGOSY_PROVISION_TOKEN}
      - PURSER_LYCEUM_OWNER_TOKEN=${PURSER_LYCEUM_OWNER_TOKEN}
      - PURSER_SWITCHYARD_TOKEN=${SWITCHYARD_BOOTSTRAP_TOKEN}
      # No PURSER_CF_* — the Cloudflare Access connector talks to the real
      # Zero Trust tenant, which has no dev equivalent. Blank => `--to cloudflare`
      # reports Unavailable, which is the honest answer in dev.
    depends_on:
      postgres-dev:
        condition: service_healthy
      switchyard-dev:
        condition: service_started
    networks:
      - construct_dev_net

  # ======================= THE DEV EDGE (SERV-93) =======================
  #
  # Dev's own edge, one tier down from prod's and sharing nothing with it. Three
  # containers on a network of their own: traefik-dev routes, cf-access-guard-dev
  # decides whether a request is authenticated, cloudflared-dev is the only way in.
  #
  # WHY A SECOND EDGE RATHER THAN A LEG OF PROD'S TRAEFIK
  # The cheap option was to attach the prod Traefik to construct_dev_net so it could
  # route <svc>-dev. hostnames, and by 2026-08 it was no longer the dangerous option
  # it had been in SERV-77: the prod `internal` entrypoint now binds one address
  # (SERV-107) and every router on it validates the Access JWT at the origin
  # (SERV-106), so a dev container on a shared Traefik would be refused rather than
  # served. It was rejected anyway. It requires a carve-out in
  # check-dev-isolation.sh's check 4 — "nothing outside the dev project is attached
  # to construct_dev_net" — and that check exists BECAUSE this repo made exactly that
  # exception once before. Trading a property that holds structurally for one that
  # holds because a middleware is attached everywhere is the wrong direction, and
  # nothing here needs to be on both networks to avoid it.
  #
  # WHAT IS DELIBERATELY NOT MIRRORED FROM PROD
  #   - No `public` entrypoint, no ACME, no CF_DNS_API_TOKEN, no CrowdSec, no
  #     dashboard. See config/traefik-dev/traefik.yml for each reason.
  #   - No exemptions from origin auth. Prod has one (the GitHub webhook); dev holds
  #     no webhook secret and must never receive real webhooks, so it has none.
  #   - No argosy-dev or purser-dev hostname. See config/traefik-dev/dynamic/routers.yml.
  #
  # GATED BEHIND THE `edge` PROFILE, and the gate is the tunnel credential itself.
  # Half of this ticket lives in the Cloudflare Zero Trust dashboard — a second
  # tunnel, its token, and one Access application per dev hostname — which no file
  # here can create. Until DEV_CLOUDFLARE_TUNNEL_TOKEN is present in DEV_ENV_FILE
  # these three services are not started at all, which is the honest state: a
  # cloudflared with no token crash-loops, and an empty variable is not a value
  # (CLAUDE.md). The Makefile reads that variable's PRESENCE and sets
  # COMPOSE_PROFILES for every dev target, so filling it in is the only step needed
  # to turn the edge on — there is no second code change waiting behind it.
  # docs/dev-environment.md has the dashboard runbook.

  # --- DEV EDGE PROXY (traefik-dev) ---
  traefik-dev:
    # Same image and same digest as the prod Traefik, on purpose. Dev is a rehearsal;
    # an edge one minor version off prod's rehearses something that is not going to
    # ship. Bump both together. Digest-pinned because `v3.3` is a moving tag that
    # upstream repoints on every patch release (SERV-105).
    image: traefik:v3.3@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f   # v3.3.7
    container_name: traefik-dev
    restart: unless-stopped
    profiles: [edge]
    # NO `ports:`. Nothing about the dev edge is published to the host — dev is
    # reached through the tunnel, or on the loopback ports the services publish
    # themselves. Publishing 9080 here would put an unauthenticated-at-the-network
    # -layer entrypoint on the LAN, which check-dev-isolation.sh check 3 forbids
    # anyway.
    volumes:
      - ./config/traefik-dev/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik-dev/dynamic:/etc/traefik/dynamic:ro
    networks:
      # Both, and for different jobs — the same split as prod. construct_dev_net is
      # how traefik-dev reaches the dev backends it proxies to; construct_dev_edge_net
      # is the only place the `internal` entrypoint listens. The static address is not
      # cosmetic: config/traefik-dev/traefik.yml binds `internal` to exactly
      # 172.31.241.10:9080, so this value and that one have to agree or cloudflared-dev
      # cannot connect and every dev hostname goes dark. Asserted by
      # `make dev-edge-auth-check`.
      #
      # Note what this does NOT do: both of these networks belong to THIS project, so
      # check-dev-isolation.sh's "nothing foreign is attached to construct_dev_net"
      # still holds unamended. That is the whole reason this is a second Traefik.
      construct_dev_net: {}
      construct_dev_edge_net:
        ipv4_address: 172.31.241.10
    depends_on:
      # Ordering only, not a health gate — same trade as prod. Traefik retries
      # forwardAuth per request, so a guard that is still starting costs a few
      # seconds of 500s rather than holding the whole edge down.
      - cf-access-guard-dev

  # --- DEV ORIGIN AUTH (cf-access-guard-dev) ---
  # The SAME source as prod's guard, built again for this project. Not the same
  # image: dev must not depend on an artefact the prod project happens to have built,
  # and `construct-server-dev-cf-access-guard` vs `construct-server-cf-access-guard`
  # is what keeps the two independent. The build is a layer-cache hit after the first
  # run — stdlib-only Go with nothing to download.
  #
  # Its AUDs are what make a dev token useless against prod and vice versa. Every
  # application on the team domain is signed by the SAME key, so per-host audiences
  # are the only thing separating them: without them a token minted for
  # switchyard-dev would open prod switchyard, which is the exact outcome this
  # ticket exists to avoid.
  cf-access-guard-dev:
    build:
      context: ./services/cf-access-guard
      # The shared Access verifier (SERV-131), exactly as prod declares it. This
      # builds the SAME Dockerfile as prod's guard, so it needs the same named
      # context: `COPY --from=cfaccess` with no matching stage or context is
      # resolved by BuildKit as an IMAGE reference, and the build dies on
      # `docker.io/library/cfaccess:latest`. `dev-build-guard` is the first thing
      # `make dev-up` does, so getting this wrong stops the whole dev deploy, not
      # just the edge — while the already-running guard keeps serving, because
      # compose does not stop a profile-gated container it did not start.
      additional_contexts:
        cfaccess: ./pkg/cfaccess
      args:
        # deploy-dev.yml sets this from
        # `git log -1 -- services/cf-access-guard pkg/cfaccess` — BOTH paths, as prod
        # does (SERV-109, widened by SERV-131), because a module-only change is a
        # change to this binary with nothing under services/ to show for it.
        # `:-unknown` and not `:-`: an empty build arg stamps an empty label, which
        # compares equal to a container that has no label at all, so "no evidence"
        # would silently read as "current".
        GUARD_REVISION: ${GUARD_REVISION:-unknown}
    container_name: cf-access-guard-dev
    restart: unless-stopped
    profiles: [edge]
    environment:
      # Public identifiers, not secrets — an AUD is an application identifier and
      # possession of one grants nothing; every check the guard makes is
      # cryptographic. Tracked here rather than in DEV_ENV_FILE for the same reason
      # prod tracks its own: an Access application change should be a reviewable diff.
      #
      # The SAME team domain as prod. There is no second Zero Trust tenant — dev gets
      # its own applications and its own AUDs on the one tenant, which is what
      # SERV-93 asks for. (This is not the CF_ACCESS_* pair the dev SERVICES
      # deliberately do without: those would turn on in-app SSO, and dev keeps
      # token-paste login. Dev is reached THROUGH Access at the edge, not by trusting
      # an Access JWT internally.)
      - CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      # host=aud, one entry per router in config/traefik-dev/dynamic/routers.yml.
      #
      # One entry per dev Access application, and they are DIFFERENT values from prod's
      # — checked, not assumed. Every application on the team domain is signed by the
      # same key, so the audience is the only thing separating them: a dev hostname
      # carrying prod switchyard's AUD would let a prod token open dev, and a prod
      # token is exactly what an operator's browser is holding.
      #
      # Empty is a hard error rather than a permissive default: the guard refuses to
      # start with "CF_ACCESS_AUD_MAP is unset or empty, so no host could ever be
      # authorised". Keep that property — a default that waved requests through would
      # serve dev unauthenticated to anything reaching the entrypoint, where failing to
      # start merely means the edge does not come up.
      #
      # `make dev-edge-auth-check config_only=1` lists any host still unmapped, and
      # docs/dev-environment.md has the runbook for adding one.
      - CF_ACCESS_AUD_MAP=switchyard-dev.zerogravity.industries=667784252e65bfcebe7e5c794ed3ec7bb6da6f0855acc8c53f280654a08ead81,lyceum-dev.zerogravity.industries=59de99bfd8d1f24c86e24bed2f065077f0ae7c30178108b9856a259d679dd5c1
      # enforce | audit. `audit` logs the decision it WOULD have made and allows the
      # request anyway. It exists for a cutover against real traffic and is not a
      # steady state; check-edge-auth.sh fails while it is set, which is what stops it
      # surviving here.
      - CF_ACCESS_GUARD_MODE=${DEV_CF_ACCESS_GUARD_MODE:-enforce}
    networks:
      # construct_dev_edge_net ONLY. traefik-dev is the sole caller, and the guard has
      # no business being reachable from the dev services it protects — a dev app that
      # could talk to its own auth gate is a strange shape, and dev runs untested code
      # by design. It does need egress, to fetch the team's signing keys from
      # <team>.cloudflareaccess.com.
      - construct_dev_edge_net
    healthcheck:
      # The image is FROM scratch — no shell, no curl — so the binary probes itself.
      # /healthz goes 503 when no signing key set has ever loaded, and when refreshes
      # have been failing long enough that the cached keys may no longer be the ones
      # Cloudflare signs with. Both are states where every request is about to start
      # failing (SERV-102).
      test: ["CMD", "/cf-access-guard", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- DEV CLOUDFLARE TUNNEL (cloudflared-dev) ---
  # A SECOND tunnel, not a second connector on prod's. Two connectors sharing one
  # token would let Cloudflare route a prod hostname to this one, which cannot serve
  # it — the same failure the prod docs warn about for the retired host connector,
  # except silent and intermittent. Its own tunnel means its own credential, its own
  # ingress rules, and a dev tunnel that can be deleted without touching prod.
  #
  # Dashboard-managed (token) tunnel like prod's, so hostname -> origin ingress lives
  # in the Zero Trust dashboard rather than in this repo. Every rule on it points at
  # http://traefik-dev:9080. No open ports: cloudflared dials out.
  cloudflared-dev:
    image: cloudflare/cloudflared:latest@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cloudflared-dev
    restart: unless-stopped
    profiles: [edge]
    command: tunnel --no-autoupdate run
    environment:
      # NO `:-` fallback, deliberately. An empty token is not a token: cloudflared
      # would exit and restart forever, and the `edge` profile exists precisely so
      # this service is not started until the variable holds something. If you are
      # reading this because the container is crash-looping, the token is present but
      # wrong — mint a new one for the DEV tunnel, not the prod one.
      - TUNNEL_TOKEN=${DEV_CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      # construct_dev_edge_net ONLY, deliberately — the mirror of prod's SERV-107
      # shape. Every ingress rule on this tunnel points at http://traefik-dev:9080, so
      # it needs nothing from construct_dev_net, and keeping it off that network is
      # half of what makes traefik-dev's bind address mean anything: traefik-dev
      # listens on one address and this is the only other CONTAINER that can reach it.
      #
      # If a future ingress rule points at a dev service directly instead of at
      # traefik-dev, it will fail to resolve here. That is the intended failure —
      # route it through traefik-dev rather than re-adding construct_dev_net, which
      # would hand the tunnel a path to every dev service that bypasses the guard.
      - construct_dev_edge_net
    depends_on:
      - traefik-dev

volumes:
  postgres_dev_data:
  switchyard_dev_uploads:
  argosy_dev_artwork:
  argosy_dev_subtitles:
  argosy_dev_transcode:
  lyceum_dev_data:

networks:
  # Nothing crosses between the dev and prod projects. Created by
  # `make dev-network`; only this project references it.
  #
  # An earlier revision attached prod's Traefik here as a second network so it
  # could route dev. hostnames. At the time that handed every dev container — all
  # of them deliberately running :latest, i.e. the untested code this project
  # exists to exercise — an unauthenticated route into prod's HTTP tier: the
  # `internal` entrypoint listened on every interface and its routers carried no
  # auth middleware, so a container on a Traefik-attached network got HTTP 200 from
  # prod switchyard just by setting the Host header. Verified, not assumed.
  #
  # Both halves of that have since been closed. SERV-107 bound `internal` to a
  # single address on construct_edge_net, so the command no longer connects from
  # construct_net; SERV-106 put origin-side Access JWT validation on every router
  # there, so a request that does connect is refused unless it carries a valid
  # token for that host's own AUD. A dev hostname would have no AUD entry and fail
  # closed.
  #
  # The networks stay separate anyway. Isolation that holds because two projects
  # share nothing is cheaper to verify — `make dev-verify-isolation` — than
  # isolation that holds because a middleware is correctly attached everywhere, and
  # the two are not in tension. Giving dev its own edge, with its own Access
  # applications, is SERV-93.
  construct_dev_net:
    external: true

  # The cloudflared-dev -> traefik-dev leg, and nothing else (SERV-93). The dev
  # mirror of prod's construct_edge_net, and for the same reason.
  #
  # An entrypoint bound to `:9080` listens on every interface the container has,
  # which on a shared network means every neighbour. Prod learned that the hard way
  # (SERV-107) — from a throwaway container on the shared network, a spoofed Host
  # returned prod Switchyard, unauthenticated. Dev is the tier where that would
  # matter most: every service here runs `latest`, i.e. the untested code the project
  # exists to exercise. So traefik-dev's `internal` entrypoint binds ONE address, on
  # this network, and the only other container on it is cloudflared-dev.
  #
  # COMPOSE-MANAGED WITH AN EXPLICIT SUBNET, unlike construct_dev_net, which is
  # `external:` and created by `make dev-network`. Binding to a fixed address needs a
  # fixed address, and default IPAM cannot promise one. `name:` pins the network's
  # real name so it is not prefixed with the project name — the compose file, the
  # traefik-dev bind and check-dev-isolation.sh all have to be talking about the same
  # network for any of the three to mean anything.
  #
  # 172.31.241.0/24 — adjacent to prod's 172.31.240.0/24 and, like it, deliberately
  # clear of the 172.17-172.26 /16s Docker has already handed out on this host, so it
  # cannot collide as networks come and go. Adjacency is for legibility only: Docker's
  # inter-bridge isolation rules are what stop traffic crossing between them, not the
  # numbering, and `make dev-verify-isolation` probes that rather than assuming it.
  #
  # This authenticates nothing on its own — that is cf-access-guard-dev's job. The
  # bind decides who can connect, the middleware decides who is served, and neither
  # makes the other redundant.
  construct_dev_edge_net:
    name: construct_dev_edge_net
    ipam:
      config:
        - subnet: 172.31.241.0/24
