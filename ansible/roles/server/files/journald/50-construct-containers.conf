# Managed by ansible (roles/server, tag journald). SATL-25.
# Container logs (journald log driver) share the host journal, so the cap is a SIZE cap only.
# Deliberately NO MaxRetentionSec: ruling 2 keeps the ~80 days of existing host history.
#
# Rate limit, HOST-WIDE. With the docker journald driver every container line is sent by dockerd, so
# all journald-logged containers share ONE rate-limit bucket (docker.service): 10000 messages per 30 s
# in total by default. A docker.service-scoped LogRateLimitBurst cannot help: journald reads per-unit
# limits from /run/systemd/units/, which PID 1 writes only when docker.service STARTS, and we never
# restart dockerd (live-restore is off: it would restart every container). The global setting is read by
# journald itself, so a journald restart is enough. It applies to every service's journal bucket, not
# just Docker's; the limit is per sender, and 50000 per 30 s (~1666/s) is still a ceiling no
# normal service approaches. (Effective burst is also multiplied by a free-disk-space factor, see
# journald.conf(5), so the real ceiling is higher.)
[Journal]
SystemMaxUse=6G
RateLimitIntervalSec=30s
RateLimitBurst=50000
