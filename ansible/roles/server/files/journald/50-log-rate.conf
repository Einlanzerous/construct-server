# Managed by ansible (roles/server, tag journald). SATL-25.
# With the docker journald log driver every container's lines are sent by dockerd, so all of
# them share ONE rate-limit bucket (docker.service): the host default is 10000 messages per
# 30 s in total. Raise it for this unit only; every other service keeps the host default.
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=50000
