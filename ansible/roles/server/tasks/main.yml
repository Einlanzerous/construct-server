---
# --- 1. DOCKER SETUP ---
- name: Install gnupg (required for key de-armoring)
  apt:
    name: gnupg
    state: present

- name: Set up Docker APT repository
  include_tasks: setup_apt_repo.yml
  vars:
    apt_repo_name: Docker
    apt_repo_key_url: https://download.docker.com/linux/ubuntu/gpg
    apt_repo_keyring_path: /usr/share/keyrings/docker-archive-keyring.gpg
    apt_repo_list_name: docker
    apt_repo_string: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

- name: Install Docker Components
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present

- name: Install Kernel Headers
  apt:
    name: linux-headers-generic
    state: present

# --- 2. NVIDIA PURGE (idempotent — cleans up any pre-AMD remnants) ---
# Server now runs an AMD Radeon AI PRO R9700; GPU enablement lives in the
# amd_gpu role. This block removes any Nvidia/CUDA bits left from the prior
# RTX 3080 setup so apt and Docker don't trip over them.
- name: List installed Nvidia/CUDA packages
  shell: dpkg -l | awk '$1=="ii" && ($2 ~ /^(nvidia|libnvidia|cuda|libcuda)/) {print $2}'
  register: nvidia_pkgs
  changed_when: false

- name: Purge Nvidia/CUDA packages
  apt:
    name: "{{ nvidia_pkgs.stdout_lines }}"
    state: absent
    purge: true
    autoremove: true
  when: nvidia_pkgs.stdout_lines | length > 0

- name: Remove Nvidia CDI specification
  file:
    path: /etc/cdi/nvidia.yaml
    state: absent

# --- 3. POWER MANAGEMENT (Prevent server from suspending) ---
# Belt-and-suspenders: systemd mask is the hard block; greeter dconf stops
# GDM from even trying. Both are idempotent.
- name: Mask systemd sleep targets
  systemd:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Disable GDM greeter idle-suspend
  lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: '^#?\s*sleep-inactive-ac-type='
    line: "sleep-inactive-ac-type='nothing'"

- name: Add user to Docker group
  user:
    name: "{{ user_name }}"
    groups: docker
    append: true

- name: Ensure /data directory is owned by user (for Copyparty)
  file:
    path: /data
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# --- 3. DEPLOYMENT (Clone the Repo) ---
# Everything below targets {{ deploy_root }}, never ~/construct-server (SERV-76).
# The home checkout no longer backs the `construct-server` compose project — it is a
# plain git working copy, which also means this role no longer force-resets a
# directory a human edits. (It still contains the separate `argosy-acquisition`
# project under services/; that is a different project name and does not affect the
# construct-server identity this ticket is resolving.)
- name: Ensure deploy root exists
  file:
    path: "{{ deploy_root }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# Two systems can populate the deploy root and only one of them uses git, so
# establish which we are looking at before touching it (SERV-76).
- name: Check whether the deploy root is a git checkout
  stat:
    path: "{{ deploy_root }}/.git"
  register: deploy_root_git

- name: Check whether the deploy root is already populated
  stat:
    path: "{{ deploy_root }}/docker-compose.yml"
  register: deploy_root_compose

# `git clone` refuses a non-empty destination outright — `force: true` does not
# help, it only discards modifications inside an existing repo. So on a host where
# deploy.yml rsynced the stack files in first, an unguarded clone fails hard and
# takes the whole server role with it. That is not hypothetical: merging SERV-76
# fires no deploy, but a `repository_dispatch` from any service repo can, so which
# system reaches an empty root first is a race. Worse, deploy.yml's own
# missing-root error tells the operator to run this playbook.
#
# Clone when the root is genuinely cold; update when it is already ours; stand
# aside when deploy.yml owns the content, which is the documented split anyway —
# ansible bootstraps, deploy.yml owns steady state.
- name: Clone or update Construct Monorepo
  become_user: "{{ user_name }}"
  git:
    repo: "{{ repo_url | default('https://github.com/Einlanzerous/construct-server.git') }}"
    dest: "{{ deploy_root }}"
    version: main
    force: true
  when: deploy_root_git.stat.exists or not deploy_root_compose.stat.exists

# Skip loudly rather than silently (CLAUDE.md). A populated non-git deploy root is
# a supported state, not a fault — but it means this play is not what is keeping
# the stack files current, and an operator debugging a stale file needs to know
# that before they go looking for a bug in this role.
- name: Report that the deploy root is managed by deploy.yml, not this play
  debug:
    msg: >-
      {{ deploy_root }} is populated but is not a git checkout, so the repo clone
      was skipped. deploy.yml rsyncs the stack files there on every deploy and is
      the authority for their contents; this play only bootstraps a cold host.
  when: not deploy_root_git.stat.exists and deploy_root_compose.stat.exists

- name: Ensure aperture directory is owned by user
  file:
    path: "{{ deploy_root }}/aperture"
    state: directory
    recurse: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# This gates the BOOTSTRAP copy two tasks below, and must carry that task's own
# condition (SERV-153). The BOOTSTRAP copy below is `force: false`, so on a host
# that already has a .env it does nothing -- but this assert ran unconditionally and
# hard-failed the whole play over a file that was never going to be read. That is how
# a stale .env on an operator's workstation stopped an ansible run against a
# perfectly healthy server, ~20 tasks before the change the run was for.
#
# It reads the CONTROLLER's checkout on purpose, and that is not the bug it looks
# like: `copy`'s src is controller-side, so this file IS the source of that bootstrap
# copy. Validating the target instead would be checking the wrong file. The DEPLOYED
# one is read from the target further down (`Load .env variables`, via slurp), which
# is the right shape for "what is the stack running" and the wrong one for "is the
# seed complete".
#
# The match is anchored to ^KEY= rather than left a bare substring. `search(item)`
# passed on any occurrence anywhere -- inside a comment, or inside a longer key that
# merely contains this one -- so it could pass a file that does not define the key it
# claims to have found.
- name: Check whether the deploy root already has a .env
  stat:
    path: "{{ deploy_root }}/.env"
  register: deployed_env

- name: Report that the bootstrap .env check does not apply to a warm host
  debug:
    msg: >-
      {{ deploy_root }}/.env already exists, so the bootstrap copy below is a no-op
      and its source is not validated. deploy.yml renders that file from
      PROD_ENV_FILE and is the authority for its contents.
  when: deployed_env.stat.exists

# Reduced to key NAMES on the way in, rather than held whole and marked `no_log`.
# The file carries every prod credential and `set_fact` echoes its value at -v, so
# the safe version is one that never has a value to leak: regex_findall keeps only
# what is left of each `=`. That is a property of the expression rather than an
# annotation someone has to remember to re-add, which is the same argument
# render-env.sh's strip loses by being a mitigation (SERV-94).
#
# It also makes the anchoring structural. The old check was `search(item)` against
# the raw text, which passed on any occurrence anywhere -- a key named only in a
# COMMENT, or one that is merely a suffix of a longer key, both certified a file
# that does not define it. Comparing against an extracted key set cannot do that.
- name: Index the keys the bootstrap .env defines
  set_fact:
    bootstrap_env_keys: >-
      {{ lookup('file', playbook_dir + '/../.env')
         | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)=') }}
  when: not deployed_env.stat.exists

# One assert over a set, NOT a loop over 15 asserts. `quiet: true` does not do what
# it looks like it does -- it suppresses the assertion detail, not the default
# callback's per-item lines -- so a loop prints one line per key however it is
# marked, and a loop skipped by `when` prints one SKIPPING line per key plus a
# task-level one. Sixteen lines to say a check did not apply. This form prints one
# line in every case, and names every missing key at once instead of stopping at
# the first.
- name: Validate required .env keys are present
  vars:
    required_env_keys:
      # Datadog
      - DD_API_KEY
      - DD_SITE
      - DD_TAGS
      # Semaphore UI
      - SEMAPHORE_ADMIN_PASSWORD
      - SEMAPHORE_ADMIN_NAME
      - SEMAPHORE_ADMIN_EMAIL
      - SEMAPHORE_ADMIN
      # GitHub / GHCR
      - GITHUB_USER
      - GITHUB_PAT
      # Service ports
      - COOK_BOOK_PORT
      - SWITCHYARD_PORT
      # Postgres / per-service DB passwords
      - POSTGRES_PASSWORD
      - COOK_BOOK_DB_PASSWORD
      - SWITCHYARD_DB_PASSWORD
      # Switchyard
      - SWITCHYARD_PUBLIC_URL
    # Sorted so a failure message is deterministic: `difference` is a set operation
    # and does not promise to preserve the order above.
    missing_env_keys: "{{ required_env_keys | difference(bootstrap_env_keys) | sort }}"
  assert:
    that:
      - missing_env_keys | length == 0
    fail_msg: >-
      The bootstrap .env ({{ playbook_dir }}/../.env) is missing
      {{ missing_env_keys | length }} required key(s): {{ missing_env_keys | join(', ') }}.
      That file seeds {{ deploy_root }}/.env on a cold host and is read from the
      machine running ansible, not from the target.
    success_msg: >-
      bootstrap .env defines all {{ required_env_keys | length }} required keys
    quiet: true
  when: not deployed_env.stat.exists

# Deliberately does NOT notify a Docker restart (SERV-84). Restarting the daemon
# restarts containers with their OLD spec, so it cannot deliver an env change —
# the same "recreate, never restart" invariant as SERV-8, one level up. What
# actually applies this file is `Start Docker Stack` below, via
# `docker compose up -d`. The old handler fired later in the same play anyway —
# the signet role's `meta: flush_handlers` flushes the whole play's queue, and
# site.yml runs signet after server — so it landed after that task had already
# done the work, and bounced every compose project on the host to no effect.
- name: Copy .env file to server
  copy:
    src: "{{ playbook_dir }}/../.env"
    dest: "{{ deploy_root }}/.env"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0600"
    # force: false because this is the BOOTSTRAP copy only (SERV-76). Now that this
    # role and deploy.yml write the same file, the previous `force: true` would have
    # made every ansible run silently overwrite the deployed .env with whatever is in
    # the local ansible/../.env — a different and staler source than the PROD_ENV_FILE
    # environment secret that CLAUDE.md names as authoritative (SERV-48). Steady-state
    # secret changes belong in the Signet vault, applied with `signet sync` — that
    # secret is RENDERED by Signet, so a `gh secret set` on it is reverted by the next
    # sync rather than persisting.
    force: false

# The deployed environment has two sources (SERV-96): credentials, from the secret on
# a CI deploy or from the bootstrap copy above on a cold host; and the first-party
# image pins, from the tracked versions.env. This reconciles the pin block into the
# deployed .env.
#
# It reads deploy_root's OWN .env rather than the local one, which is what keeps the
# `force: false` property above intact — this task never pulls credentials from the
# staler local copy, it only rewrites the block below render-env.sh's marker, and it
# is idempotent against a file it already rendered. Without it a cold host would start
# prod on the `:-latest` fallback: exactly what that fallback exists for, but not
# something worth doing silently when the pins are sitting right there in the clone.
- name: Reconcile first-party image pins into the deployed .env
  become_user: "{{ user_name }}"
  command:
    argv:
      - "{{ deploy_root }}/scripts/render-env.sh"
      - "{{ deploy_root }}/.env"
      - "{{ deploy_root }}/versions.env"
      - "{{ deploy_root }}/.env"
  register: pin_render
  changed_when: pin_render.stdout == "updated"

- name: Ensure config directory exists
  file:
    path: "{{ deploy_root }}/config"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# The wiki's bind source (SERV-101). It is NOT in the repo — the site is generated,
# so only wiki.yml's publish step creates it — which means on a cold host `Start
# Docker Stack` below reaches a missing bind source first and the Docker daemon
# creates it itself, as ROOT. Every later `rsync` from wiki.yml then runs as the
# runner user (uid 1000) into a root-owned directory and fails, and keeps failing,
# until someone chowns it by hand — which the runner deliberately cannot do.
#
# So claim it here, before compose ever sees it. Creating it empty is harmless:
# nginx starts fine with nothing to serve and /healthz returns 503 until the first
# wiki build lands, which is the honest answer to "is the bundle there".
- name: Ensure the wiki site directory exists and is owned by user
  file:
    path: "{{ deploy_root }}/wiki/site"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# Chronicle's bind source (SERV-151), claimed here for the same reason and with a
# sharper failure than the wiki's. /data/chronicle is not in the repo and nothing
# generates it, so on a cold host compose reaches a missing bind source first and
# the daemon creates /data/chronicle as ROOT. Chronicle then REFUSES TO BOOT,
# because it stats both subdirectories and will not invent them — a typo'd path
# springing into existence is how a corpus ends up on the container's writable
# layer and vanishes at the next redeploy.
#
# The remedy printed in docker-compose.yml is `mkdir -p` with no sudo, and in that
# state it fails with Permission denied — the instruction and the failure it
# addresses cannot both be true. Claiming the path here is what keeps them apart.
# The subdirectories are named individually because it is `audio/` and `inbox/`
# that chronicle stats; a magos-owned parent with root-owned children fails the
# same way.
- name: Ensure the chronicle capture directories exist and are owned by user
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  loop:
    - /data/chronicle
    - /data/chronicle/audio
    - /data/chronicle/inbox

# Two tasks that wrote copyparty config out-of-band are deliberately gone (SERV-76).
#
# `Create copyparty configuration` wrote a four-line stub over
# config/copyparty.conf. That was survivable while ansible deployed from
# ~/construct-server and the live stack read the runner's checkout — the stub
# landed in a directory nothing served from. Pointing this role at the deploy root
# would have made it live, and destructively: the committed file serves
# `/w/hdd/media`, the stub serves `/w`, and since /data is mounted at /w/hdd
# (docker-compose.yml:71) that widens the web root from /data/media to the entire
# host media tree, while dropping e2dsa, e2ts, no-robots and the explicit accs
# block. copyparty would have picked it up on the bootstrap run, because its bind
# source changes with the deploy root and it therefore recreates.
#
# `Patch docker-compose.yml to mount copyparty config` used `lineinfile` to inject
# a mount that is committed at docker-compose.yml:72 — a no-op that could only
# re-diverge the copies.
#
# Both configs are committed and both are now written by git alone: this role's
# clone, or deploy.yml's rsync. Editing the deploy root out-of-band is precisely
# how the two checkouts were allowed to drift apart in the first place.

- name: Ensure construct_net Docker network exists
  community.docker.docker_network:
    name: construct_net
    driver: bridge
    state: present

# --- DEV PROJECT BOOTSTRAP (SERV-77, SERV-97) ---
# Only the two things `deploy-dev.yml` cannot create for itself. /opt is root-owned and
# the runner has no sudo, so a workflow mkdir would fail in a less legible way than the
# workflow's own "bootstrap the host first" error — same split as the prod deploy root
# (SERV-76): ansible bootstraps, the workflow owns steady state.
#
# Deliberately does NOT clone, render an .env, or start anything. Dev's environment comes
# from the DEV_ENV_FILE secret on the `home-server-dev` GitHub Environment and must never
# be assembled from anything on this host — copying the prod .env into dev is the failure
# SERV-77 exists to make impossible, because a dev purser holding prod credentials does
# not fail safely, it succeeds against production.
- name: Ensure dev deploy root exists
  file:
    path: "{{ dev_deploy_root }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# External to the dev compose project, and owned by it alone. Nothing from the prod
# project may ever join it (asserted by scripts/check-dev-isolation.sh).
- name: Ensure construct_dev_net Docker network exists
  community.docker.docker_network:
    name: construct_dev_net
    driver: bridge
    state: present

- name: Load .env variables
  slurp:
    src: "{{ deploy_root }}/.env"
  register: env_file_raw

- name: Parse .env into facts
  set_fact:
    dotenv: "{{ dict(env_file_raw.content | b64decode | regex_findall('(?m)^([A-Z_]+)=(.*)$')) }}"

- name: Log in to GitHub Container Registry
  become_user: "{{ user_name }}"
  shell: echo "{{ dotenv.GITHUB_PAT }}" | docker login ghcr.io -u "{{ dotenv.GITHUB_USER }}" --password-stdin
  no_log: true
  changed_when: false

- name: Start Docker Stack
  become_user: "{{ user_name }}"
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ deploy_root }}"
  register: docker_stack_start
  changed_when: "'Running' not in docker_stack_start.stdout"

- name: Pull Ollama Models
  become_user: "{{ user_name }}"
  command: "docker exec ollama ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  register: ollama_pull
  changed_when: "'success' in ollama_pull.stdout"
  ignore_errors: true

- name: Get installed Ollama models
  become_user: "{{ user_name }}"
  command: docker exec ollama ollama list
  register: ollama_list
  changed_when: false

- name: Remove unlisted Ollama models
  become_user: "{{ user_name }}"
  command: "docker exec ollama ollama rm {{ item }}"
  loop: "{{ ollama_list.stdout_lines[1:] | map('split') | map('first') | list }}"
  when: item not in ollama_models
  changed_when: true
