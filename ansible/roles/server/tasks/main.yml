---
# --- 1. DOCKER SETUP ---
- name: Install gnupg (required for key de-armoring)
  apt:
    name: gnupg
    state: present

- name: Set up Docker APT repository
  include_tasks: setup_apt_repo.yml
  vars:
    apt_repo_name: Docker
    apt_repo_key_url: https://download.docker.com/linux/ubuntu/gpg
    apt_repo_keyring_path: /usr/share/keyrings/docker-archive-keyring.gpg
    apt_repo_list_name: docker
    apt_repo_string: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

- name: Install Docker Components
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present

- name: Install Kernel Headers
  apt:
    name: linux-headers-generic
    state: present

# --- 2. NVIDIA PURGE (idempotent — cleans up any pre-AMD remnants) ---
# Server now runs an AMD Radeon AI PRO R9700; GPU enablement lives in the
# amd_gpu role. This block removes any Nvidia/CUDA bits left from the prior
# RTX 3080 setup so apt and Docker don't trip over them.
- name: List installed Nvidia/CUDA packages
  shell: dpkg -l | awk '$1=="ii" && ($2 ~ /^(nvidia|libnvidia|cuda|libcuda)/) {print $2}'
  register: nvidia_pkgs
  changed_when: false

- name: Purge Nvidia/CUDA packages
  apt:
    name: "{{ nvidia_pkgs.stdout_lines }}"
    state: absent
    purge: true
    autoremove: true
  when: nvidia_pkgs.stdout_lines | length > 0

- name: Remove Nvidia CDI specification
  file:
    path: /etc/cdi/nvidia.yaml
    state: absent

# --- 3. POWER MANAGEMENT (Prevent server from suspending) ---
# Belt-and-suspenders: systemd mask is the hard block; greeter dconf stops
# GDM from even trying. Both are idempotent.
- name: Mask systemd sleep targets
  systemd:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Disable GDM greeter idle-suspend
  lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: '^#?\s*sleep-inactive-ac-type='
    line: "sleep-inactive-ac-type='nothing'"

- name: Add user to Docker group
  user:
    name: "{{ user_name }}"
    groups: docker
    append: true

- name: Ensure /data directory is owned by user (for Copyparty)
  file:
    path: /data
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# --- 3. DEPLOYMENT (Clone the Repo) ---
# Everything below targets {{ deploy_root }}, never ~/construct-server (SERV-76).
# The home checkout no longer backs the `construct-server` compose project — it is a
# plain git working copy, which also means this role no longer force-resets a
# directory a human edits. (It still contains the separate `argosy-acquisition`
# project under services/; that is a different project name and does not affect the
# construct-server identity this ticket is resolving.)
- name: Ensure deploy root exists
  file:
    path: "{{ deploy_root }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# Two systems can populate the deploy root and only one of them uses git, so
# establish which we are looking at before touching it (SERV-76).
- name: Check whether the deploy root is a git checkout
  stat:
    path: "{{ deploy_root }}/.git"
  register: deploy_root_git

- name: Check whether the deploy root is already populated
  stat:
    path: "{{ deploy_root }}/docker-compose.yml"
  register: deploy_root_compose

# `git clone` refuses a non-empty destination outright — `force: true` does not
# help, it only discards modifications inside an existing repo. So on a host where
# deploy.yml rsynced the stack files in first, an unguarded clone fails hard and
# takes the whole server role with it. That is not hypothetical: merging SERV-76
# fires no deploy, but a `repository_dispatch` from any service repo can, so which
# system reaches an empty root first is a race. Worse, deploy.yml's own
# missing-root error tells the operator to run this playbook.
#
# Clone when the root is genuinely cold; update when it is already ours; stand
# aside when deploy.yml owns the content, which is the documented split anyway —
# ansible bootstraps, deploy.yml owns steady state.
- name: Clone or update Construct Monorepo
  become_user: "{{ user_name }}"
  git:
    repo: "{{ repo_url | default('https://github.com/Einlanzerous/construct-server.git') }}"
    dest: "{{ deploy_root }}"
    version: main
    force: true
  when: deploy_root_git.stat.exists or not deploy_root_compose.stat.exists

# Skip loudly rather than silently (CLAUDE.md). A populated non-git deploy root is
# a supported state, not a fault — but it means this play is not what is keeping
# the stack files current, and an operator debugging a stale file needs to know
# that before they go looking for a bug in this role.
- name: Report that the deploy root is managed by deploy.yml, not this play
  debug:
    msg: >-
      {{ deploy_root }} is populated but is not a git checkout, so the repo clone
      was skipped. deploy.yml rsyncs the stack files there on every deploy and is
      the authority for their contents; this play only bootstraps a cold host.
  when: not deploy_root_git.stat.exists and deploy_root_compose.stat.exists

- name: Ensure aperture directory is owned by user
  file:
    path: "{{ deploy_root }}/aperture"
    state: directory
    recurse: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

- name: Read .env file contents
  set_fact:
    env_file_content: "{{ lookup('file', playbook_dir + '/../.env') }}"

- name: Validate required .env keys are present
  assert:
    that:
      - "env_file_content is search(item)"
    fail_msg: "Missing required key '{{ item }}' in .env file"
  loop:
    # Datadog
    - DD_API_KEY
    - DD_SITE
    - DD_TAGS
    # Semaphore UI
    - SEMAPHORE_ADMIN_PASSWORD
    - SEMAPHORE_ADMIN_NAME
    - SEMAPHORE_ADMIN_EMAIL
    - SEMAPHORE_ADMIN
    # GitHub / GHCR
    - GITHUB_USER
    - GITHUB_PAT
    # Service ports
    - COOK_BOOK_PORT
    - SWITCHYARD_PORT
    # Postgres / per-service DB passwords
    - POSTGRES_PASSWORD
    - COOK_BOOK_DB_PASSWORD
    - SWITCHYARD_DB_PASSWORD
    # Imperium-Loop pipeline (n8n / Switchyard / Anthropic / Discord)
    - N8N_API_KEY
    - ANTHROPIC_API_KEY
    - SWITCHYARD_PUBLIC_URL
    - DISCORD_BOT_TOKEN
    - DISCORD_GUILD_ID
    - DISCORD_CHANNEL_ID

# Deliberately does NOT notify a Docker restart (SERV-84). Restarting the daemon
# restarts containers with their OLD spec, so it cannot deliver an env change —
# the same "recreate, never restart" invariant as SERV-8, one level up. What
# actually applies this file is `Start Docker Stack` below, via
# `docker compose up -d`. The old handler fired later in the same play anyway —
# the signet role's `meta: flush_handlers` flushes the whole play's queue, and
# site.yml runs signet after server — so it landed after that task had already
# done the work, and bounced every compose project on the host to no effect.
- name: Copy .env file to server
  copy:
    src: "{{ playbook_dir }}/../.env"
    dest: "{{ deploy_root }}/.env"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0600"
    # force: false because this is the BOOTSTRAP copy only (SERV-76). Now that this
    # role and deploy.yml write the same file, the previous `force: true` would have
    # made every ansible run silently overwrite the deployed .env with whatever is in
    # the local ansible/../.env — a different and staler source than the PROD_ENV_FILE
    # environment secret that CLAUDE.md names as authoritative (SERV-48). Steady-state
    # secret changes belong in `gh secret set PROD_ENV_FILE --env home-server`.
    force: false

- name: Ensure config directory exists
  file:
    path: "{{ deploy_root }}/config"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# Two tasks that wrote copyparty config out-of-band are deliberately gone (SERV-76).
#
# `Create copyparty configuration` wrote a four-line stub over
# config/copyparty.conf. That was survivable while ansible deployed from
# ~/construct-server and the live stack read the runner's checkout — the stub
# landed in a directory nothing served from. Pointing this role at the deploy root
# would have made it live, and destructively: the committed file serves
# `/w/hdd/media`, the stub serves `/w`, and since /data is mounted at /w/hdd
# (docker-compose.yml:71) that widens the web root from /data/media to the entire
# host media tree, while dropping e2dsa, e2ts, no-robots and the explicit accs
# block. copyparty would have picked it up on the bootstrap run, because its bind
# source changes with the deploy root and it therefore recreates.
#
# `Patch docker-compose.yml to mount copyparty config` used `lineinfile` to inject
# a mount that is committed at docker-compose.yml:72 — a no-op that could only
# re-diverge the copies.
#
# Both configs are committed and both are now written by git alone: this role's
# clone, or deploy.yml's rsync. Editing the deploy root out-of-band is precisely
# how the two checkouts were allowed to drift apart in the first place.

- name: Ensure construct_net Docker network exists
  community.docker.docker_network:
    name: construct_net
    driver: bridge
    state: present

- name: Load .env variables
  slurp:
    src: "{{ deploy_root }}/.env"
  register: env_file_raw

- name: Parse .env into facts
  set_fact:
    dotenv: "{{ dict(env_file_raw.content | b64decode | regex_findall('(?m)^([A-Z_]+)=(.*)$')) }}"

- name: Log in to GitHub Container Registry
  become_user: "{{ user_name }}"
  shell: echo "{{ dotenv.GITHUB_PAT }}" | docker login ghcr.io -u "{{ dotenv.GITHUB_USER }}" --password-stdin
  no_log: true
  changed_when: false

- name: Start Docker Stack
  become_user: "{{ user_name }}"
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ deploy_root }}"
  register: docker_stack_start
  changed_when: "'Running' not in docker_stack_start.stdout"

- name: Pull Ollama Models
  become_user: "{{ user_name }}"
  command: "docker exec ollama ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  register: ollama_pull
  changed_when: "'success' in ollama_pull.stdout"
  ignore_errors: true

- name: Get installed Ollama models
  become_user: "{{ user_name }}"
  command: docker exec ollama ollama list
  register: ollama_list
  changed_when: false

- name: Remove unlisted Ollama models
  become_user: "{{ user_name }}"
  command: "docker exec ollama ollama rm {{ item }}"
  loop: "{{ ollama_list.stdout_lines[1:] | map('split') | map('first') | list }}"
  when: item not in ollama_models
  changed_when: true
