---
# Signet — construct-server credential vault + outbound-sync daemon (SGNT).
# v1 runs as a system unit under the `magos` account (per IDEA-13 Q4): the vault
# (master key + SQLite DB) lives in that user's home, so User= must own it.
signet_user: magos

# Binary + on-disk vault locations. These are provisioned out of band during
# Signet bring-up (SGNT-1) — this role only wires the daemon, it does not
# install the binary or initialize the vault. If the binary is absent the role
# installs the unit but skips enable/start (see tasks/main.yml).
signet_binary: "/home/{{ signet_user }}/.local/bin/signet"
signet_config_dir: "/home/{{ signet_user }}/.config/signet"   # master.key (0400)
signet_state_dir: "/home/{{ signet_user }}/.local/share/signet"  # signet.db + audit ledger

# Bind addresses (SERV-65/69). Loopback alone strands every container: the
# Switchyard backend sits on construct_net and reaches the host through
# host.docker.internal, which `extra_hosts: host-gateway` resolves to the docker0
# gateway — a socket bound to 127.0.0.1 refuses that connection. Both interfaces
# are named explicitly rather than using 0.0.0.0, which would put a credential
# vault on the LAN and Tailscale too. Multi-address support is SGNT-17 (v1.4.1);
# an older binary treats the whole comma string as one address and fails to bind.
#
# Hosts must be IP literals — the daemon rejects `localhost`, because net.Listen
# resolves a name and binds exactly one of the answers, so on a dual-stack host
# it would serve 127.0.0.1 *or* ::1 and turn half its clients away while
# reporting a clean start.
#
# Hardcoded rather than derived: 172.17.0.1 is Docker's default bridge address
# and nothing in this repo configures otherwise (no daemon.json, no `bip`
# anywhere in ansible/). Confirmed on the host 2026-08-08. Override here if that
# ever changes rather than editing the unit template.
signet_docker_gateway: "172.17.0.1"
signet_addr: "127.0.0.1:4010,{{ signet_docker_gateway }}:4010"

# `signet_addr` is a bind LIST and is not a valid URL authority. Anything that
# needs one reachable address — notably the deploy health check in
# ops/update-signet.yml — must use this instead. Interpolating the bind list into
# a URL yields http://127.0.0.1:4010,172.17.0.1:4010/healthz, which resolves to a
# host named "127.0.0.1:4010,172.17.0.1" and fails every probe, red-flagging a
# deploy whose daemon is perfectly healthy.
signet_health_addr: "{{ signet_addr.split(',') | first }}"

# Multi-address SIGNET_ADDR landed in v1.4.1 (SGNT-17). An older binary treats
# the whole comma string as a single address and fails to bind — and because the
# unit is Restart=always, it burns its start limit in ~25s and lands in `failed`,
# taking loopback down with it. That is strictly worse than the bug the
# multi-address bind fixed, so the binary install asserts on this rather than
# trusting the comment.
signet_min_version: "v1.4.1"

# EnvironmentFile holding SIGNET_API_TOKEN (0600, owned by signet_user). The
# token value comes from `signet_api_token`, which should be defined in the
# SOPS-encrypted secrets (ansible/secrets.sops.yml). Left empty here so a plain
# checkout doesn't ship a placeholder token; an empty token means the unit is
# installed but not started (the daemon refuses to serve without it).
signet_env_dir: /etc/signet
signet_env_file: "{{ signet_env_dir }}/signet.env"
signet_api_token: ""

# ---- binary updates (SERV-62) ------------------------------------------------
# Release to install, e.g. "v1.2.0". Empty means "leave the binary alone": the
# role then only wires the unit, as it did before auto-deploy existed. Set it on
# the command line for a deploy (-e signet_version=v1.2.0).
signet_version: ""
signet_repo: Einlanzerous/signet

# THE TAG AND THE VERSION ARE DIFFERENT STRINGS, and every bug in this path has
# been someone comparing one against the other (SERV-130).
#
# `signet_version` is the git TAG — `v1.9.1`. It is what `gh release download`
# needs and it keeps its prefix. Everything that COMPARES versions uses the bare
# form below, because every version signet itself produces is bare: SGNT-38
# stripped the "v" from `/healthz`, from `signet version` and from the Makefile,
# so that the delivery ledger — which compares with strict equality — could match
# an image label against what a daemon reports.
#
# Comparisons also strip the reported side rather than trusting it (see
# tasks/binary.yml and ops/update-signet.yml). Anything released before SGNT-38
# still answers with a "v", and a rollback to one of those is a deploy this
# playbook has to be able to verify, not fail.
signet_version_bare: "{{ signet_version | regex_replace('^v', '') }}"

# Release asset naming, from signet's release.yml build job.
signet_asset: "signet-{{ signet_version_bare }}-linux-amd64"

# Scoped sudo rule letting the deploy restart the unit without a password. The
# daemon is a *system* unit but its binary and vault live in the user's home, so
# everything except the restart is unprivileged; this grants exactly the one
# privileged verb rather than blanket sudo.
signet_sudoers_file: /etc/sudoers.d/signet-restart
