---
# Binary update path (SERV-62). Included only when signet_version is set, so an
# ordinary site.yml run never touches the installed binary.
#
# The binary lives in signet_user's home, so nothing here needs privilege — only
# the restart does, and that goes through the scoped sudo rule in the handler.
# signet_binary_become lets the caller say who it already is: site.yml runs as
# root and must drop to signet_user, while the auto-deploy already runs as that
# user and must not try to sudo (it has no blanket rights and would hang).

# The unit binds a comma-separated SIGNET_ADDR, which only signet_min_version and
# later parse. An older binary reads the whole string as one address, fails to
# bind, and — because the unit is Restart=always — burns its start limit in ~25s
# and lands in `failed`. That takes loopback down too, which is strictly worse
# than the container-only outage the multi-address bind was fixing. The rescue
# path in ops/update-signet.yml advertises `mv signet.prev signet` as recovery,
# so a downgrade into this state is reachable rather than hypothetical: assert
# rather than trusting a comment in defaults.
- name: Refuse to install a Signet older than the multi-address listener
  assert:
    that:
      - signet_version_bare
        is version(signet_min_version | regex_replace('^v', ''), '>=')
    fail_msg: >-
      signet_version={{ signet_version }} predates {{ signet_min_version }}, which
      introduced multi-address SIGNET_ADDR (SGNT-17). The unit binds
      "{{ signet_addr }}"; an older binary cannot parse that and will fail to bind
      at all, including on loopback. To deploy it anyway, also override
      signet_addr to a single host:port in the same run.
    quiet: true

- name: Report the installed Signet version
  command: "{{ signet_binary }} version"
  register: signet_installed_version
  changed_when: false
  failed_when: false
  become: "{{ signet_binary_become | default(true) }}"
  become_user: "{{ signet_user }}"

- name: Decide whether an update is needed
  set_fact:
    # BOTH SIDES ARE COMPARED BARE (SERV-130). This read `signet version`'s
    # output against the v-prefixed TAG, and the comment here used to claim the
    # command "prints the tag it was built with, e.g. v1.2.0". SGNT-38 made that
    # false — `signet version` now routes through the version package's Get() and
    # prints `1.9.1` — so the comparison could never be equal again and this fact
    # was unconditionally true. Every deploy re-downloaded, re-installed and
    # bounced the credential daemon, including one that had nothing to do.
    #
    # It also cost the rollback artifact: `Keep the outgoing binary for rollback`
    # sits inside the block this gates, so a no-op re-run overwrote .prev with a
    # copy of the binary already installed, discarding the only version there was
    # to go back to.
    #
    # The installed side is stripped too, not just the target: a binary from
    # before SGNT-38 answers `v1.9.0`, and recognising that it is already
    # installed is exactly what makes a rollback re-run idempotent.
    #
    # A missing or unreadable binary leaves rc != 0, which means install rather
    # than fail.
    signet_update_needed: >-
      {{ signet_installed_version.rc != 0
         or (signet_installed_version.stdout | trim | regex_replace('^v', ''))
            != signet_version_bare }}

- name: Note that Signet is already at the target version
  debug:
    msg: "Signet is already {{ signet_version }} — nothing to install."
  when: not signet_update_needed

- name: Install Signet {{ signet_version }}
  when: signet_update_needed
  become: "{{ signet_binary_become | default(true) }}"
  become_user: "{{ signet_user }}"
  block:
    # Staged beside the destination, not in the default /tmp. The install below
    # is a rename, which is only atomic within one filesystem; a staging dir on
    # another mount would make mv fall back to copy-then-unlink and leave a
    # window where the executed path holds a truncated binary.
    - name: Create a staging directory for the release download
      tempfile:
        state: directory
        suffix: signet-release
        path: "{{ signet_binary | dirname }}"
      register: signet_stage

    - name: Download the release binary and its checksum
      command: >-
        gh release download {{ signet_version }}
        --repo {{ signet_repo }}
        --pattern {{ signet_asset }}
        --pattern {{ signet_asset }}.sha256
        --dir {{ signet_stage.path }}
      environment:
        GH_TOKEN: "{{ signet_gh_token | default(lookup('env', 'GH_TOKEN'), true) }}"
      changed_when: true

    # Checked before anything moves into place: an asset that fails its
    # checksum must never reach the path the unit executes.
    - name: Verify the checksum
      command: sha256sum --check --status {{ signet_asset }}.sha256
      args:
        chdir: "{{ signet_stage.path }}"
      changed_when: false

    - name: Make the downloaded binary executable
      file:
        path: "{{ signet_stage.path }}/{{ signet_asset }}"
        mode: "0755"

    # Kept so a failed deploy has somewhere to go back to. The health check
    # cannot roll back on its own — by the time it fails the restart has already
    # happened — so preserving the outgoing binary is what makes recovery a one
    # line mv instead of a re-run at the old tag.
    - name: Keep the outgoing binary for rollback
      command: cp -p {{ signet_binary }} {{ signet_binary }}.prev
      when: signet_binary_stat.stat.exists
      changed_when: true

    # Rename, never truncate: the old binary is mapped by the running daemon,
    # and writing over it in place would corrupt a live process. A rename swaps
    # the directory entry and leaves the running image alone until the restart
    # picks up the new one.
    - name: Atomically install the new binary
      command: mv -f {{ signet_stage.path }}/{{ signet_asset }} {{ signet_binary }}
      changed_when: true
      notify: Restart Signet

    # The role stats the binary before this file runs, so on a first install
    # that fact is stale — and both the restart handler and the enable/start
    # task are gated on it. Refresh it so a freshly installed daemon actually
    # gets started.
    - name: Re-check the binary now that it is installed
      stat:
        path: "{{ signet_binary }}"
      register: signet_binary_stat

  always:
    - name: Remove the staging directory
      file:
        path: "{{ signet_stage.path }}"
        state: absent
      when: signet_stage.path is defined
      become: "{{ signet_binary_become | default(true) }}"
      become_user: "{{ signet_user }}"
