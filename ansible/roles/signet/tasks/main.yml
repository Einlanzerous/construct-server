---
- name: Check whether the Signet binary is installed
  stat:
    path: "{{ signet_binary }}"
  register: signet_binary_stat

- name: Warn if the Signet binary is missing
  debug:
    msg: >-
      {{ signet_binary }} not found — installing the systemd unit but leaving it
      stopped. Complete Signet bring-up (SGNT-1: build/install the binary, init
      the vault) then re-run this role to start the daemon.
  when: not signet_binary_stat.stat.exists

- name: Create Signet secrets directory
  file:
    path: "{{ signet_env_dir }}"
    state: directory
    owner: root
    group: "{{ signet_user }}"
    mode: "0750"

# Guarded so an absent token means "leave whatever is there", not "clear it".
# Without it, any run that reaches this task without secrets loaded — the empty
# default in defaults/main.yml — would overwrite a working token with a blank
# one and take the daemon down. The current automated deploy does not reach
# here (it includes only binary.yml, and site.yml hard-fails earlier when sops
# is unavailable), so this guards the paths that would otherwise be one careless
# playbook away from silently blanking the credential.
- name: Deploy Signet environment file (SIGNET_API_TOKEN)
  template:
    src: signet.env.j2
    dest: "{{ signet_env_file }}"
    owner: "{{ signet_user }}"
    group: "{{ signet_user }}"
    mode: "0600"
  no_log: true
  notify: Restart Signet
  when: signet_api_token | default("", true) | length > 0

- name: Note that the API token was left untouched
  debug:
    msg: >-
      signet_api_token is empty (no sops key on this host?) — leaving
      {{ signet_env_file }} as-is rather than blanking it.
  when: signet_api_token | default("", true) | length == 0

# The deploy runs unprivileged except for this one verb. validate= makes
# visudo check the file before it is installed, so a malformed rule can never
# land and lock the account out of sudo.
- name: Allow the Signet user to restart the daemon without a password
  copy:
    dest: "{{ signet_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    content: |
      # {{ ansible_managed }}
      # Scoped for the SERV-62 auto-deploy: restart only, this unit only.
      {{ signet_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart signet, /bin/systemctl restart signet
    validate: "visudo -cf %s"

- name: Deploy Signet systemd unit
  template:
    src: signet.service.j2
    dest: /etc/systemd/system/signet.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart Signet

- name: Update the Signet binary
  include_tasks: binary.yml
  when: signet_version | default("", true) | length > 0

- name: Flush handlers so the unit is (re)loaded before enable/start
  meta: flush_handlers

# Only start once the vault actually exists — an empty token or missing binary
# would just crash-loop the unit. Both present => enable + start on boot.
- name: Enable and start Signet
  systemd:
    name: signet
    enabled: true
    state: started
  when:
    - signet_binary_stat.stat.exists
    - signet_api_token | length > 0

- name: Note that Signet was left stopped
  debug:
    msg: >-
      Signet unit installed but not started — {{ 'binary missing' if not
      signet_binary_stat.stat.exists else 'signet_api_token is empty (set it in
      secrets.sops.yml)' }}.
  when: not (signet_binary_stat.stat.exists and (signet_api_token | length > 0))
