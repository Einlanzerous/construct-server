---
# Delivery prober — the host-side producer for the dev column of Switchyard's
# delivery matrix (SERV-111).
#
# Runs as a user unit-less system timer under an account in the `docker` group:
# the job is a short `docker run` against the switchyard image, so it needs the
# socket and nothing else.
delivery_prober_user: magos

# The wrapper the unit executes. It lives in the REPO (scripts/), not in this
# role, and reaches the box via deploy.yml's rsync to the deploy root — the same
# split every other stack file uses: ansible bootstraps the host-level wiring
# (unit, timer, credential), the workflow owns steady state. That means a fix to
# the probing logic is an ordinary PR and deploy rather than an ansible run.
delivery_prober_script: "{{ deploy_root }}/scripts/probe-delivery.sh"

# Where the prober posts. Loopback: prod switchyard-frontend publishes 4002 on
# the host and proxies /healthz and /v1/* to the backend.
delivery_prober_switchyard_url: "http://localhost:4002"

# The environment being observed. `dev` is seeded `probe_mode: external`, which
# is what makes it legal for an outside prober to write its probe state at all —
# the ingest refuses probe results for an `internal` environment so a
# misconfigured prober cannot fight the in-process reconciler for prod.
delivery_prober_environment: dev

# Match Switchyard's own DELIVERY_PROBE_INTERVAL_MS (5 min default). The ingest
# deduplicates an unchanged observation, so over-polling costs requests, not rows.
delivery_prober_interval: 5min

# ── targets ─────────────────────────────────────────────────────────────────
#
# name -> base URL, rendered into PROBE_TARGETS as `name=url,name=url`. The name
# must match a service in Switchyard's inventory EXACTLY: a probe that got no
# usable answer deliberately does not auto-register one (SWY-284), because "down"
# and "misspelled" are indistinguishable from outside. An unknown name is a 404
# on every run, and the wrapper treats that as a hard failure.
#
# The whole dev tier, as of SERV-140. This list carried switchyard alone from
# SERV-111 until then: the other three sat commented out behind blockers, the
# blockers were closed one by one in other tickets, and nothing came back here to
# uncomment them. The cost was three of the four cells on the dev column of a
# matrix whose entire purpose is dev↔prod drift.
#
# Verified against the live tier before uncommenting, by running the SHARED
# classifier — `server/src/lib/delivery/health-contract.ts`, the same module the
# prober imports, so this is what the prober will conclude and not an
# approximation of it — over each endpoint at the path the inventory gives it:
#
#   switchyard  http://127.0.0.1:14002   observed  4.18.0
#   argosy      http://127.0.0.1:18096   observed  dev  (sha 8845c6e)
#   lyceum      http://127.0.0.1:14005   observed  1.12.0
#   purser      http://127.0.0.1:14006   observed  dev  (sha 8a8c016)
#
# All four are already registered with a null `health_path`, so all four are
# probed at `/healthz` and none needs a registration step first. Re-run that
# check rather than trusting this list before adding a fifth — every stale claim
# it replaces was accurate when it was written.
#
# ── the blockers this list used to carry, and why each is gone ──────────────
#
#   argosy needed health_path=/api/v1/ping. Its /healthz answered plain-text
#   `ok`, which the prober classified as `unreachable`, and it could not
#   self-register: registering requires a clean probe and a clean probe required
#   the health_path that registration would set. Closed twice over — SWY-292
#   stopped reading a text/plain body as silence (only markup, which means
#   something in FRONT of the service answered, is unreachable now), and argosy
#   itself now answers /healthz with {"status":"ok","version":…,"sha":…}. Either
#   alone would have sufficed, so there is nothing left to configure.
#
#   lyceum and purser reported no version. An honest `no_version` until SERV-128's
#   per-service PRs landed. They have: lyceum reports a real semver, purser
#   reports the literal "dev" for an unreleased build.
#
#   Registering them would paint three PROD cells red. This was true while prod's
#   host_template was the literal `http://{service}:4002` — switchyard's port and
#   nobody else's. SWY-294 replaced it with `http://{service}:{port}`, and
#   `resolveProbeUrl` returns null for a service carrying no port, so a portless
#   registration is inert rather than red. It is moot for these three anyway:
#   all nine first-party services are already in the inventory and all nine prod
#   pairs read `observed` with zero consecutive failures. Adding them here
#   creates DEV pairs, which do not exist yet, and touches no prod row.
#
# `version: "dev"` is correct and is stored verbatim. `deriveDrift` deliberately
# does not parse semver — this estate pins bare shas as legitimate versions, so a
# semver comparison would quietly decide an unreleased build has no drift. purser
# and argosy will therefore read as DRIFTED against prod's 0.15.0 and 0.26.0,
# which is true and is the thing the matrix exists to say out loud. A dev rebuild
# is not invisible either: the ingest's unchanged check compares version, digest
# AND sha, so a rebuild that leaves version at "dev" still writes a row when the
# sha moves.
#
# ── what is deliberately NOT here ───────────────────────────────────────────
#
# cf-access-guard-dev, traefik-dev, postgres-dev and cloudflared-dev also run in
# the dev project. They are infrastructure rather than first-party applications,
# and postgres-dev has no HTTP health endpoint at all, so tier A cannot describe
# them. If they belong on the matrix that is tier B (SWY-194) work and should be
# decided deliberately, not settled by whether someone remembered a line here.
delivery_prober_targets:
  switchyard: "http://127.0.0.1:14002"
  argosy: "http://127.0.0.1:18096"
  lyceum: "http://127.0.0.1:14005"
  purser: "http://127.0.0.1:14006"

# ── the credential ──────────────────────────────────────────────────────────
#
# `deployments:observe` and nothing else — see scripts/mint-prober-token.sh for
# why that split is load-bearing. Empty here so a plain checkout ships no
# placeholder; supply it from ansible/secrets.sops.yml. An empty value means the
# role installs the unit and timer but does NOT start them, rather than starting
# a job that would fail every five minutes.
delivery_prober_env_dir: /etc/delivery-prober
delivery_prober_env_file: "{{ delivery_prober_env_dir }}/prober.env"
delivery_prober_token: ""
