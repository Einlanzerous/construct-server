---
# Usage:
#   ansible-playbook ansible/ops/update-signet.yml -e signet_version=v1.2.0
#
# Installs a released Signet binary and restarts the daemon. Driven by
# .github/workflows/deploy-signet.yml on the self-hosted runner (SERV-62), and
# safe to run by hand for the same effect.
#
# Deliberately NOT site.yml --tags signet: that play loads secrets.sops.yml and
# hard-fails when they are unavailable, and the age key is intentionally absent
# from the server. This playbook needs no secrets — it updates a binary — so it
# stays keyless and touches nothing else.
#
# It also runs unprivileged. The binary and vault live in the user's home, and
# the only privileged verb is the restart, which the role's scoped sudoers rule
# permits without a password.

- name: Update the Signet daemon
  hosts: server
  become: false
  vars:
    # We are already the user that owns the binary; do not try to sudo to it.
    signet_binary_become: false

  tasks:
    - name: Validate signet_version is provided
      assert:
        that:
          - signet_version is defined
          - signet_version | length > 0
        fail_msg: "signet_version is required (e.g. -e signet_version=v1.2.0)"

    # Captured before the defaults are loaded, because that file carries an
    # empty signet_version and include_vars outranks whatever set it — which
    # would silently turn the deploy into a no-op. set_fact then outranks
    # include_vars in turn, so the requested version wins either way.
    - name: Remember the requested version
      set_fact:
        signet_requested_version: "{{ signet_version }}"

    - name: Load the signet role's defaults without applying the role
      include_vars:
        file: "{{ playbook_dir }}/../roles/signet/defaults/main.yml"

    - name: Re-apply the requested version over the role default
      set_fact:
        signet_version: "{{ signet_requested_version }}"

    - name: Confirm the scoped sudo rule is in place
      command: sudo -n systemctl --version
      register: signet_sudo_check
      changed_when: false
      failed_when: false

    - name: Fail early when the deploy cannot restart the daemon
      fail:
        msg: >-
          Passwordless sudo for the Signet restart is not available. Apply the
          signet role from a privileged run first (it installs
          {{ signet_sudoers_file }}), otherwise this deploy would install a new
          binary and leave the old one running.
      when: signet_sudo_check.rc != 0

    - name: Stat the installed binary
      stat:
        path: "{{ signet_binary }}"
      register: signet_binary_stat

    - name: Install the requested release
      include_role:
        name: signet
        tasks_from: binary.yml

    - name: Flush handlers so the restart happens before verification
      meta: flush_handlers

    # The daemon reports its own version, so this proves the *new* code is
    # serving rather than merely that something answers on the port. A stale
    # process still holding the socket would answer with the old version and
    # fail here, which is exactly the case worth catching.
    - name: Verify the daemon is serving the new version
      uri:
        url: "http://{{ signet_addr }}/healthz"
        return_content: true
      register: signet_health
      until:
        - signet_health.status is defined
        - signet_health.status == 200
        - (signet_health.json.version | default('')) == signet_version
      retries: 10
      delay: 3

    - name: Report the deployed version
      debug:
        msg: "Signet {{ signet_health.json.version }} is serving on {{ signet_addr }}."
