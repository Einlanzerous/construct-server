# THIRD-PARTY IMAGE PINS (SERV-105)
#
# Every third-party image below is pinned by DIGEST, in the form `repo:tag@sha256:…`.
# The tag is kept for legibility only — docker resolves the digest and ignores it, so
# the tag is documentation and the digest is the pin.
#
# WHY, given these are mostly leaves. `deploy.yml` runs `docker compose pull && up -d`,
# so a floating tag makes every deploy's blast radius depend on what upstream published
# since the last one — unknowable in advance and different every time. That is tolerable
# for an ordinary deploy and NOT tolerable for a rollback, which is the operation you run
# when prod is already broken and whose entire value is being predictable. Measured, not
# theorised: the first real rollback (purser 0.13 → 0.12) recreated purser, ollama and
# semaphore, all in the same millisecond. Only purser was named.
#
# A "stable-looking" tag is not a pin. `traefik:v3.3` moves on every patch release and
# `crowdsec:v1.7.8` can be rebuilt in place — the same trap SERV-102 hit with
# `postgres:16.15-alpine`, where prod ran one digest while the tag pointed at another and
# both reported 16.15. Only a digest is immutable.
#
# THE FOUR EXCEPTIONS are the watchtower opt-ins — dozzle, uptime-kuma, datadog and
# watchtower itself (SERV-75). They stay floating on purpose: watchtower is their update
# path, it runs on a schedule, and it cannot roll a container whose image reference is a
# digest. Pinning them would silently disable the mechanism rather than make anything more
# deliberate. They are also the images whose surprise recreate costs least.
#
# TO UPDATE ONE: resolve the digest you actually want, then edit both halves together.
#
#   docker manifest inspect traefik:v3.4 -v | jq -r '.Descriptor.digest'
#
# Expect exactly one recreate per edited line. Compose decides from the LITERAL image
# string in the spec, not from what it resolves to, so changing the ref costs a recreate
# even when the digest is byte-identical to what is already running (SERV-102).
#
# Landing these pins therefore cost nine recreates, measured with `up -d --dry-run` before
# merging: crowdsec, wiki, copyparty, semaphore, ollama, open-webui, n8n, and — the two
# worth knowing about — traefik and cloudflared. Those two are the edge and the tunnel, so
# every tunneled hostname blips for the second or two they take to come back. No
# first-party service, no postgres, and none of the four watchtower leaves were touched.
#
# The tag is left EXACTLY as it resolved rather than "tidied" to the precise version it
# turned out to be — `traefik:v3.3` really is the tag that produced this digest, and
# rewriting it to `v3.3.7` would assert a tag→digest mapping nobody checked. Where the
# upstream version is known it is a trailing comment instead. Every pin here except
# authentik and redis was taken from the digest its container was ALREADY running, so this
# changed no software; those two are profile-gated (`identity`), have no containers, and
# were resolved from the registry.
#
# Two `${…_TAG}` knobs were removed to do this — `CLOUDFLARED_TAG` and `AUTHENTIK_TAG`.
# A digest wins over a tag, so leaving the variable in place would have made it look
# adjustable while silently having no effect, which is worse than not having it. Both keys
# may still sit unused in PROD_ENV_FILE; that is harmless.
#
# First-party images are pinned separately and differently — one variable per source repo,
# values in the tracked `versions.env`, deliberately floating at major.minor so patch
# releases still land. See that file and the guard in `deploy.yml`.

services:
  # --- AI & LLM STACK ---
  ollama:
    image: ollama/ollama:rocm@sha256:b5d0813b23540019b2a40d70af6531b1d76e5ebcbf17899e5922445c627b6063
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # 64K default context. The R9700 has 32 GiB VRAM — Ollama's stock 2K
      # default is absurdly tight for a card this size. 64K is the sweet spot
      # for daily coding work: fits 30B-class weights + KV cache with headroom
      # (gemma4:31b at 64K ≈ 26 GB resident). Callers wanting longer ctx pass
      # `options.num_ctx` per request; callers wanting shorter to free VRAM
      # do the same. Beware: 128K+ on a 30B model spills to system RAM.
      # Ollama ≥0.32 reads OLLAMA_CONTEXT_LENGTH; the old OLLAMA_NUM_CTX name
      # is ignored (server falls back to a VRAM-based default of 32K).
      - OLLAMA_CONTEXT_LENGTH=65536
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"   # video
      - "993"  # render (host GID — name lookup fails in ollama:rocm image)
    networks:
      - default
      - construct_net

  # --- WEB UI (Open WebUI) ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama

  # --- WATCHTOWER (Auto-Update) ---
  watchtower:
    image: containrrr/watchtower
    labels:
      # Auto-roll: keeps itself current (SERV-75).
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * 1
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      - DOCKER_API_VERSION=1.44
      # Monitor ONLY containers carrying watchtower.enable=true (SERV-75). Watchtower
      # defaults to monitoring everything, which made it a third uncoordinated mutator
      # of prod alongside deploy.yml and repository_dispatch — a merge could go live
      # unattended, with no deploy record and no actor, and it will never call a
      # reporting step, so the delivery ledger could not even see it happen. Opting in
      # is the safe direction: a service added tomorrow is not auto-rolled by default.
      # No first-party image is listed; deploy.yml owns those.
      - WATCHTOWER_LABEL_ENABLE=true
    restart: unless-stopped

  # --- FILE SHARING ---
  copyparty:
    image: copyparty/ac@sha256:a885633e42f7395331ab709c1310bd21e79617b13dfd41c6e3f56910b6a8d2f0   # 1.20.20
    container_name: copyparty
    restart: unless-stopped
    ports:
      - "3923:3923"
    volumes:
      - copyparty_data:/w
      - /data:/w/hdd
      - ./config/copyparty.conf:/cfg/copyparty.conf
    environment:
      - E=idk  # Enable basic drag-and-drop upload

  # --- OBSERVABILITY (Datadog + Dozzle) ---
  datadog:
    image: datadog/agent:7
    labels:
      # Auto-roll: agent; tag-pinned to major 7 (SERV-75).
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: datadog
    restart: unless-stopped
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE}
      - DD_TAGS=${DD_TAGS}
      - DD_DOCKER_LABELS_AS_TAGS=true
      - DD_DOCKER_LISTEN_ON=/var/run/docker.sock
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    # GPU reservation disabled during Nvidia → AMD R9700 swap.
    # Datadog Agent supports AMD/ROCm metrics; revisit when ROCm role lands.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, utility]

  # --- Container Logging (Dozzle) ---
  dozzle:
    image: amir20/dozzle:latest
    labels:
      # Auto-roll: log viewer, no persistent state, nothing depends_on it (SERV-75).
      # Caveat worth knowing: it mounts the docker socket read-write and is the only
      # one of the four opted-in services on a floating tag, so it is the least
      # conservative entry in this set. If the list is ever trimmed, trim this first.
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # --- MONITORING (Uptime Kuma) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    labels:
      # Auto-roll: monitoring; tag-pinned to major 1 (SERV-75).
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  # --- DASHBOARD (Aperture) ---
  aperture-backend:
    image: ghcr.io/einlanzerous/aperture/backend:${APERTURE_TAG:-latest}
    container_name: aperture-backend
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./aperture/config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # AMD GPU monitoring: mount the host ROCm tree so amd-smi is on PATH.
      # Versioned path — update on a ROCm upgrade. Takes effect once the
      # ubuntu-based backend image (with python3) is deployed.
      - /opt/rocm-6.4.4:/opt/rocm:ro
    # GPU device passthrough + render/video groups (GIDs from this host:
    # `getent group render video` -> video=44, render=993).
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"
      - "993"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - backend

  aperture-frontend:
    image: ghcr.io/einlanzerous/aperture/frontend:${APERTURE_TAG:-latest}
    container_name: aperture-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - aperture-backend

  # --- AUTOMATION (Semaphore UI) ---
  semaphore:
    image: semaphoreui/semaphore:latest@sha256:7da3364f331a80d5d47998866f5833c8de978bd57ad49beb69ad2d1d0f3c5f20   # v2.19.8
    container_name: semaphore
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - SEMAPHORE_DB_DIALECT=sqlite
      - SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASSWORD}
      - SEMAPHORE_ADMIN_NAME=${SEMAPHORE_ADMIN_NAME}
      - SEMAPHORE_ADMIN_EMAIL=${SEMAPHORE_ADMIN_EMAIL}
      - SEMAPHORE_ADMIN=${SEMAPHORE_ADMIN}
    volumes:
      - semaphore_data:/etc/semaphore

  # --- DATABASE (Shared PostgreSQL) ---
  # Pinned BY DIGEST, not by tag (SERV-102). Every first-party service depends on this
  # one container, so recreating it is the single largest blast radius in the stack —
  # and under a floating `16-alpine` tag that happened whenever upstream published, on a
  # `docker compose pull` nobody aimed at postgres. On 2026-08-15 it rolled mid-deploy,
  # postgres moved to a new address on construct_net, and switchyard and interlock-worker
  # sat on the dead IP for an hour (see below).
  #
  # A digest and not `16.15-alpine`, because an exact patch tag is still mutable and
  # this was measured rather than assumed: at the time of pinning, the running container
  # was `sha256:44c4ee98…` while `16.15-alpine` in the registry had already moved to
  # `sha256:075f7ba6…`. Both report `postgres 16.15` — upstream rebuilds the same version
  # for base-image updates. So a patch-tag pin would have looked precise, still pulled a
  # different image, and still recreated the container. Only the digest is immutable.
  #
  # The digest chosen is the one ALREADY RUNNING, so this pin changes no bits. It still
  # costs exactly one recreate: compose decides to recreate from the literal image string
  # in the service spec, not from what that string resolves to, so any edit here recreates
  # the container even when the image is byte-identical (verified with `up -d --dry-run`).
  # Pinning to the running digest is what keeps that recreate as cheap as it can be — the
  # container comes back on the same image, so nothing but the address changed — and it
  # separates "stop postgres moving on its own" from "update postgres", leaving the second
  # to happen on purpose rather than riding along with the first.
  #
  # BUDGET FOR THAT RECREATE WHEN THIS LANDS: postgres comes back in about a second, but
  # switchyard and interlock-worker will not follow it to the new address, so run
  #   make force-recreate svc=switchyard
  #   make force-recreate svc=interlock-worker
  # immediately after the deploy that applies this. The new post-deploy health gate will
  # also fail that run, correctly — the stack really is broken until those two are
  # recreated.
  #
  # This does not fix the reconnect fragility, and is not meant to: a deliberate postgres
  # upgrade would still take the Node services down. What it buys is that the upgrade
  # happens when someone chose it, in a reviewable diff, rather than as a surprise
  # attached to an unrelated push — which matters much more now that promote/rollback
  # (SERV-78, SERV-79) make a deploy something we run routinely and expect to be safe.
  #
  # Bumping this is a real upgrade, not a version-string edit: check the release notes,
  # expect the container to be recreated, and expect the Node services to need
  # `make force-recreate` afterwards until their pools re-resolve on error
  # (SWY-267, ITLK-30). Find the current digest with:
  #   docker manifest inspect -v postgres:16-alpine | jq -r '.[0].Descriptor.digest'
  postgres:
    image: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - COOK_BOOK_DB_PASSWORD=${COOK_BOOK_DB_PASSWORD}
      - SWITCHYARD_DB_PASSWORD=${SWITCHYARD_DB_PASSWORD}
      - CENTRIFUGE_DB_PASSWORD=${CENTRIFUGE_DB_PASSWORD}
      - ARGOSY_DB_PASSWORD=${ARGOSY_DB_PASSWORD}
      # Authentik (SERV-19) — its DB/user is provisioned by db/init-db.sh.
      - AUTHENTIK_DB_PASSWORD=${AUTHENTIK_DB_PASSWORD}
      # Lyceum (LYCM-61) — DB/user provisioned by db/init-db.sh.
      - LYCEUM_DB_PASSWORD=${LYCEUM_DB_PASSWORD}
      # Purser (SERV-33) — DB/user provisioned by db/init-db.sh.
      - PURSER_DB_PASSWORD=${PURSER_DB_PASSWORD}
      # Interlock (ITLK-18) — DB/user provisioned by db/init-db.sh. The worker's
      # migration creates pg_trgm itself (trusted extension; interlock_user owns the DB).
      - INTERLOCK_DB_PASSWORD=${INTERLOCK_DB_PASSWORD}
      # Amber (AMBR-4) — DB/user provisioned by db/init-db.sh. Amber runs its own
      # embedded migrator at boot and treats this database as a derived index:
      # the archive on disk is the source of truth and can rebuild it.
      - AMBER_DB_PASSWORD=${AMBER_DB_PASSWORD}
      # Placard (PCAD-1) — DB/user provisioned by db/init-db.sh. Same derived-data
      # shape as amber: the placard repo is the source of truth for every mark;
      # the DB holds URL-check observations and staged uploads.
      - PLACARD_DB_PASSWORD=${PLACARD_DB_PASSWORD}
    networks:
      - construct_net

  # --- APP SERVICES ---
  cook_book:
    image: ghcr.io/einlanzerous/cook_book:${COOK_BOOK_TAG:-latest}
    container_name: cook_book
    restart: unless-stopped
    ports:
      - "${COOK_BOOK_PORT}:${COOK_BOOK_PORT}"
    environment:
      - PORT=${COOK_BOOK_PORT}
      - DATABASE_URL=postgres://cook_book_user:${COOK_BOOK_DB_PASSWORD}@postgres:5432/cook_book?sslmode=disable
    networks:
      - construct_net
    depends_on:
      - postgres

  # --- ARGOSY (media streaming) ---
  # Single Go binary with the Vue SPA embedded + ffmpeg/Intel-QSV runtime (image
  # published by the argosy repo). Needs /dev/dri for hardware transcoding and
  # the media library mounted read-only.
  argosy:
    image: ghcr.io/einlanzerous/argosy:${ARGOSY_TAG:-latest}
    container_name: argosy
    restart: unless-stopped
    ports:
      - "${ARGOSY_PORT:-8096}:8096"
    environment:
      - ARGOSY_ADDR=:8096
      - ARGOSY_DATABASE_URL=postgres://argosy_user:${ARGOSY_DB_PASSWORD}@postgres:5432/argosy?sslmode=disable
      - ARGOSY_MEDIA_DIR=/media
      - ARGOSY_ARTWORK_DIR=/artwork
      - ARGOSY_SUBTITLE_DIR=/subtitles
      - ARGOSY_TRANSCODE_DIR=/transcode
      - ARGOSY_SCAN_INTERVAL=${ARGOSY_SCAN_INTERVAL:-15m}
      - ARGOSY_ADMIN_USERNAME=${ARGOSY_ADMIN_USERNAME:-admin}
      - ARGOSY_ADMIN_PASSWORD=${ARGOSY_ADMIN_PASSWORD}
      # Service-level secret for POST /api/v1/admin/accounts (ARGY-132);
      # Purser presents it as X-Provision-Token. Managed by Signet.
      - ARGOSY_PROVISION_TOKEN=${ARGOSY_PROVISION_TOKEN}
      # PIN-pairing LAN discovery (ARGY-123) can't advertise from this bridge
      # network — multicast never leaves it — so keep the mDNS advertiser off.
      # To enable discovery, switch this service to network_mode: host and set
      # ARGOSY_SERVER_NAME (drop the ports: mapping; the binary listens on 8096).
      - ARGOSY_DISABLE_MDNS=1
      - TMDB_API_READ_ACCESS_KEY=${TMDB_API_READ_ACCESS_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OPEN_SUBTITLES_API_KEY=${OPEN_SUBTITLES_API_KEY}
      - OPEN_SUBTITLES_USERNAME=${OPEN_SUBTITLES_USERNAME}
      - OPEN_SUBTITLES_PASSWORD=${OPEN_SUBTITLES_PASSWORD}
    volumes:
      - argosy_artwork:/artwork
      - argosy_subtitles:/subtitles
      - argosy_transcode:/transcode
      # Library 1 (NVMe): the original /data/media library. argosy is multi-library
      # (libraries table, per-row root_path) — ARGOSY_MEDIA_DIR is vestigial/unused.
      - ${ARGOSY_MEDIA_DIR_HOST:-/data/media}:/media:ro
      # Library 2 (2TB SATA SSD at /mnt/ssd_storage): active-acquisition shows
      # (24, Futurama S5-11, future grabs). Registered as a second `libraries` row
      # with root_path=/media-ssd. Read-only — only the Servarr stack writes here.
      - /mnt/ssd_storage/media:/media-ssd:ro
    devices:
      - /dev/dri   # Intel QSV / VAAPI hardware transcoding
    group_add:
      - "44"   # video
      - "993"  # render (host GID)
    networks:
      - construct_net
    depends_on:
      - postgres

  # --- TASK MANAGEMENT (Switchyard) ---
  # Backend (API only). Service name `switchyard` so agent URLs
  # (`http://switchyard:4002/v1/...`) resolve on construct_net.
  # No host port — only the frontend exposes one.
  switchyard:
    image: ghcr.io/einlanzerous/switchyard/backend:${SWITCHYARD_TAG:-latest}
    container_name: switchyard
    restart: unless-stopped
    environment:
      - PORT=4002
      - DATABASE_URL=postgres://switchyard_user:${SWITCHYARD_DB_PASSWORD}@postgres:5432/switchyard?sslmode=disable
      - PUBLIC_URL=${SWITCHYARD_PUBLIC_URL:-http://localhost:4002}
      - UPLOAD_DIR=/data/uploads
      - BOOTSTRAP_TOKEN=${SWITCHYARD_BOOTSTRAP_TOKEN}
      # External-ref poller credential. Dedicated fine-grained PAT, NOT the host
      # GITHUB_PAT: that one carries only `read:packages` for GHCR pulls, and a
      # token without repo read gets 404 (not 403) on every private-repo PR, so
      # the poller failed silently-but-loudly for weeks. Needs Pull requests:
      # Read + Contents: Read on every repo with attached refs. Unset/empty =>
      # poller logs "GITHUB_TOKEN unset — polling disabled" and attached refs
      # never refresh state (PR-merge auto-close stops firing). Serves as the
      # reconciliation backstop for repos without a push webhook configured.
      - GITHUB_TOKEN=${EXTERNAL_REF_POLLER}
      # Public GitHub webhook receiver — exposed via Tailscale Funnel at
      # https://imperial-construct.tail64150e.ts.net/v1/external/github.
      # HMAC gates all requests; absent secret = receiver returns 503.
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Wildcard prefix — match any <KEY>-<NUM> ticket reference in PR
      # titles/branches and resolve via the projects table. Strict "SWY"
      # works fine for a single project but doesn't scale to LOOP etc.
      - EXTERNAL_REF_KEY_PREFIX=*
      # Cloudflare Access SSO (SWY-161) — auto sign-in from the tunnel-injected
      # Cf-Access-Jwt-Assertion JWT. Both must be set or the endpoint returns
      # sso_disabled and the login page falls back to token paste. Values are
      # public identifiers (not secrets): AUD tag + team domain from the Zero
      # Trust dashboard. A CF-verified email must match a switchyard user's email.
      - CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      - CF_ACCESS_AUD=d3404fc362067f48ff1fd6c9a7fc9a1fd723510c2681feed15e35159649963de
      # The REMOTE MCP endpoint's audience, accepted here in ADDITION to the web
      # app's (SWY-260 / SERV-99). switchyard-mcp holds no token of its own and
      # forwards each caller's Cf-Access-Jwt-Assertion here verbatim
      # (mcp/src/http.ts) to exchange it for that person's API token — and those
      # JWTs carry the MCP application's AUD, because Access audiences are
      # per-application. Without this the exchange 401s on every remote tool call
      # while the whole edge looks correct: Access authenticates, the guard passes
      # the request, the MCP server verifies the assertion against its own AUD,
      # and only this last hop rejects it. The symptom is Claude reporting
      # "Authorization with Switchyard failed", and the only place it is visible
      # is a 401 on POST /v1/auth/sso/cloudflare in switchyard's log.
      #
      # It WIDENS and never enables: cfAccessConfig() returns null unless
      # CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD are both set, so this alone turns
      # nothing on. Must equal MCP_CF_ACCESS_AUD on the switchyard-mcp service —
      # the third place this one tag appears, after that variable and the
      # mcp.zerogravity.industries entry in cf-access-guard's CF_ACCESS_AUD_MAP.
      # check-edge-auth.sh cross-checks the other two against each other; it does
      # NOT know about this one, because it reasons about routers and hosts and
      # this is an application-level trust decision. Its sweep matches names
      # ENDING in CF_ACCESS_AUD, which this one does not — so a typo here fails
      # exactly as silently as the missing variable did, with every edge signal
      # green and only a 401 in switchyard's log. Tracked as SERV-161; until that
      # lands, this pair is checked by reading it.
      - CF_ACCESS_MCP_AUD=47cb76de601dfe7aa7aa657935a76940588ecf22c802ec100782f40804929466
      # Signet connector (SWY-165 / SERV-44). Signet is a host daemon, not a
      # container — reach it via host.docker.internal (see extra_hosts below).
      # Both vars absent => connector self-disables (Admin › Credentials hidden,
      # /v1/signet/* returns configured:false). Token must match the daemon's
      # SIGNET_API_TOKEN; it never reaches the browser (server-side proxy only).
      - SIGNET_BASE_URL=${SIGNET_BASE_URL:-http://host.docker.internal:4010}
      # Bare passthrough, NOT ${SIGNET_API_TOKEN}: the interpolated form always
      # sets the key, and Switchyard's env validation rejects a present-but-empty
      # token (min 8 chars) — which crash-loops the container before the Signet
      # connector ever gets to self-disable. Bare syntax omits the key entirely
      # when unset and still reads the value from .env once provisioned.
      - SIGNET_API_TOKEN
      # Amber capture archive (SWY-209 / AMBR-9). Supplies the docket's CAPTURE
      # SEAM — the boundary between prompt-only history and full-session capture —
      # to GET /v1/docket/seam. BOTH vars must reach the container or the seam
      # reports configured:false and /docket/monthly renders "Amber is not
      # configured"; there is deliberately no fallback seam date anywhere in
      # Switchyard, because a hardcoded one would silently lie the moment capture
      # changed. Amber is in-container on construct_net, so the default is just
      # the service name and no .env entry is needed for the URL.
      - AMBER_BASE_URL=${AMBER_BASE_URL:-http://amber:4008}
      # Bare passthrough for the same reason as SIGNET_API_TOKEN above, and the
      # value is Amber's OWN token — the one its service block already
      # interpolates from this same .env. Amber gates all of /v1 behind a single
      # token rather than one per consumer, so Switchyard presenting it is the
      # intended design and not a shortcut — but it is a deliberate deviation
      # from PRINCIPLES.md §4 ("never share a token across components; mint
      # per-consumer, scope minimally"), and the cost of it belongs here rather
      # than in a PR nobody rereads: this token also reads GET /v1/prompts, so a
      # Switchyard compromise reads the whole archived prompt corpus, not just
      # the capture seam. Narrowing it is Amber's to do — there is no scoped
      # credential to hand over today. Note Amber fails CLOSED: with no token
      # set on its side, every /v1 route 503s rather than opening.
      - AMBER_API_TOKEN
      # Which project trees are NOT this operator (SWY-334 / AMBR-25). Every
      # prompt-derived docket instrument drops prompts whose project_slug starts
      # with one of these; empty means exclude nothing, and on this host that is
      # the wrong answer rather than a neutral one.
      #
      # The self-hosted CI runners check repos out under
      # `~/runners/<repo>/_work/…`, and the PR-review agent's system prompt lands
      # there as an ordinary `user` turn — 625 of them since 2026-08-03,
      # averaging ~9,976 bytes against an operator median near 110, and 624 of
      # August's 874 sessions. Unfiltered, August's `prompt_len_p90` reads
      # **10,054**; filtered it reads **2,215**. So the unfiltered number is not
      # noisy, it is confidently wrong by 4.5x, and it would be stored as a
      # reading that outlives the run that made it.
      #
      # Amber deliberately applies no default of its own — it does not know which
      # trees are people, and choosing for the caller is the judgement that
      # service does not make. Which is why this line has to exist HERE.
      - AMBER_EXCLUDE_PROJECT_PREFIXES=${AMBER_EXCLUDE_PROJECT_PREFIXES:--home-magos-runners-}
      # Promote dispatch credential (SERV-104 — SERV-78 piece 3). What lets
      # Switchyard's promote gate (SWY-188) trigger promote.yml over the API
      # instead of linking a human out to the Actions tab:
      #
      #   POST /repos/Einlanzerous/construct-server/actions/workflows/promote.yml/dispatches
      #   {"ref":"main","inputs":{"service":…,"version":…,"kind":…,"reason":…}}
      #
      # THE DISPATCH IS A REQUEST, NOT AN EXECUTION, and that is the whole reason
      # handing a container a PAT is acceptable here. promote.yml runs under the
      # `production-promote` environment, which carries a required reviewer — and it
      # ASSERTS that gate exists rather than trusting it, because GitHub creates a
      # missing environment unprotected on first use. So this token cannot move a
      # version; it can only put a promote in front of a human. That is the property
      # to re-check before widening anything here, not the token's scope.
      #
      # Its OWN credential, not a shared one. SERV-78 argued that from SERV-3, SERV-4
      # and LOOP-28 — three separate incidents where one PAT spread across consumers
      # broke a consumer by scope. It is distinct from all three GitHub credentials
      # already in play: GITHUB_PAT is `read:packages` for GHCR pulls,
      # EXTERNAL_REF_POLLER is PR read for the ref poller above, and
      # PROMOTE_PUSH_TOKEN is `contents: write` held by the workflow — not by any
      # container, and deliberately not by this one.
      #
      # Scope is `Actions: Read and write` on Einlanzerous/construct-server and
      # nothing else. Record what that necessarily includes, because GitHub offers
      # nothing narrower than repo-wide and a reader will otherwise assume this token
      # reaches one workflow: it also dispatches deploy.yml, deploy-dev.yml,
      # deploy-signet.yml, wiki.yml and verify.yml, and it can cancel runs and delete
      # run logs. Bounded rather than harmless — each of those converges the box to
      # `main` rather than changing what `main` is, and `contents` is NOT granted, so
      # this token cannot write the pin it is asking to have written.
      #
      # THE ENTRY THAT WOULD BREAK THE CLAIM ABOVE IS APPROVING ITS OWN GATE, and it is
      # NOT reachable. `POST /actions/runs/{id}/pending_deployments` sits in this same
      # `actions` namespace, and this repo's production-promote environment is unusually
      # exposed to it: one required reviewer (Einlanzerous), `prevent_self_review: false`,
      # and a PAT-dispatched run whose actor IS that account. So a token that could review
      # its own pending deployment would dispatch a real version and approve it, and the
      # sentence above would be false. Probed with the live credential rather than reasoned
      # about, because the answer is not derivable from the permission name:
      #
      #   GET  …/pending_deployments -> 200, "current_user_can_approve": true
      #   POST …/pending_deployments -> 403 "Resource not accessible by personal access token"
      #
      # Fine-grained PATs are refused that endpoint outright, whatever `actions` says. Note
      # the trap in the pair: the GET answers 200 and reports approval as possible, because
      # that field describes the USER the token belongs to and not the token. Reading only
      # the GET would have confirmed the vulnerability that does not exist. If GitHub ever
      # opens that endpoint to fine-grained PATs, this comment is the one to revisit first —
      # `prevent_self_review: true` would NOT be the fix, since with a single reviewer who
      # is also the only person dispatching by hand it blocks every ordinary promote too.
      #
      # Bare passthrough for the same reason as SIGNET_API_TOKEN above, plus one that
      # matters while SWY-188 is unbuilt: the interpolated form always sets the key,
      # so a host without this provisioned would hand Switchyard an empty string, and
      # an empty credential is not a credential (the CLAUDE.md invariant). Absent, the
      # promote gate degrades to the link-out it is today.
      #
      # ABSENT is the operative word, and it is not the same as blank. Bare passthrough
      # drops the key only when it is missing from the environment entirely; a line
      # reading `PROMOTE_DISPATCH_TOKEN=` in the env file is present-and-empty and IS
      # delivered, as `""`. That is why .env.example leaves this key commented out
      # rather than spelled out empty like most of its neighbours.
      #
      # Verify the grant took with `make promote-dispatch-check` — do not infer it
      # from `signet sync`. SGNT-29 is the bug where a fine-grained PAT grant 403'd in
      # use while the sync check called it healthy, and a fine-grained PAT with no
      # repo grant answers 404 rather than 403, the same shape that hid
      # EXTERNAL_REF_POLLER's missing scope for weeks.
      - PROMOTE_DISPATCH_TOKEN
    # Container-to-host bridge so the connector above can reach the Signet
    # daemon bound to 127.0.0.1:4010 on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # `signet` resolving to the host is what lets the delivery reconciler
      # observe signet at all (SERV-128). Signet is a HOST daemon with no
      # container, so it has no name on construct_net — and the reconciler
      # builds every probe URL from prod's host_template, `http://{service}:{port}`.
      # For a service registered as `signet` with port 4010 that is
      # `http://signet:4010/healthz`, which resolves only with this alias.
      #
      # A per-pair `host_override` column exists for exactly this shape and is
      # NOT usable here: it lives on `service_environments`, that row is not
      # created until the first probe, and no API writes it — so an override
      # could only ever be set after the wrong address had already been tried
      # and recorded. The alias sets the address right the first time.
      #
      # This adds no reach that was not already deliberate. Signet binds
      # 172.17.0.1 itself, on purpose, so containers can call it — its Serve()
      # refuses to start if the docker-bridge bind fails, precisely so it cannot
      # come up answering the host while refusing every container. Switchyard
      # already calls it through host.docker.internal above for the credentials
      # connector; this is the same daemon on the same port under the name the
      # ledger knows it by.
      - "signet:host-gateway"
    volumes:
      - switchyard_uploads:/data/uploads
    networks:
      - construct_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4002/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - postgres

  # Frontend (Vue static + tiny Bun passthrough for /v1/* and /healthz).
  switchyard-frontend:
    image: ghcr.io/einlanzerous/switchyard/frontend:${SWITCHYARD_TAG:-latest}
    container_name: switchyard-frontend
    restart: unless-stopped
    ports:
      - "${SWITCHYARD_PORT:-4002}:4002"
    environment:
      - PORT=4002
      - BACKEND_URL=http://switchyard:4002
    networks:
      - construct_net
    depends_on:
      switchyard:
        condition: service_healthy

  # Remote MCP transport (SERV-99 / SWY-260). The same Switchyard tool surface the
  # local stdio MCP serves, over Streamable HTTP, so a HOSTED Claude surface can
  # reach it — those connect from Anthropic's cloud, not from the user's device, so
  # a stdio server on this box is unreachable to them by construction.
  #
  # A SIBLING CONTAINER, not a second process in switchyard: one container, one
  # process. It ships from switchyard's own repo as a third image on the SAME
  # release train as backend and frontend, so it pins on SWITCHYARD_TAG and needs no
  # variable of its own — the one-variable-per-source-repo convention in
  # versions.env. Note what that now implies for rollback: verify-tag.sh checks
  # EVERY image behind a pin, and the mcp image's floor is 4.18 (SWY-260 landed in
  # 4.18.0). A promote of SWITCHYARD_TAG below that is refused rather than
  # half-deployed, which is the correct direction but is a floor that did not exist
  # before this service did.
  #
  # NO SWITCHYARD TOKEN HERE, deliberately, and it is the whole point of the design.
  # Every HTTP session exchanges its own Cloudflare Access assertion at
  # POST /v1/auth/sso/cloudflare (SWY-161) for the token of the real person behind
  # it, so a tool call from Claude lands in Switchyard attributed to that user. A
  # single shared service token would make every remote call anonymous-but-privileged
  # — the god token PRINCIPLES.md §4 forbids — and the image refuses to read one at
  # all (mcp/src/httpEnv.ts disables the env-client fallback).
  #
  # No published port, for the same reason as switchyard's backend and the wiki: the
  # only route in is the tunneled Traefik router on the unpublished `internal`
  # entrypoint, gated by Cloudflare Access at the edge AND by cf-access-guard at the
  # origin. There is no host binding to bypass either with.
  switchyard-mcp:
    image: ghcr.io/einlanzerous/switchyard/mcp:${SWITCHYARD_TAG:-latest}
    container_name: switchyard-mcp
    restart: unless-stopped
    environment:
      - MCP_HTTP_PORT=4080
      # The REST API, not the frontend: this speaks to /v1 directly, and the SSO
      # exchange above is an API call. Same address switchyard's own agents use.
      - SWITCHYARD_URL=http://switchyard:4002
      # Public identifiers, not secrets — the same reasoning (and the same team
      # domain) as the CF_ACCESS_* pairs switchyard, lyceum, chronicle and
      # cf-access-guard already carry. Keeping them tracked makes an Access
      # application change a reviewable diff.
      - CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      # THIS APPLICATION'S OWN AUD, and deliberately not named CF_ACCESS_AUD: Access
      # audiences are per-application, every token on the team domain is signed by the
      # same key, and this endpoint is its own application. Sharing an env file with
      # the API server must not make the two collide — which is exactly why the image
      # reads MCP_CF_ACCESS_AUD and would ignore a CF_ACCESS_AUD sitting beside it.
      # Must match the mcp.zerogravity.industries entry in cf-access-guard's
      # CF_ACCESS_AUD_MAP below; check-edge-auth.sh asserts every service-side AUD
      # appears somewhere in that map.
      #
      # REQUIRED — the process throws at boot without it rather than starting up
      # unable to fail closed, so an unset value crash-loops this container instead of
      # serving the tool surface unauthenticated. That is the CLAUDE.md
      # empty-variable invariant working as intended: skip loudly, never substitute.
      - MCP_CF_ACCESS_AUD=47cb76de601dfe7aa7aa657935a76940588ecf22c802ec100782f40804929466
      # Configured, never derived from the Host header. It feeds the
      # `WWW-Authenticate: Bearer resource_metadata="…"` pointer a client follows to
      # discover the authorization server, and Host is attacker-controlled on the
      # internal entrypoint — deriving it would let a forged Host aim a client's
      # OAuth discovery at someone else's origin. The /mcp path is part of it: it is
      # the endpoint clients POST to and the path the router serves.
      - MCP_PUBLIC_URL=https://mcp.zerogravity.industries/mcp
    networks:
      - construct_net
    healthcheck:
      # Probes the HTTP surface the container exists to serve, on the port it is
      # actually serving on — not `bun --version` or any other new-process check that
      # proves the binary is in the image and nothing about the server (SERV-156).
      # /healthz is deliberately bare and unauthenticated: it leaks no subsystem
      # detail, and a probe that needed a Cloudflare assertion could never pass.
      # Mirrors the HEALTHCHECK the image already ships; restated here because compose
      # is where this stack's health story is readable.
      #
      # Proven to FAIL, which is the half you cannot learn from it passing (SERV-156):
      # against mcp:4.29 this exact command exits 1 in a bare container with nothing
      # listening on 4080, and 0 once the server is up. `wget` is /usr/bin/wget in the
      # image, so the probe is not silently a shell no-op. Booting with no
      # MCP_CF_ACCESS_AUD was checked at the same time and throws in loadHttpEnv
      # rather than starting degraded, which is what makes the REQUIRED note above a
      # statement about observed behaviour and not about intent.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      # Ordering plus a health gate, mirroring switchyard-frontend: with the API down
      # every session initialize would fail its token exchange anyway. Compose follows
      # depends_on, so scope a single-service recreate with --no-deps (SERV-63) —
      # `make recreate svc=switchyard-mcp` bakes that in.
      switchyard:
        condition: service_healthy

  # --- NEWSLETTER CURATION (Centrifuge) ---
  # Single image carrying the HTTP API and the decoupled scoring worker.
  # Migrations run in the entrypoint (`centrifuge migrate`) against the
  # centrifuge DB that db/init-db.sh provisions; restart: unless-stopped covers
  # the first-boot race where that DB isn't created until the deploy's init-db
  # step runs after `up -d`. Scoring calls the in-stack ollama by service name.
  centrifuge-backend:
    image: ghcr.io/einlanzerous/centrifuge/backend:${CENTRIFUGE_TAG:-latest}
    container_name: centrifuge-backend
    restart: unless-stopped
    ports:
      - "${CENTRIFUGE_PORT:-4003}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://centrifuge_user:${CENTRIFUGE_DB_PASSWORD}@postgres:5432/centrifuge?sslmode=disable
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${CENTRIFUGE_OLLAMA_MODEL:-gemma4:31b}
      - INGEST_TOKEN=${CENTRIFUGE_INGEST_TOKEN}
      - RELEVANCE_TOPICS=${CENTRIFUGE_RELEVANCE_TOPICS:-AI engineering,urbanism,transit/trains,nuclear,tech,video games}
      # Absolute base URL stamped into /feed.xml links; blank => derived per request.
      - PUBLIC_BASE_URL=${CENTRIFUGE_PUBLIC_BASE_URL:-}
      - LOG_LEVEL=${CENTRIFUGE_LOG_LEVEL:-info}
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Vue reading UI for Centrifuge: nginx serves the SPA and proxies /api and
  # /feed.xml to the centrifuge backend (same-origin, no CORS). CENTRIFUGE_UPSTREAM
  # points nginx at the backend service; nginx resolves it lazily so the UI
  # survives the backend restarting. Built+pushed from the same release as the
  # backend (CTFG-38).
  centrifuge-frontend:
    image: ghcr.io/einlanzerous/centrifuge/frontend:${CENTRIFUGE_TAG:-latest}
    container_name: centrifuge-frontend
    restart: unless-stopped
    ports:
      - "${CENTRIFUGE_WEB_PORT:-4004}:8080"
    environment:
      - CENTRIFUGE_UPSTREAM=centrifuge-backend:8080
    networks:
      - construct_net
    depends_on:
      - centrifuge-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- LYCEUM (self-hosted ebook reader + sync) — LYCM-61 ---
  # One Go binary serving the JSON API *and* the embedded Vue reader SPA
  # same-origin (image published by the lyceum repo). Shared Postgres; EPUB/cover
  # blobs on a named volume; folder-ingest watches the acquisition books library
  # read-only. Native apps (Android/Windows) + the browser reader all hit :4005.
  lyceum:
    image: ghcr.io/einlanzerous/lyceum:${LYCEUM_TAG:-latest}
    container_name: lyceum
    restart: unless-stopped
    ports:
      - "${LYCEUM_PORT:-4005}:4005"
    environment:
      - LYCEUM_ADDR=:4005
      - LYCEUM_DATABASE_URL=postgres://lyceum_user:${LYCEUM_DB_PASSWORD}@postgres:5432/lyceum?sslmode=disable
      - LYCEUM_DATA_DIR=/data/blobs
      # Household accounts (LYCM-804). With this on, the reader core requires a
      # signed-in user; with it off (the default) every request is served as the
      # owner. OWNER_EMAIL lands the operator's identity on the seeded owner row.
      # Both come from PROD_ENV_FILE. Turning AUTH on locks out any client that
      # can't sign in yet — do it only once the phones are on an accounts build.
      - LYCEUM_AUTH=${LYCEUM_AUTH:-false}
      - LYCEUM_OWNER_EMAIL=${LYCEUM_OWNER_EMAIL:-}
      - LYCEUM_OWNER_NAME=${LYCEUM_OWNER_NAME:-}
      # Cloudflare Access SSO (LYCM-803) — auto sign-in from the tunnel-injected
      # Cf-Access-Jwt-Assertion JWT, mirroring switchyard (SWY-161). Both must be
      # set or the endpoint stays disabled. Values are public identifiers (not
      # secrets): team domain + the Access application's AUD tag from the Zero
      # Trust dashboard. A CF-verified email must match a lyceum user's email;
      # unknown emails are refused, never auto-provisioned.
      - CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      - CF_ACCESS_AUD=e9bace230db8a112935e8d931393424390c840e0c58af7b8ccda21cb60e68850
      # Folder ingest: EPUBs dropped into the mounted books library are ingested
      # like an /upload. Absorbs LYCM-57 (prod must set the watch dir).
      - LYCEUM_BOOKS_WATCH_DIR=/books
      - LYCEUM_BOOKS_WATCH_INTERVAL=${LYCEUM_BOOKS_WATCH_INTERVAL:-15}
      # Canonical cover fetch (Apple Books/iTunes) fills poor embedded covers.
      - LYCEUM_COVER_FETCH=${LYCEUM_COVER_FETCH:-true}
      # CORS for cross-origin native shells (Wails desktop). Blank => same-origin
      # web build only, which sends no Origin.
      - LYCEUM_CORS_ORIGINS=${LYCEUM_CORS_ORIGINS:-}
      # Optional Eidolon/delivery API tokens + Send-to-Kindle SMTP (LYCM-40x).
      # Unset => those features stay disabled.
      - LYCEUM_API_TOKENS=${LYCEUM_API_TOKENS:-}
      - LYCEUM_SMTP_HOST=${LYCEUM_SMTP_HOST:-}
      - LYCEUM_SMTP_PORT=${LYCEUM_SMTP_PORT:-587}
      - LYCEUM_SMTP_USERNAME=${LYCEUM_SMTP_USERNAME:-}
      - LYCEUM_SMTP_PASSWORD=${LYCEUM_SMTP_PASSWORD:-}
      - LYCEUM_SMTP_FROM=${LYCEUM_SMTP_FROM:-}
      - LYCEUM_KINDLE_ADDR=${LYCEUM_KINDLE_ADDR:-}
      # Bindery acquirer (LYCM-76): a confirmed "wanted" ISBN triggers a real
      # grab via Bindery's searchOnAdd. Base URL defaults to Bindery's
      # host-published port (reachable from construct_net); override via .env if
      # the host IP changes. The API key must be set in PROD_ENV_FILE — without
      # both, Lyceum falls back to the no-op acquirer (records "wanted" only).
      - LYCEUM_BINDERY_BASE_URL=${LYCEUM_BINDERY_BASE_URL:-http://10.0.0.45:8787}
      - LYCEUM_BINDERY_API_KEY=${LYCEUM_BINDERY_API_KEY:-}
    volumes:
      - lyceum_data:/data/blobs
      # Books library to fold-ingest, read-only (defaults alongside argosy media).
      - ${LYCEUM_BOOKS_DIR_HOST:-/data/media/books}:/books:ro
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4005/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- ASR (shared estate transcription service) — SERV-156 / CHRN-82 ---
  # Adapted from asr/deploy/compose.asr.yml in the chronicle repo, which is where
  # this shape stays reviewable. Chronicle is client one; Catenary is invited as
  # client two (CHRN-29), which is why this is an estate service on its own
  # database rather than a package inside Chronicle.
  #
  # Half of this block is a property of THIS MACHINE rather than of the service —
  # which render node, which group, where the models live — settled by CHRN-24.
  #
  # NOT provisioned by db/init-db.sh, the same exception chronicle above carries:
  # its role and database come from asr/deploy/provision-db.sh in chronicle's
  # repo, run once as superuser under `signet exec`. A cold host rebuild does not
  # self-heal it and asr will crash-loop until that script is run.
  asr:
    image: ghcr.io/einlanzerous/estate-asr:${ASR_TAG:-latest}
    container_name: asr
    restart: unless-stopped
    # The image's ENTRYPOINT is whisper-cli so that CHRN-12's benchmark harness
    # runs through it unmodified and the published numbers keep comparing to
    # something. The service overrides it here, visibly, rather than by changing
    # what the image is.
    entrypoint: ["/usr/local/bin/asrd"]
    command: ["serve"]
    # No `ports:`. Reached container-to-container on construct_net. Publishing a
    # port would put a transcription queue on the host for anything that can
    # reach it — and whisper-server, the resident child, has no auth at all.
    expose:
      - "4011"
    # renderD129 is the R9700; renderD128 is the CometLake iGPU. Confirmed from
    # /sys/class/drm/*/device/uevent rather than assumed from the numbering,
    # which reads the wrong way round on this box:
    #   renderD128 -> i915   0000:00:02.0
    #   renderD129 -> amdgpu 0000:03:00.0   <- Navi 48
    # Passing only the R9700 means the iGPU is not in the container to be
    # enumerated at all, so GGML_VK_VISIBLE_DEVICES is a second belt rather than
    # the only thing between this and a 20x slower device.
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
    # The render node is root:render 0660. 993 is THIS HOST's render gid
    # (`getent group render`) — a host fact, not a portable constant.
    #
    # It changes nothing TODAY: estate-asr sets no USER, so the process is uid 0
    # and root bypasses the mode bits. It is here for the moment the image drops
    # privileges, which is the change that would otherwise break GPU access with
    # no edit to this file. So do NOT read it as the first thing to check when
    # the container reports no Vulkan device — while the process is root it
    # cannot be the cause. Check the device passthrough above and the ggml line
    # in the logs instead (`Found N Vulkan devices` / `matrix cores`).
    group_add:
      - "993"
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - ASR_PORT=4011
      - ASR_DATABASE_URL=postgres://asr:${ASR_DB_PASSWORD}@postgres:5432/asr?sslmode=disable
      # `name:token` pairs, out of Signet, never written here. Empty is a BOOT
      # ERROR rather than an open service: client_id is derived from the token
      # and nothing else, because CHRN-26 queues per client for fairness and a
      # client-asserted identity would let either service jump the other's queue.
      # asrd also refuses a token under 32 characters.
      - ASR_CLIENT_TOKENS=${ASR_CLIENT_TOKENS}
      - ASR_DEFAULT_MODEL=${ASR_DEFAULT_MODEL:-small.en}
      # CHRN-26. What the advisory lock names, and what lands in leased_by — per
      # DEVICE, never per deployment. A second card is a second value here and
      # not a redesign; two asrd processes naming the SAME device still exclude
      # each other, which is the redeploy case the lock exists for.
      - ASR_DEVICE_ID=${ASR_DEVICE_ID:-r9700}
      # The resident child. Loopback only: whisper-server has no authentication
      # of any kind, so a listener on construct_net that transcribes anything
      # sent to it would make ASR_CLIENT_TOKENS decorative. Deliberately not in
      # `expose:` for the same reason.
      - ASR_WHISPER_SERVER_ADDR=127.0.0.1:8081
      - ASR_LOG_LEVEL=${ASR_LOG_LEVEL:-info}
      - ASR_LOG_FORMAT=${ASR_LOG_FORMAT:-json}
      # Recorded on every result alongside the model: a corpus transcribed by two
      # different backends over time is one whose quality varies invisibly.
      - ASR_BACKEND=vulkan
    healthcheck:
      # An HTTP GET of /healthz, NOT `asrd version`, which the upstream fragment
      # used. `asrd version` prints a string and exits 0 from a bare container
      # with no GPU, no database, no config and no server — verified — so it
      # reports healthy for a wedged process for ever. CLAUDE.md's rule is that a
      # healthcheck must be able to FAIL, and scripts/assert-healthy.sh (the
      # SERV-102 post-deploy gate) is what consumes this answer.
      #
      # /healthz and not /readyz, which the upstream comment already argued for
      # and the upstream test did not do: /readyz answers unready for a standby,
      # and a standby is a correct state — restarting it would restart the
      # healthy half of a redeploy. Liveness is the only question a restart is
      # the answer to.
      #
      # bash's /dev/tcp rather than curl: the image ships no curl, wget, nc,
      # python or busybox (checked). `sh` is dash and has no /dev/tcp, so bash is
      # named explicitly. `$$` escapes compose interpolation.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4011
          && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3
          && read -r line <&3
          && case "$$line" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac
      interval: 30s
      timeout: 5s
      retries: 3
      # The resident loads a model onto the GPU at boot. /healthz is liveness and
      # should answer before that finishes, but a cold Vulkan init is not instant
      # and an unhealthy first minute would be noise.
      start_period: 60s
    depends_on:
      - postgres
    networks:
      - construct_net
    volumes:
      # The model store, READ-ONLY. asrd says so at boot if it finds nothing
      # here; without it every submit is a 400 naming a model the deployment does
      # not have, and nothing in that 400 points at an unmounted volume.
      #
      # An ABSOLUTE default rather than the upstream fragment's `~/tools/...`.
      # Compose does expand `~` (tested), but to the home of whoever invokes it,
      # and prod compose runs from /opt/construct-server under the self-hosted
      # runner's systemd service. An absolute path cannot drift with $HOME.
      - ${ASR_MODELS_DIR:-/home/magos/tools/whisper.cpp/models}:/opt/whisper/models:ro

  # --- CHRONICLE (voice-note ingestion → notes & discussion wiki) — CHRN-16 ---
  # Memos captured by phone, transcribed on the shared ASR service, routed by the
  # Scribe into a note / ticket / discussion. Served on TWO hosts off one backend,
  # the same split Lyceum uses (SERV-60): chronicle.… is tunneled and Access-gated
  # for the browser, chronicle-direct.… is on the WAN entrypoint for the Android
  # app and MCP, which hold a bearer session and cannot do browser SSO.
  #
  # No `ports:`. Reached only through Traefik; publishing a port here would put a
  # listener on the host and bypass the edge entirely.
  # NOT provisioned by db/init-db.sh. Chronicle's database needs TWO roles
  # (chronicle, chronicle_tier1) and the grant that enforces its tier-1/tier-2
  # boundary, so it is created by deploy/provision-db.sh in chronicle's own repo —
  # run once, by hand, as superuser. Consequence worth knowing: a cold host rebuild
  # does NOT self-heal this the way init-db.sh does for everything else, and
  # chronicle will crash-loop until that script is run.
  # See github.com/Einlanzerous/chronicle (deploy/README.md is the runbook).
  chronicle:
    image: ghcr.io/einlanzerous/chronicle:${CHRONICLE_TAG:-latest}
    container_name: chronicle
    restart: unless-stopped
    environment:
      - CHRONICLE_PORT=4009
      - CHRONICLE_DATABASE_URL=postgres://chronicle:${CHRONICLE_DB_PASSWORD}@postgres:5432/chronicle?sslmode=disable
      - CHRONICLE_LOG_LEVEL=${CHRONICLE_LOG_LEVEL:-info}
      - CHRONICLE_LOG_FORMAT=${CHRONICLE_LOG_FORMAT:-json}
      - CHRONICLE_SHUTDOWN_GRACE=${CHRONICLE_SHUTDOWN_GRACE:-20s}
      # Auth is unconditional (CHRN-71) — there is no flag to leave off — so the
      # owner identity is REQUIRED to serve. Unset, the service refuses to boot
      # rather than keeping migration 0002's placeholder, which could never match
      # an Access-verified email and would leave SSO looking configured and
      # silently never working.
      - CHRONICLE_OWNER_EMAIL=${CHRONICLE_OWNER_EMAIL}
      - CHRONICLE_OWNER_NAME=${CHRONICLE_OWNER_NAME:-}
      # Access SSO. Chronicle verifies the assertion ITSELF against the JWKS
      # rather than trusting the header the edge injects, so a dropped
      # strip-cf-access on the direct router cannot forge an identity.
      #
      # Both are literals and must move together: config.Load errors when exactly
      # one of the pair is set, so a literal AUD beside an empty ${...} team
      # domain crash-loops the container before migration 0002 ever applies. The
      # AUD must equal this host's CF_ACCESS_AUD_MAP entry on cf-access-guard.
      # check-edge-auth.sh asserts every service-side AUD appears SOMEWHERE in the
      # map — set membership, not per-host agreement, so it catches a value that is
      # in no entry but would not catch two services' AUDs being swapped.
      - CHRONICLE_CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      - CHRONICLE_CF_ACCESS_AUD=48bc1ca35a8a6bcf17c242cac59e209a53e58e5213b1656c82d3053df062f1ec
      # The origin baked into an invite's sign-in QR. MUST be the direct host: a
      # link built from the Access-gated hostname walks a phone into an SSO wall
      # a bearer token cannot open.
      - CHRONICLE_MOBILE_BASE_URL=https://chronicle-direct.zerogravity.industries
      # NOT derived from the request: TLS terminates at Traefik, so the app never
      # sees a TLS connection and deriving it would drop Secure off a durable
      # credential on the WAN-facing entrypoint.
      - CHRONICLE_COOKIE_SECURE=${CHRONICLE_COOKIE_SECURE:-true}
      # Whose X-Forwarded-For the sign-in rate limiter may believe (CHRN-75,
      # SERV-148). Not a CIDR list any more, and the reason is worth keeping: the
      # question is "did this request come through our edge", and on this network
      # THE PEER ADDRESS CANNOT ANSWER IT. construct_net is `external:` with
      # default IPAM, so Traefik takes a DHCP address there by allocation order
      # alone and nothing distinguishes it from the seventeen other containers.
      # The retired CHRONICLE_TRUSTED_PROXIES defaulted to 172.16.0.0/12, which
      # CONTAINS construct_net (172.19.0.0/16) — so every neighbour was a trusted
      # proxy and could pick its own rate-limit bucket by writing a header.
      #
      # A shared secret answers that one question. Traefik stamps this value on
      # X-Chronicle-Proxy-Secret via `customRequestHeaders`, which OVERWRITES
      # whatever the caller sent — the same mechanism strip-identity-headers
      # relies on — so through Traefik the header is honest however it arrived,
      # and around Traefik a neighbour keeps only its own forgery. Chronicle
      # COMPARES it in constant time and never presence-tests it: a direct
      # neighbour arrives with the header present and wrong, so treating "set" as
      # "trusted" would reintroduce the whole defect in a new spelling.
      #
      # What Chronicle then reads is trustworthy for a second reason: the `public`
      # entrypoint sets `forwardedHeaders.trustedIPs: []`, so Traefik discards a
      # caller's X-Forwarded-For and writes the peer address itself. The secret
      # says the chain came from us; that setting is why it has one honest entry.
      #
      # The same variable is on the traefik service below — one value, two
      # readers, both from PROD_ENV_FILE. If they disagree, or if this is empty,
      # Chronicle ignores X-Forwarded-For and every WAN sign-in shares one
      # bucket: blunt but safe, and it says so in the log rather than failing.
      - CHRONICLE_PROXY_SECRET=${CHRONICLE_PROXY_SECRET:-}
      # CHRN-23. Where memo audio lives. The in-container path is deliberately
      # the SAME as the host path, so a path in a log line means one thing
      # wherever it is read. /data is the NVMe.
      #
      # Chronicle does NOT create this, and REFUSES TO BOOT if it is missing or
      # is not a directory. That is the right way round: a typo'd path springing
      # into existence is how the corpus ends up on the container's writable
      # layer, which looks like it works right up until a redeploy takes the
      # audio with it. So the mkdir below is a prerequisite of the deploy, not
      # a tidy-up after it.
      #
      # It is also the switch for the app's own upload path: set, POST
      # /memos/uploads serves; unset, all four upload routes answer 503 naming
      # this variable and GET /admin/storage reports no corpus.
      - CHRONICLE_AUDIO_DIR=/data/chronicle/audio
      # CHRN-19. The Copyparty-fed inbox, ONE SUBDIRECTORY PER ACCOUNT named
      # after the account's UUID. A file carries no identity of its own and
      # tier2.memos.author_id is NOT NULL, so the directory is the only thing
      # that can supply an author — which is why the watcher creates no
      # directories and ignores any that does not name an existing account.
      #
      # Set WITHOUT CHRONICLE_AUDIO_DIR the service refuses to start: a watcher
      # with nowhere to copy recordings to would record memos whose audio is
      # immediately missing. The two move together.
      #
      # Copyparty does NOT serve this yet — copyparty.conf publishes exactly one
      # volume, [/] -> /w/hdd/media — so the watcher runs against an inbox
      # nothing fills, costing one readdir per interval. Publishing it is a
      # separate decision rather than an oversight: that config is
      # `accs: rwmd: *`, anonymous and gated only by Tailscale, so anyone on the
      # tailnet could drop a file into any account's directory and have the memo
      # attributed to them. Chronicle's authenticated upload endpoint is the
      # alternative.
      - CHRONICLE_INBOX_DIR=/data/chronicle/inbox
      # These restate internal/watch's own defaults (5s and 10s), the way
      # CHRONICLE_SHUTDOWN_GRACE above restates config.Load's. Settle is how
      # long a file must be untouched before it is read — one of three guards
      # against reading a half-written upload, and not the one that guarantees
      # anything (the re-stat after the copy is). Raise it for a slow sync
      # client: worst case from written to a memo row is settle + interval.
      - CHRONICLE_WATCH_INTERVAL=${CHRONICLE_WATCH_INTERVAL:-5s}
      - CHRONICLE_WATCH_SETTLE=${CHRONICLE_WATCH_SETTLE:-10s}
      # SERV-156. The transcription pump. Until these were set chronicle booted
      # with the pump OFF and logged its remedy line — correct and safe, and it
      # meant nothing transcribed and nothing pruned.
      #
      # VALIDATED AS A PAIR at boot: one without the other is a refusal, not a
      # half-configured pump. CHRONICLE_AUDIO_DIR above is a third requirement —
      # a pump with nowhere to read recordings from is refused too.
      #
      # The token must match the `chronicle:` entry in the asr service's
      # ASR_CLIENT_TOKENS. Both come out of Signet and neither is written here;
      # they are two keys carrying one value because the pair is what the ASR
      # side derives client_id from.
      - CHRONICLE_ASR_URL=http://asr:4011
      - CHRONICLE_ASR_TOKEN=${CHRONICLE_ASR_TOKEN}
    volumes:
      # rw: the only durable store for tier-2 audio, which nothing regenerates.
      # BOTH subdirectories must exist on the host before chronicle is next
      # recreated, or it refuses to boot (see CHRONICLE_AUDIO_DIR above):
      #   mkdir -p /data/chronicle/audio /data/chronicle/inbox
      # No sudo — /data is magos-owned — but only while nothing else got here
      # first: the Docker daemon creates a missing bind source as ROOT, and then
      # that mkdir fails with Permission denied in exactly the state that needs
      # it. So the real guard is the ansible task that claims this path before
      # compose sees it, with a cheap mkdir in deploy.yml for the warm host that
      # has not re-run ansible; the line above is the manual fallback.
      #
      # Ownership is not the gate today in the other direction either:
      # chronicle's Dockerfile sets no USER, so the process is root inside the
      # container. If that changes, the failure is a write error on ingest
      # rather than at boot, so it would not be caught by the checks here.
      - /data/chronicle:/data/chronicle
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      # /healthz takes no dependencies, so this reports on the process only.
      # Readiness (which pings Postgres) is deliberately NOT the healthcheck:
      # restarting the container is the wrong remedy for a database blip.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4009/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Docker's 10s default would kill in-flight ingest on redeploy, which loses
    # memos. Must exceed CHRONICLE_SHUTDOWN_GRACE.
    stop_grace_period: 30s

  # --- PURSER (cross-service provisioning & invite service) — SERV-33 ---
  # One command onboards a person into multiple services: creates their Switchyard
  # user + token and grants Cloudflare Access SSO, returning a copy-pasteable
  # credential block (or emailing it). Tunnel-internal / CLI tool, no public
  # hostname. Presents its own scoped Switchyard token rather than the instance
  # bootstrap admin one (PRSR-25). See github.com/Einlanzerous/purser.
  purser:
    image: ghcr.io/einlanzerous/purser:${PURSER_TAG:-latest}
    container_name: purser
    restart: unless-stopped
    ports:
      - "${PURSER_PORT:-4006}:4006"
    environment:
      - PURSER_ADDR=:4006
      - PURSER_DATABASE_URL=postgres://purser_user:${PURSER_DB_PASSWORD}@postgres:5432/purser?sslmode=disable
      - PURSER_API_TOKEN=${PURSER_API_TOKEN}
      # Switchyard connector: create user + mint token. Scopes
      # {users:manage, projects:manage} — not admin.
      #
      # This read ${SWITCHYARD_BOOTSTRAP_TOKEN} until SERV-113. PRSR-25 minted the
      # dedicated token and set it in PROD_ENV_FILE but never rewired this line, so
      # the value was synced and never read — and the bootstrap token it kept using
      # was revoked server-side, 401ing every call. Latent, because provisioning
      # only runs on demand.
      - PURSER_SWITCHYARD_BASE_URL=http://switchyard:4002
      - PURSER_SWITCHYARD_TOKEN=${PURSER_SWITCHYARD_TOKEN}
      - PURSER_SWITCHYARD_URL=https://switchyard.zerogravity.industries
      # Cloudflare Access connector (SERV-36). Unset => `--to cloudflare` prints
      # the manual dashboard step instead of granting access via the API.
      - PURSER_CF_API_TOKEN=${PURSER_CF_API_TOKEN:-}
      - PURSER_CF_ACCOUNT_ID=${PURSER_CF_ACCOUNT_ID:-}
      - PURSER_CF_ACCESS_GROUP_ID=${PURSER_CF_ACCESS_GROUP_ID:-}
      - PURSER_CF_ACCESS_GROUP_NAME=zerogravity-members
      - PURSER_CF_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      # Service spin-up coordinates (PRSR-22). Unread until those connectors
      # exist; carried now so the env plumbing lands once (PRSR-11). Unset
      # changes nothing. PURSER_CF_TUNNEL_ID is the same value as
      # CLOUDFLARE_TUNNEL_ID.
      - PURSER_CF_ZONE_ID=${PURSER_CF_ZONE_ID:-}
      - PURSER_CF_TUNNEL_ID=${PURSER_CF_TUNNEL_ID:-}
      # Lyceum connector (SERV-42). OWNER_TOKEN must be an owner *session* token:
      # redeem a `lyceum mint-token` invite via POST /auth/session — a
      # LYCEUM_API_TOKENS entry can't reach /admin. The lyceum service must also
      # run with LYCEUM_AUTH=true. Unset => connector registers as Unavailable.
      - PURSER_LYCEUM_BASE_URL=http://lyceum:4005
      - PURSER_LYCEUM_OWNER_TOKEN=${PURSER_LYCEUM_OWNER_TOKEN:-}
      - PURSER_LYCEUM_URL=https://lyceum.zerogravity.industries
      # Argosy connector (SERV-50): create account + return the one-time
      # password. Reuses the same secret the argosy service holds — argosy
      # registers POST /api/v1/admin/accounts only when ARGOSY_PROVISION_TOKEN is
      # set and 404s the route otherwise, so the two must stay in lockstep.
      # Unset => connector registers as Unavailable. Note port 8096, not 8080.
      - PURSER_ARGOSY_BASE_URL=http://argosy:8096
      - PURSER_ARGOSY_PROVISION_TOKEN=${ARGOSY_PROVISION_TOKEN:-}
      - PURSER_ARGOSY_URL=https://argosy.zerogravity.industries
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4006/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- PLACARD (canonical home for service marks) — PCAD-1 / IDEA-22 ---
  # Public brand-asset service: the designed front page, a mirror of every mark
  # in the placard repo, /api/services for PRSR-29's Access-app connector, and
  # periodic verification that the canonical jsDelivr URLs still serve images
  # (Cloudflare accepts a 404 logo_url without complaint — placard is what
  # notices). Its Traefik router is DELIBERATELY ungated: every surface this
  # host serves — mark mirror, front page, API — is public-with-no-session by
  # contract, because placard-host URLs get rendered sessionless in viewers'
  # browsers (launcher tiles pointed at the mirror, service badges), and a gate
  # turns each of those into silent login-HTML-instead-of-an-image failures.
  # Everything served is already public in the GitHub repo; the one write path
  # (staged uploads) is token-gated in the app. Full argument at the router:
  # config/traefik/dynamic/routers.yml.
  placard:
    image: ghcr.io/einlanzerous/placard:${PLACARD_TAG:-latest}
    container_name: placard
    restart: unless-stopped
    ports:
      - "${PLACARD_PORT:-4009}:4009"
    environment:
      - PLACARD_ADDR=:4009
      - PLACARD_DATABASE_URL=postgres://placard_user:${PLACARD_DB_PASSWORD}@postgres:5432/placard?sslmode=disable
      # Gates POST /api/services/{slug}/upload and staged reads. Blank =>
      # uploads disabled; marks and the front page still serve.
      - PLACARD_UPLOAD_TOKEN=${PLACARD_UPLOAD_TOKEN:-}
      # Edge self-check (PCAD-10): every check pass also fetches the front
      # page and one mirror mark THROUGH this public hostname, redirects not
      # followed — so an Access gate landing on the hostname (it happened on
      # day one, invisible to everyone signed in) records as failing checks
      # and raises a front-page alert instead of needing a manual curl.
      - PLACARD_PUBLIC_BASE_URL=https://placard.zerogravity.industries
      # 15m, not placard's 6h default, because the edge check above rides this
      # tick: the day-one gate lasted ~30 minutes, and a detection window
      # coarser than the incident it exists to catch isn't detection. The
      # canonical jsDelivr checks come along — 18 small GETs every 15 minutes
      # is noise to a CDN.
      - PLACARD_CHECK_INTERVAL=15m
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4009/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- INTERLOCK (city + state legislation tracker) — ITLK-18 ---
  # Nuxt/Nitro SSR app: serves the UI and its /api behind single-user session auth
  # (ITLK-13). SESSION_PASSWORD seals the cookie; AUTH_PASSWORD_HASH is the scrypt
  # login hash (`bun run auth:hash` in the interlock repo). Public exposure — Traefik
  # router + cloudflared + CF Access — is ITLK-19; until then the host port is how you
  # reach it. Flip INTERLOCK_AUTH_COOKIE_SECURE=true once it's served over HTTPS.
  interlock-web:
    image: ghcr.io/einlanzerous/interlock/web:${INTERLOCK_TAG:-latest}
    container_name: interlock-web
    restart: unless-stopped
    ports:
      - "${INTERLOCK_PORT:-4007}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://interlock_user:${INTERLOCK_DB_PASSWORD}@postgres:5432/interlock?sslmode=disable
      - SESSION_PASSWORD=${INTERLOCK_SESSION_PASSWORD}
      - AUTH_PASSWORD_HASH=${INTERLOCK_AUTH_PASSWORD_HASH}
      - AUTH_COOKIE_SECURE=${INTERLOCK_AUTH_COOKIE_SECURE:-false}
      # Keep the UI and ingest in agreement on the sponsor auto-link threshold.
      - MATCH_NAME_SIMILARITY_THRESHOLD=${INTERLOCK_MATCH_THRESHOLD:-0.85}
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      # /api/health is public (unauthenticated); bun is in the image, so no extra tools.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(h=>process.exit(h.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # The headless poller + normalizer + alerter. No host port. `restart: unless-stopped`
  # + the persisted fetch_cursor gives crash-resume, and it also rides out the first-boot
  # race where the interlock DB isn't created until the deploy's init-db step runs after
  # `up -d` (the worker crash-loops for a few seconds, then migrates and polls).
  interlock-worker:
    image: ghcr.io/einlanzerous/interlock/worker:${INTERLOCK_TAG:-latest}
    container_name: interlock-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://interlock_user:${INTERLOCK_DB_PASSWORD}@postgres:5432/interlock?sslmode=disable
      # Illinois GA ingest. Blank => Chicago-only (the Clerk's eLMS needs no key); logged loudly.
      - LEGISCAN_API_KEY=${INTERLOCK_LEGISCAN_API_KEY:-}
      # Email alerts. Blank => in-app alerts only.
      - SMTP_URL=${INTERLOCK_SMTP_URL:-}
      - ALERT_EMAIL_TO=${INTERLOCK_ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_FROM=${INTERLOCK_ALERT_EMAIL_FROM:-}
      - MATCH_NAME_SIMILARITY_THRESHOLD=${INTERLOCK_MATCH_THRESHOLD:-0.85}
    networks:
      - construct_net
    depends_on:
      - postgres
    healthcheck:
      # The worker is headless — no HTTP server, so there is nothing to curl, and it
      # had no healthcheck at all until SERV-102. That is how it sat dead for an hour
      # on 2026-08-15 and was found by grepping a dependent's logs rather than by any
      # signal the stack produced.
      #
      # What this asserts is that the worker's OWN long-lived connection is still
      # writing, which is the thing that broke. pg-boss touches pgboss.version from its
      # maintenance loops every few seconds (measured over 10 minutes: median 4.3s,
      # p95 4.9s, max 8.6s), so a stale timestamp means the worker is not talking to the
      # database even though the database is fine.
      #
      # That distinction is the whole point, and it is why this does not simply open a
      # connection and `SELECT 1`. The probe is a NEW process, so it re-resolves DNS and
      # connects happily to the new postgres address — it would have reported healthy
      # for the entire outage while the worker's pool sat on the dead IP. Reading a
      # timestamp only the worker can update is what makes the check see what the worker
      # sees.
      #
      # 300s against that 8.6s ceiling is ~35x headroom, deliberately: a false
      # unhealthy here is worse than a slow true one now that deploy.yml fails on an
      # unhealthy container. It still catches an hour-long stall within five minutes.
      #
      # The `typeof r.age === 'number'` guard is load-bearing, not defensive noise. Those
      # columns are nullable, and pg-boss leaves them NULL until its first maintenance
      # pass — so on a fresh database GREATEST(...) is NULL, EXTRACT returns NULL, and
      # `null < 300` is **true** in JavaScript. Without the guard the probe reports
      # healthy in precisely the case it exists to catch: no heartbeat at all.
      #
      # Uses Bun.SQL, the runtime's own client, NOT `require('pg')`: pg is a transitive
      # dependency that does not resolve from /app, and a probe that cannot load its
      # driver exits 0 — a healthcheck that can only ever pass. Verified this one exits
      # 1 for a stale heartbeat, a NULL heartbeat, an unreachable database, and a
      # missing table.
      #
      # It does reach into pg-boss's internal table, which is a coupling worth naming:
      # if a pg-boss upgrade renames it the check fails loudly rather than silently
      # passing, which is the right way round. ITLK-31 replaces this with a liveness
      # endpoint the worker owns.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const s=new Bun.SQL(process.env.DATABASE_URL,{max:1,connectionTimeout:5});const [r]=await s.unsafe('SELECT EXTRACT(EPOCH FROM now()-GREATEST(cron_on,bam_on,flow_on))::float8 AS age FROM pgboss.version');await s.end();process.exit(r&&typeof r.age==='number'&&r.age<300?0:1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      # Generous: on a first deploy this container crash-loops until the deploy's
      # init-db step creates the interlock database, then migrates before pg-boss
      # starts writing (see the note above the service).
      start_period: 90s

  # --- AMBER (Claude Code transcript capture + preservation) — AMBR-4 ---
  # Redacts and archives Claude Code transcript data before the rolling retention
  # sweep deletes it, and indexes what it archived into Postgres. The archive on
  # /mnt/ssd_storage is the source of truth; the database is a derived index that
  # `amber reindex` can rebuild from it, so a Postgres outage degrades search but
  # does not stop capture.
  #
  # Like interlock-worker, this crash-loops for a few seconds on a first deploy:
  # the `amber` database does not exist until the deploy's init-db step runs
  # *after* `up -d`. `restart: unless-stopped` rides it out.
  amber:
    image: ghcr.io/einlanzerous/amber:${AMBER_TAG:-latest}
    container_name: amber
    restart: unless-stopped
    depends_on:
      - postgres
    # `serve` drains deliberately on SIGTERM: up to two minutes for an in-flight
    # HTTP-triggered pass, then up to two more for a scheduled one. Docker's
    # default is to SIGKILL after 10 seconds, which would make that drain
    # unreachable and throw away a partly-finished pass on every deploy. The
    # archive writes are atomic so nothing corrupts — it just has to be redone.
    stop_grace_period: 5m
    # `projects/` on the host is mode 0700 and owned by uid 1000, and the
    # archive directory is owned by the same uid. Running as root would read the
    # sources fine and then write an archive nothing else on the host can
    # manage, so the uid is pinned rather than left to the image.
    user: "1000:1000"
    # The host port exists for Uptime Kuma, which is NOT on construct_net
    # (construct-server README) and therefore cannot reach http://amber:4008.
    # Its monitor targets http://<host>:4008/readyz. /readyz and /healthz are
    # unauthenticated by design; the /v1 endpoints behind AMBER_API_TOKEN are the
    # ones that read prompt text.
    ports:
      - "${AMBER_PORT:-4008}:4008"
    environment:
      - AMBER_ADDR=:4008
      - AMBER_DATABASE_URL=postgres://amber_user:${AMBER_DB_PASSWORD}@postgres:5432/amber?sslmode=disable
      - AMBER_API_TOKEN=${AMBER_API_TOKEN}
      # Required — Amber refuses to start without it. Generate once with
      # `openssl rand -hex 32` and then LEAVE IT ALONE: redaction fingerprints
      # are salted with it, so rotating it silently makes every fingerprint
      # already in the index incomparable with every one written after.
      - AMBER_REDACTION_SALT=${AMBER_REDACTION_SALT}
      # Container-side paths for the two read-only source mounts below.
      - AMBER_PROJECTS_DIR=/sources/projects
      - AMBER_HISTORY_FILE=/sources/history.jsonl
      - AMBER_ARCHIVE_DIR=/archive
      # A pass over the current corpus takes ~5 minutes, and the cost is reading
      # and redacting everything rather than writing, so it does not fall as the
      # corpus goes quiet. Don't shorten this without measuring.
      - AMBER_INGEST_INTERVAL=${AMBER_INGEST_INTERVAL:-6h}
      # Must exceed AMBER_INGEST_INTERVAL — config refuses to start otherwise,
      # rather than letting /readyz go red between two perfectly normal runs.
      - AMBER_STALE_AFTER=${AMBER_STALE_AFTER:-36h}
      # No AMBER_CLEANUP_PERIOD_DAYS override. The host went back to
      # cleanupPeriodDays=30 in AMBR-5, which is also Amber's built-in default,
      # so the safe value and the true value now agree and there is nothing to
      # state. Set it again only if the host's setting is raised — and set it to
      # the REAL value, since guessing high reads comfortable right up until the
      # sweep takes the file, while guessing low only costs an early warning.
      - AMBER_LOSS_WARN_DAYS=${AMBER_LOSS_WARN_DAYS:-7}
    volumes:
      # NEVER mount ~/.claude wholesale — it contains .credentials.json (live
      # OAuth credentials). The two sources are mounted individually and
      # read-only; Amber has no reason to write to either, and the archive is
      # the only writable path it gets.
      - /home/magos/.claude/projects:/sources/projects:ro
      # Bind-mounting a single FILE pins its inode for the life of the container.
      # Claude Code appends to history.jsonl in place, so this is correct today —
      # but if it ever switches to an atomic write (temp file + rename), the
      # container keeps reading the old inode and captures nothing new from it,
      # silently and forever. Mounting the parent directory is the usual fix and
      # is exactly what must not happen here. If history coverage ever flatlines
      # while the host file grows, this is why; recreating the container clears
      # it. `amber verify` against the host's line count is the check.
      - /home/magos/.claude/history.jsonl:/sources/history.jsonl:ro
      - /mnt/ssd_storage/amber:/archive
    networks:
      - construct_net
    healthcheck:
      # /readyz is 503 until a successful ingest has been recorded, and the first
      # pass on a cold archive takes ~5 minutes — so start_period has to be
      # generous or every fresh deploy flags unhealthy before Amber has done
      # anything wrong. Nothing depends_on amber's health, so `unhealthy` is a
      # signal to look at, not a restart trigger.
      #
      # interval deliberately exceeds the 60s coverage cache inside /readyz. At
      # exactly 60s every probe landed on the expiry and redid the coverage scan
      # the cache exists to avoid — and Kuma is polling the same endpoint. At
      # 120s this probe still recomputes, but Kuma's polls in between are served
      # from cache instead of each triggering their own scan.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4008/readyz"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 15m

  # --- DRYDOCK SHELL (web terminal multiplexer for AI CLIs) — SERV-71 ---
  # Static Vite bundle behind nginx. The DAEMON is not here and must not be: it
  # holds agent PTYs and spawns `claude` as the host user, with the host's repos,
  # toolchain and ~/.claude — a container would strip all of that. It runs as the
  # systemd user unit `drydock-daemon` on :4318 instead.
  #
  # So this container serves files and nothing else. The browser talks to the
  # daemon DIRECTLY on :4318, which is why DRYDOCK_DAEMON_PORT is a port and not
  # a URL: the image regenerates /config.js at start and the page resolves the
  # daemon on whatever host served it, so one image works from localhost, the
  # LAN, or Tailscale with no hostname baked in.
  #
  # No watchtower label on purpose — this one SHOULD auto-update, since the
  # bundle is rebuilt and pushed on every main push that touches shell/**.
  #
  # And no `networks:` key, deliberately: it talks to nothing in the stack, so
  # it stays on the project default network rather than joining construct_net
  # where postgres and every first-party service sit. Same shape as open-webui,
  # copyparty, uptime-kuma and aperture — publish a port, join nothing.
  drydock-shell:
    image: ghcr.io/einlanzerous/drydock/shell:${DRYDOCK_TAG:-latest}
    container_name: drydock-shell
    restart: unless-stopped
    ports:
      - "5321:80"
    environment:
      - DRYDOCK_DAEMON_PORT=4318

  # --- ESTATE WIKI (SERV-101) — generated, served read-only ---
  # A static site and nothing more: no database, no auth surface, no state. The
  # content is GENERATED from this file, versions.env and each repo's own docs by
  # `wiki/generate`, built by deploy.yml, and rsynced to $DEPLOY_ROOT/wiki/site.
  # That is the whole design — the generator is the product, this container is a
  # file server for its output.
  #
  # A wiki app (Docmost, Outline, BookStack) was the obvious alternative and was
  # rejected: it buys editing and full-text search at the cost of another stateful
  # service, another database and another auth surface — and the first hand-edit of
  # a generated page reintroduces exactly the drift this tier exists to prevent.
  # Search here is a build-time index shipped with the bundle, so it costs nothing
  # at runtime.
  #
  # No published port, deliberately. Like switchyard's backend, this is reachable
  # only from construct_net, so the ONLY route in is the tunneled Traefik router on
  # the unpublished `internal` entrypoint, gated by Cloudflare Access. There is no
  # host binding to bypass that with.
  #
  # The mount is read-only and the site is rebuilt on every deploy, so a change made
  # inside the container does not survive and could not be written in the first
  # place.
  wiki:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: wiki
    restart: unless-stopped
    volumes:
      - ./wiki/site:/usr/share/nginx/html:ro
      - ./config/wiki/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - construct_net

  # --- EDGE PROXY (Traefik) — Zero Gravity Industries hybrid edge (SERV-20) ---
  # Split entrypoints are the security keystone: `public` (WAN-forwarded 443) serves
  # ONLY Argosy + a deny-all catch-all; `internal` (:9080 HTTP, deliberately NOT
  # published) carries the tunneled apps and is the cloudflared origin. Identity headers are
  # stripped on ingress. TLS via Let's Encrypt DNS-01 (Cloudflare). File provider only
  # — no Docker socket, edge policy is committed under config/traefik/.
  #
  # LIVE for both paths: cloudflared → internal → switchyard/lyceum (gated by Cloudflare
  # Access), and WAN 443 → public → Argosy (SERV-26, static IP via the Plume forward).
  # The public path is hardened by CrowdSec (SERV-27): the crowdsec service below parses
  # the access log; the bouncer plugin on the Argosy routers enforces its decisions.
  # See docs/zerogravity-edge.md.
  traefik:
    image: traefik:v3.3@sha256:2cd5cc75530c8d07ae0587c743d23eb30cae2436d07017a5ff78498b1a43d09f   # v3.3.7
    container_name: traefik
    restart: unless-stopped
    # Host 443 -> Traefik's `public` entrypoint (:8443) for the Argosy WAN path (SERV-26).
    # Tailscale Funnel previously held 443; it was moved off (the Switchyard GitHub webhook
    # now rides cloudflared — SERV-45), freeing the port. Neither the `internal` (:9080)
    # nor the dashboard (:8080) entrypoint is published, so the open WAN port can only ever
    # reach the Argosy router — never a tunneled app. `internal` additionally binds a single
    # address on construct_edge_net (SERV-107) and every router on it is now gated by
    # cf-access-guard below (SERV-106).
    ports:
      - "443:8443"   # WAN 443 -> host 443 -> public entrypoint (:8443)
    environment:
      # Scoped Cloudflare token (Zone:DNS:Edit on zerogravity.industries) for the
      # ACME DNS-01 challenge. Set in .env once minted (SERV-14 / SERV-21).
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      # LAPI key for the CrowdSec bouncer plugin (SERV-27). Minted once via
      # `docker exec crowdsec cscli bouncers add traefik-bouncer -o raw` → .env.
      # Referenced from dynamic/routers.yml via file-provider go-templating.
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY:-}
      # The value Traefik stamps on X-Chronicle-Proxy-Secret for every Chronicle
      # router (CHRN-75 / SERV-148), so Chronicle can tell a request that came
      # through the edge from one a neighbour on construct_net sent it directly.
      # Same variable on the chronicle service above, and the comment there is
      # where the reasoning lives. Like the LAPI key above, it is referenced from
      # dynamic/routers.yml via file-provider go-templating — `{{ env "..." }}`
      # and NOT `${...}`, which that provider does not expand.
      - CHRONICLE_PROXY_SECRET=${CHRONICLE_PROXY_SECRET:-}
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
      - traefik_access_logs:/var/log/traefik
    networks:
      # Both, and for different jobs (SERV-107). construct_net is how Traefik reaches the
      # backends it proxies to; construct_edge_net is the only place the `internal`
      # entrypoint listens. The static address is not cosmetic — traefik.yml binds
      # `internal` to exactly 172.31.240.10:9080, so this value and that one have to
      # agree or cloudflared cannot reach Traefik and every tunneled app goes dark.
      construct_net: {}
      construct_edge_net:
        ipv4_address: 172.31.240.10
    depends_on:
      # Ordering only, not a health gate. Traefik retries forwardAuth per request,
      # so a guard that is still starting costs a few seconds of 500s on the
      # tunneled hosts; waiting for it to report healthy would instead hold the
      # WAN/Argosy path down for the same window, which is the worse trade.
      - cf-access-guard

  # --- ORIGIN AUTH (cf-access-guard) — SERV-106 ---
  # Validates the Cloudflare Access JWT at the ORIGIN. Cloudflare Access is enforced
  # at Cloudflare's edge; until this shipped the origin re-checked nothing, so anything
  # that could open a connection to the `internal` entrypoint got the tunneled apps by
  # setting a Host header — demonstrated, not theorised:
  #
  #   curl -H "Host: switchyard.zerogravity.industries" http://traefik:9080/   -> 200
  #
  # unauthenticated production Switchyard. SERV-107 bound that entrypoint to one address
  # on construct_edge_net so construct_net can no longer reach it, but that makes the
  # request UNROUTABLE, not rejected — and anything with host access or the docker socket
  # still reaches the port. The two are complementary: SERV-107 restored the boundary,
  # this removes the dependence on there being one.
  #
  # Wired in as a Traefik `forwardAuth` target (see config/traefik/dynamic/routers.yml),
  # not as a Traefik plugin. A plugin runs Yaegi-interpreted inside Traefik, so a fault in
  # it takes the whole edge down — including the public Argosy path, which this has nothing
  # to do with. As a sidecar its worst failure is a 503 on the tunneled hosts, and it
  # can be tested with `go test` instead of by restarting the edge. (That said "three"
  # until SERV-99; the count is derivable from routers.yml and was stale within weeks, so
  # it is deliberately not restated here.)
  #
  # construct_edge_net ONLY, deliberately: Traefik is the sole caller, and the guard has no
  # business being reachable from the ~30 containers on construct_net. It does need egress,
  # to fetch the team's signing keys from <team>.cloudflareaccess.com.
  #
  # BUILT here rather than pinned to a published tag, which is the one exception to the
  # first-party pinning invariant (SERV-96). It is stdlib-only Go with no dependencies to
  # resolve and no release cadence of its own, and its source sits beside the compose file
  # it protects; deploy.yml builds it explicitly so a source edit lands on the next deploy.
  # `docker compose config --images` reports it as `construct-server-cf-access-guard`, which
  # is not a ghcr.io/einlanzerous ref, so the pinning assertion correctly ignores it.
  cf-access-guard:
    build:
      context: ./services/cf-access-guard
      # The shared Access verifier (SERV-131), as a NAMED context rather than by
      # widening the build context to the deploy root. The deploy root holds the
      # rendered .env, and making it a docker build context would put every
      # credential in the stack one .dockerignore mistake away from an image
      # layer. deploy.yml rsyncs this directory alongside the service's own.
      additional_contexts:
        cfaccess: ./pkg/cfaccess
      args:
        # deploy.yml sets this from
        # `git log -1 -- services/cf-access-guard pkg/cfaccess` — BOTH paths since
        # SERV-131, because the guard's behaviour is partly in the shared module now
        # and a revision taken from the service directory alone would be unchanged by
        # a module-only edit. See the Dockerfile for why the image needs a source
        # identity at all (SERV-109).
        # `:-unknown` and not `:-`: an empty build arg would stamp an empty label, which
        # would compare equal to a container that has no label, and "no evidence" would
        # silently read as "up to date".
        GUARD_REVISION: ${GUARD_REVISION:-unknown}
    container_name: cf-access-guard
    restart: unless-stopped
    environment:
      # Public identifiers, not secrets — same reasoning (and the same values) as the
      # CF_ACCESS_* pairs switchyard and lyceum already carry for their own SSO sign-in
      # (SWY-161, LYCM-803). The AUD is an application identifier; possession of one grants
      # nothing, and every check here is cryptographic. Keeping them tracked makes an Access
      # application change a reviewable diff.
      - CF_ACCESS_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      # host=aud, one entry per router on the `internal` entrypoint. Each Access
      # application has its OWN AUD while every token on the team domain is signed by the
      # same key — so without the per-host mapping a token minted for the wiki would open
      # Switchyard. A host missing from this map is REFUSED, not waved through: a new
      # tunneled router that nobody mapped is unreachable, which is loud, rather than
      # unauthenticated, which is not. scripts/check-edge-auth.sh asserts that this list
      # and the routers agree, so they cannot drift apart silently.
      - CF_ACCESS_AUD_MAP=switchyard.zerogravity.industries=d3404fc362067f48ff1fd6c9a7fc9a1fd723510c2681feed15e35159649963de,lyceum.zerogravity.industries=e9bace230db8a112935e8d931393424390c840e0c58af7b8ccda21cb60e68850,wiki.zerogravity.industries=a0d75d29e6b849c4d1557e045c92cd830f060f1ae4370a7ea215fc3e68bce3a2,chronicle.zerogravity.industries=48bc1ca35a8a6bcf17c242cac59e209a53e58e5213b1656c82d3053df062f1ec,mcp.zerogravity.industries=47cb76de601dfe7aa7aa657935a76940588ecf22c802ec100782f40804929466
      # enforce | audit. `audit` logs the decision it WOULD have made and allows the
      # request anyway — it exists so the cutover could be rehearsed against real traffic
      # before three live routers went fail-closed at once, and it is not a steady state.
      # check-edge-auth.sh fails while it is set, which is what stops it surviving here.
      - CF_ACCESS_GUARD_MODE=${CF_ACCESS_GUARD_MODE:-enforce}
    networks:
      - construct_edge_net
    healthcheck:
      # The image is FROM scratch — no shell, no wget, no curl — so the binary probes
      # itself. /healthz goes 503 when no signing key set has ever loaded, and when
      # refreshes have been failing long enough that the cached keys may no longer be the
      # ones Cloudflare signs with. Both are states where every request is about to start
      # failing, which is exactly what a healthcheck should be able to say (SERV-102).
      test: ["CMD", "/cf-access-guard", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- CROWDSEC (SERV-27) — behavioral IPS for the open WAN path ---
  # Parses Traefik's JSON access log (shared volume, read-only) with the
  # crowdsecurity/traefik collection; scenario hits (brute force, scanning,
  # http-probing…) become ban decisions served over its LAPI (:8080, construct_net
  # only — never published). Traefik's crowdsec-bouncer middleware enforces them
  # on the public Argosy routers. LAN/tailnet are exempt at the bouncer, so a
  # false positive can never lock us out of our own edge.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik
    volumes:
      - ./config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - traefik_access_logs:/var/log/traefik:ro
    networks:
      - construct_net

  # --- CLOUDFLARE TUNNEL (cloudflared) — SERV-23 ---
  # Dashboard-managed (token) tunnel. Runs ON construct_net so it can reach Traefik's
  # unpublished `internal` entrypoint at http://traefik:9080 — a host-run connector
  # cannot, which is why this must be containerized here. Ingress (public hostname →
  # http://traefik:9080) is configured in the Zero Trust dashboard (SERV-24), not a
  # local config file. No open ports: cloudflared dials out to the Cloudflare edge.
  #
  # NOTE: retire any host-run `cloudflared tunnel run` (and its systemd service)
  # before starting this — two connectors on one token would let Cloudflare route
  # requests to the host connector, which can't reach traefik:9080. See docs.
  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Same token you stored in .env for the host run — reused verbatim.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      # construct_edge_net ONLY, deliberately (SERV-107). Every ingress rule on this
      # tunnel points at http://traefik:9080 — read from the running config, which is
      # remotely managed and therefore not in this repo, so treat this as a snapshot
      # rather than a source of truth:
      #
      #   <tunneled host>.zerogravity.industries -> http://traefik:9080
      #   (catch-all)                            -> http_status:404
      #
      # The authoritative list of tunneled hosts is the `internal` routers in
      # config/traefik/dynamic/routers.yml; this comment named three of them and was
      # stale by three more before anyone noticed, which is why it no longer enumerates.
      # SERV-99 adds mcp.zerogravity.industries, and its dashboard half — the ingress
      # rule and the Access application — is the part no file here can make.
      #
      # so it needs nothing from construct_net. Keeping it off that network is half of
      # what makes the entrypoint's bind address meaningful: Traefik listens on one
      # address, and this is the only other *container* that can reach it. The host
      # still can — Linux routes to container addresses whether or not a port is
      # published — and so does anything holding the docker socket. Both are larger
      # compromises than the one this closes; see config/traefik/traefik.yml.
      #
      # If a future ingress rule points at a service directly instead of at Traefik, it
      # will fail to resolve here — that is the intended failure. Route it through
      # Traefik rather than re-adding construct_net.
      - construct_edge_net
    depends_on:
      - traefik

  # --- IDENTITY (Authentik) — SERV-19 ---
  # Self-hosted IdP and source of truth for the hybrid edge. Uses the shared
  # postgres (authentik DB provisioned by db/init-db.sh) + a dedicated Redis.
  # NO public exposure: the server HTTP port is bound to localhost only for
  # first-boot admin (akadmin) setup; Phase 2 fronts it via Traefik `internal`
  # + an Access-exempt tunnel hostname. Forward-auth/OIDC integrations point at
  # http://authentik-server:9000 over construct_net, so identity on the direct
  # path survives a Cloudflare outage.
  authentik-server:
    image: ghcr.io/goauthentik/server:stable@sha256:0dadc80ef27e3620b5aa8e35273b9f8939051eee439d9f0a04f8a77e197cdd3f
    container_name: authentik-server
    restart: unless-stopped
    # Gated behind the `identity` profile: NOT started by a plain `docker compose up -d`.
    # Bring up deliberately AFTER setting AUTHENTIK_* secrets in .env and provisioning
    # the DB (postgres must be recreated to pick up AUTHENTIK_DB_PASSWORD, then `make db-init`):
    #   docker compose --profile identity up -d authentik-redis authentik-server authentik-worker
    profiles: ["identity"]
    command: server
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__PORT=5432
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__USER=authentik_user
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      # First-boot admin bootstrap (akadmin). Consumed only on initial DB init.
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN:-}
    ports:
      # localhost-only — reach via SSH forward for initial setup; never 0.0.0.0.
      - "127.0.0.1:9000:9000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      - postgres
      - authentik-redis
    networks:
      - construct_net
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:stable@sha256:0dadc80ef27e3620b5aa8e35273b9f8939051eee439d9f0a04f8a77e197cdd3f
    container_name: authentik-worker
    restart: unless-stopped
    profiles: ["identity"]
    command: worker
    # Background tasks (cert rotation, outpost mgmt, email). Upstream runs the
    # worker as root. No Docker socket mounted — Traefik forward-auth uses the
    # embedded outpost in the server, so no docker-managed outposts are needed.
    user: root
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__PORT=5432
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__USER=authentik_user
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      - postgres
      - authentik-redis
    networks:
      - construct_net

  # Dedicated Redis for Authentik (nothing else in the stack uses one).
  authentik-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2   # 7.4.10-alpine
    container_name: authentik-redis
    restart: unless-stopped
    profiles: ["identity"]
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    networks:
      - construct_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  open-webui:
  ollama_data:
  copyparty_data:
  uptime-kuma-data:
  semaphore_data:
  postgres_data:
  switchyard_uploads:
  argosy_artwork:
  argosy_subtitles:
  argosy_transcode:
  lyceum_data:
  # Zero Gravity Industries hybrid edge (SERV-19/20)
  traefik_letsencrypt:
  traefik_access_logs:
  crowdsec_config:
  crowdsec_data:
  authentik_media:
  authentik_templates:
  authentik_redis_data:

networks:
  construct_net:
    external: true

  # The cloudflared -> Traefik leg, and nothing else (SERV-107).
  #
  # Traefik's `internal` entrypoint used to listen on :9080 across every interface,
  # which on a shared network means every neighbour. Demonstrated, not theorised —
  # from a throwaway container on construct_net:
  #
  #   curl -H "Host: switchyard.zerogravity.industries" http://traefik:9080/   -> HTTP 200
  #
  # Prod Switchyard, unauthenticated, because Cloudflare Access is enforced at
  # Cloudflare's edge and the origin trusted whatever reached it. ~30 containers sat on
  # that network, several running fairly arbitrary workloads (n8n, open-webui, copyparty).
  #
  # Putting the tunnel leg on its own network lets the entrypoint bind to ONE address
  # that only cloudflared shares, so the bypass stops being reachable rather than being
  # merely discouraged. Compose-managed with an explicit subnet because binding to a
  # fixed address needs a fixed address — construct_net is `external:` with default IPAM
  # and cannot assign one without being recreated, which would recreate every container
  # on the box.
  #
  # This authenticates nothing on its own — that is cf-access-guard's job (SERV-106),
  # and the two are complementary rather than alternatives. This restored the boundary
  # that SERV-25's deferral quietly depended on; the guard removed the dependence on
  # there being one. Keep both: the bind decides who can connect, the middleware
  # decides who is served, and neither makes the other redundant.
  construct_edge_net:
    name: construct_edge_net
    ipam:
      config:
        # 172.31.240.0/24 — deliberately clear of the 172.17-172.26 /16s Docker has
        # already allocated on this host, so it cannot collide as networks come and go.
        - subnet: 172.31.240.0/24
